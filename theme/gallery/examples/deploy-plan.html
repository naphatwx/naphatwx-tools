    if (!p.steps.length) list.append(el('li', { class: 'empty' }, 'No steps.'));
    p.steps.forEach((s, i) => {
      const id = stepId(p, i);
      const boxId = 'c-' + id.replace(/[^a-z0-9]/gi, '-');
      const box = el('input', { type: 'checkbox', id: boxId });
      box.addEventListener('change', () => { state[id] = box.checked; save(state); update(); say((box.checked ? 'Done: ' : 'Not done: ') + s.text); });
      const row = el('div', { class: 'step' },
        box,
        el('span', { class: 'number', 'aria-hidden': 'true' }, i + 1),
        el('div', { class: 'body' },
          el('div', { class: 'line' },
            s.risk === 'high' ? el('span', { class: 'pill tone-bad' }, el('span', { 'aria-hidden': 'true' }, '!'), 'high risk') : null,
            s.check ? el('span', { class: 'pill tone-warn' }, el('span', { 'aria-hidden': 'true' }, '?'), 'confirm') : null,
            s.tag ? el('span', { class: 'pill tone-neutral' }, TAGS[s.tag] || s.tag) : null,
            el('label', { for: boxId }, s.text)),
          s.detail ? el('div', { class: 'detail' }, s.detail) : null,
          s.cmd ? el('div', { class: 'command' }, el('code', {}, s.cmd), copyBtn(s.cmd, 'command')) : null,
          s.source ? el('div', { class: 'meta' }, 'From ', el('code', {}, s.source)) : null));
      row.addEventListener('click', (e) => {
        if (e.target.closest('input, label, button, a, code')) return;
        box.checked = !box.checked;
        box.dispatchEvent(new Event('change'));
      });
      list.append(el('li', {}, row));
      rows.push({ row, box, id });
    });
    refs.push({ section, count, bar, pill, rows });
    app.append(section);
  }
  update();
}
render();
</script>
</body>
</html>
