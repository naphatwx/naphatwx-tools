      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;

      /* Page frame: every page centers its content at the same width, 80% of the window up to 900px */
      --page-w: min(80%, 900px);
      --gutter: clamp(16px, 3vw, 24px);

  header { display: grid; gap: 8px; justify-items: start; margin-bottom: 8px; }

    return (d === 'prev' ? i > 0 : i < slides.length - 1) ? d : '';
  };
  frame.onmousemove = (e) => { stage.dataset.side = side(e); };
  frame.onmouseleave = () => { stage.dataset.side = ''; };
  frame.onclick = (e) => { const d = side(e); if (d) { go(d === 'prev' ? -1 : 1); stage.dataset.side = side(e); } };
  // Tall shots make the frame a scroll region, which keyboard users must be able to focus.
  const fit = () => {
    const tall = isTall(img);
    stage.classList.toggle('tall', tall);
    if (tall) { frame.setAttribute('tabindex', '0'); frame.setAttribute('aria-label', 'Full-page screenshot, scrolls vertically'); }
    else { frame.removeAttribute('tabindex'); frame.removeAttribute('aria-label'); }
    hint.hidden = !tall || frame.scrollTop + frame.clientHeight >= frame.scrollHeight - 4;
  };
  img.onload = fit;
  frame.onscroll = fit;
  const items = slides.map((s, n) => {
    const t = st(s.status);
    const b = el('button', { type: 'button' }, el('span', { class: 'n' }, n + 1 + '.'),
      el('span', { class: 'g ' + t.tone, 'aria-hidden': 'true' }, t.glyph), el('span', { class: 't' }, s.title,
      el('span', { class: 'sr-only' }, ', ' + t.word)), el('span', { class: 'ms' }, ms(s.ms)));
    b.onclick = () => { i = n; update(); };
    return el('li', {}, b);
  });
  const list = el('ol', { class: 'list', 'aria-label': 'Steps' }, items);

  const update = () => {
    const s = slides[i];
    title.textContent = (i + 1) + '. ' + s.title;
    status.replaceChildren(pill(s.status));
    time.textContent = ms(s.ms);
    count.textContent = 'Step ' + (i + 1) + ' / ' + slides.length;
    prev.disabled = i === 0;
    next.disabled = i === slides.length - 1;
    full.disabled = !s.shot;
    err.hidden = !s.error;
    err.querySelector('pre').textContent = s.error || '';
    frame.scrollTop = 0;
    img.src = s.shot || NO_SHOT;
    img.alt = s.shot ? s.title : 'No screenshot for this step';
    fit();
    items.forEach((li, n) => {
      const b = li.firstChild;
      if (n === i) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
    });
    // A control that just became disabled drops focus; keep it inside the viewer.
    if (document.activeElement?.disabled) box.focus({ preventScroll: true });
  };
  const go = (d) => { const n = i + d; if (n >= 0 && n < slides.length) { i = n; update(); } };
  prev.onclick = () => go(-1);
  next.onclick = () => go(1);
  full.onclick = () => {
    const s = slides[i];
    zoomImg.src = s.shot; zoomImg.alt = s.title;
    zoom.classList.toggle('tall', isTall(img));
    document.getElementById('zoom-title').textContent = (i + 1) + '. ' + s.title;
    zoom.showModal();
  };
  box.onkeydown = (e) => {
    if (e.target.closest('pre, .frame')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
  };
  box.append(el('div', { class: 'bar' }, title, status, time, count, el('div', { class: 'btns' }, prev, next, full)),
    el('div', { class: 'vbody' }, err, stage, list));
  update();
  return box;
}

const NOTE = { skip: 'Skipped', fixme: 'Fixme', fail: 'Expected to fail' };
let uid = 0;
// Slides a row's panel open or shut; a click mid-slide reverses from the current height.
const EASE = getComputedStyle(document.documentElement).getPropertyValue('--ease').trim() || 'ease';
const calm = matchMedia('(prefers-reduced-motion: reduce)');
function slide(panel, open, instant) {
  const from = panel.hidden ? 0 : panel.getBoundingClientRect().height;
  panel.getAnimations().forEach((a) => a.cancel());
  panel.style.overflow = '';
  panel.hidden = false;
  const to = open ? panel.getBoundingClientRect().height : 0;
  if (instant || calm.matches || from === to) { panel.hidden = !open; return; }
  const cs = getComputedStyle(panel);
  const at = (h) => h ? { height: h + 'px', paddingTop: cs.paddingTop, paddingBottom: cs.paddingBottom, opacity: 1 }
    : { height: '0px', paddingTop: '0px', paddingBottom: '0px', opacity: 0 };
  panel.style.overflow = 'hidden';
  const a = panel.animate([at(from), at(to)], { duration: 220, easing: EASE, fill: 'forwards' });
  a.onfinish = () => { panel.hidden = !open; panel.style.overflow = ''; a.cancel(); };
}

let closeOpen = null;

function testBox(t) {
  const k = kind(t);
  const id = 'test-' + (++uid);
  const box = el('section', { class: 'test', 'aria-labelledby': id + '-h' });
  box.dataset.kind = k;
  const toggle = el('button', { type: 'button', 'aria-expanded': 'false', 'aria-controls': id + '-b' },
    el('span', { class: 'mark', 'aria-hidden': 'true' }), pill(k === 'failed' && st(t.status).tone === 'bad' ? t.status : k), el('span', { class: 't' }, t.title));
  const attempts = t.attempts || [];
  const runs = attempts.length ? ' · ' + (attempts.length + 1) + ' attempts' : t.retry ? ' · retry ' + t.retry : '';
  const head = el('div', { class: 'test-head' }, el('h2', { id: id + '-h' }, toggle),
    el('div', { class: 'info' }, t.scenario ? el('span', { class: 'meta' }, 'scenario ' + t.scenario) : null, el('span', { class: 'meta' }, t.file), el('span', { class: 'meta' }, ms(t.ms) + runs + (t.project ? ' · ' + t.project : ''))));
  // The whole row is a mouse target; keyboard and screen readers use the heading's button.
  head.onclick = (e) => { if (!e.target.closest('button')) toggle.click(); };
  const body = el('div', { class: 'test-body', id: id + '-b' });
  const setOpen = (o, instant) => { box.classList.toggle('open', o); toggle.setAttribute('aria-expanded', String(o)); slide(body, o, instant); };
  toggle.onclick = () => {
    const o = !box.classList.contains('open');
    // Only one test open at a time; the other shuts at once so this row can be scrolled back into view.
    const other = o && closeOpen && closeOpen !== close;
    if (other) closeOpen(true);
    closeOpen = o ? close : null;
    setOpen(o);
    if (other) head.scrollIntoView({ block: 'nearest' });
  };
  const close = (instant) => setOpen(false, instant);

  const notes = t.annotations || [];
  if (notes.length) body.append(el('ul', { class: 'notes', 'aria-label': 'Annotations' },
    notes.map((a) => el('li', {}, el('b', {}, NOTE[a.type] || a.type), a.description || 'no reason given'))));
  const slides = t.steps.slice();
  if (t.finalShot) slides.push({ title: 'Page at failure', status: 'failed', shot: t.finalShot });
  if (slides.length) body.append(viewer(slides));
  else if (!notes.length) body.append(el('div', { class: 'meta' }, k === 'skipped' ? 'Skipped, with no reason given.' : 'This test has no named steps.'));
  // Playwright usually repeats the failed step's error as the test error; show it once.
  const stepErrors = t.steps.map((s) => (s.error || '').trim()).filter(Boolean);
  if (t.error && !stepErrors.some((e) => e === t.error.trim())) body.append(el('div', {}, el('h3', {}, 'Test error'), el('pre', {}, t.error)));
  if (attempts.length) body.append(el('details', { class: 'attempts' },
    el('summary', {}, 'Earlier attempts (' + attempts.length + ')'),
    el('ol', {}, attempts.map((a) => el('li', {},
      el('div', { class: 'att-head' }, el('span', {}, a.retry ? 'Retry ' + a.retry : 'First run'), pill(a.status), el('span', { class: 'meta' }, ms(a.duration))),
      a.error ? el('pre', {}, a.error) : null)))));
  if (k !== 'passed') {
    const cmd = 'npx playwright test ' + t.file + (t.project ? ' --project=' + JSON.stringify(t.project).replace(/^"([\w.-]+)"$/, '$1') : '');
    body.append(el('div', { class: 'cmds' }, cmdRow('Rerun', cmd, 'rerun command for ' + t.title),
      t.trace ? cmdRow('Trace', 'npx playwright show-trace ' + t.trace, 'trace command for ' + t.title) : null));
  }
  box.append(head, body);
  setOpen(false, true);
  return box;
}

function render() {
  const app = document.getElementById('app');
  if (!DATA) { app.append(el('p', {}, 'No data in this report.')); return; }
  const n = { failed: 0, flaky: 0, passed: 0, skipped: 0 };
  for (const t of DATA.tests) n[kind(t)]++;
  const tools = el('div', { class: 'tools', role: 'group', 'aria-label': 'Show tests' });
  const boxes = DATA.tests.map(testBox);
  // Group by use case (UC1, UC2, … then tests with no use case) when any test carries a `use case` annotation.
  const grouped = DATA.tests.some((t) => t.useCase);
  const ucKey = (u) => { const m = /^UC(\d+)/.exec(u || ''); return m ? +m[1] : Infinity; };
  const useCases = [...new Set(DATA.tests.map((t) => t.useCase || ''))].sort((a, b) => ucKey(a) - ucKey(b));
  const heads = new Map(useCases.map((u) => {
    const tests = DATA.tests.filter((t) => (t.useCase || '') === u);
    const passed = tests.filter((t) => kind(t) === 'passed').length;
    return [u, el('h2', { class: 'uc-title' }, u || 'Other tests', el('span', { class: 'meta' }, passed + ' / ' + tests.length + ' passed'))];
  }));
  const none = el('p', { class: 'meta empty-filter', hidden: '' }, 'No tests match this filter.');
  const FILTERS = [['all', 'All', DATA.tests.length], ['failed', 'Failed', n.failed], ['flaky', 'Flaky', n.flaky], ['passed', 'Passed', n.passed], ['skipped', 'Skipped', n.skipped]];
  const buttons = FILTERS.map(([key, label, c]) => {
    const b = el('button', { type: 'button', 'aria-pressed': String(key === 'all') }, label + ' ' + c);
    b.onclick = () => {
      buttons.forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      let shown = 0;
      for (const box of boxes) {
        box.hidden = key !== 'all' && box.dataset.kind !== key;
        if (!box.hidden) shown++;
      }
      for (const [u, h] of heads) h.hidden = !boxes.some((box, i) => !box.hidden && (DATA.tests[i].useCase || '') === u);
      none.hidden = shown > 0;
    };
    return b;
  });
  tools.append(...buttons);
  // Same buckets and order as the filters; a count is colored only when it is not zero.
  const count = (c, word, tone) => el('span', { class: 'lead' + (c && tone ? ' c-' + tone : '') }, c + ' ' + word);
  app.append(el('header', {},
    el('div', {}, el('h1', {}, 'E2E report · ' + DATA.name, pill(DATA.status)),
      el('div', { class: 'summary-line' },
        count(n.failed, 'failed', 'bad'), count(n.flaky, 'flaky', 'warn'), count(n.passed, 'passed'), count(n.skipped, 'skipped'),
        el('span', { class: 'meta' }, DATA.tests.length + ' tests · ' + ms(DATA.ms)),
        el('time', { class: 'meta', datetime: DATA.startedAt }, isoLocal(DATA.startedAt)),
        DATA.baseURL ? el('span', { class: 'meta' }, DATA.baseURL) : null)),
    el('div', { class: 'head-row' }, tools)));
  addExportPdf(app.querySelector('.head-row'));
  // Failed tests first (inside each use case), so the report opens on what needs attention.
  const order = { failed: 0, flaky: 1, passed: 2, skipped: 3 };
  const sorted = boxes.map((b, i) => [b, i]).sort((a, b) => order[a[0].dataset.kind] - order[b[0].dataset.kind] || a[1] - b[1]);
  if (!grouped) sorted.forEach(([b]) => app.append(b));
  else for (const u of useCases) {
    app.append(heads.get(u));
    sorted.filter(([, i]) => (DATA.tests[i].useCase || '') === u).forEach(([b]) => app.append(b));
  }
  app.append(none);
}
render();
</script>
</body>
</html>
