<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E2E Report</title>
<style>
  /* theme:tokens:start */
  /* Synced from theme/tokens.css by theme/sync.mjs. Do not edit here. */
  :root {
      color-scheme: dark;

      /* Surfaces, darkest first */
      --bg: #121316;
      --surface: #18191d;
      --surface-2: #1f2025;
      --surface-3: #24262c;
      --line: #4a4d55;
      --line-strong: #5c6069;
      --line-3: #70737d;
      /* Hover fill for every control: a clear step up from any surface. Hover never changes the border */
      --hover: #33353b;

      /* Ink. Running text is --text; text-2 / text-3 are for chrome and meta labels only */
      --text: #e2e3e7;
      --text-2: #c6c8cf;
      --text-3: #a3a6b0;

      /* One accent */
      --accent: #8ab0ff;
      --accent-fill: #1b2232;
      --accent-soft: rgba(138, 176, 255, 0.12);

      /* Status: one hue set, two meanings. ok = add / pass, warn = change / flaky, bad = drop / fail */
      --ok: #8fd694;
      --warn: #f0c26b;
      --bad: #f28b8d;
      --neutral: #a3a6b0;
      --ok-soft: rgba(143, 214, 148, 0.12);
      --warn-soft: rgba(240, 194, 107, 0.12);
      --bad-soft: rgba(242, 139, 141, 0.12);
      --neutral-soft: rgba(163, 166, 176, 0.12);
      --add: var(--ok);
      --change: var(--warn);
      --drop: var(--bad);

      /* Diagrams: connectors and their labels */
      --connector: #6b6e78;

      /* Type. ui-monospace first, or macOS Chromium falls back to Courier */
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Cascadia Code", monospace;

      /* Type scale. Nothing renders below --fs-xs. Pages set font sizes by role (below), not by step. */
      --fs-xs: 0.75rem;
      --fs-sm: 0.875rem;
      --fs-md: 1rem;
      --fs-lg: 1.25rem;
      --fs-xl: 1.5rem;
      --fs-2xl: 2rem;
      /* Headings and lead line: the same steps on every page */
      --fs-lead: var(--fs-lg);
      --fs-h3: var(--fs-lg);
      --fs-h2: var(--fs-xl);
      --fs-h1: var(--fs-2xl);
      /* Roles: one step down per role, so the eye lands on body text first.
         body = running text, tables, buttons, action bars · meta = hints, asides, legends, captions, code · tag = pills, kbd, counts */
      --fs-body: var(--fs-md);
      --fs-meta: var(--fs-sm);
      --fs-code: var(--fs-sm);
      --fs-tag: var(--fs-xs);
      /* Diagrams draw at 1:1 with shapes sized for 14px: main labels 14, secondary lines (detail, sub, note, type) 12.
         px, not rem, so the text size picker never outgrows the shapes */
      --fs-dia: 14px;
      --fs-dia-sub: 12px;

      /* Max widths: Tailwind max-w steps (md 448px, 3xl 768px, 4xl 896px, 5xl 1024px, 6xl 1152px, 7xl 1280px). Use these, not raw px */
      --max-w-md: 28rem;
      --max-w-3xl: 48rem;
      --max-w-4xl: 56rem;
      --max-w-5xl: 64rem;
      --max-w-6xl: 72rem;
      --max-w-7xl: 80rem;

      /* Page frame: every page centers its content at the same width, 80% of the window up to --max-w-3xl */
      --page-w: min(80%, var(--max-w-3xl));
      --gutter: clamp(16px, 3vw, 24px);

      --radius: 6px;
      --radius-md: 8px;
      --radius-lg: 10px;
      --radius-xl: 12px;
      --ease: cubic-bezier(0.2, 0, 0, 1);
  }
  /* theme:tokens:end */
  /* theme:base:start */
  /* Synced from theme/base.css by theme/sync.mjs. Do not edit here. */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  /* Text size from the picker (theme/pdf.js). Every rem token scales from the root; diagram text is px */
  html[data-font-size="small"] { font-size: 14px; }
  html[data-font-size="medium"] { font-size: 16px; }
  html[data-font-size="large"] { font-size: 18px; }
  body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(138, 176, 255, 0.35); color: #fff; }
  * { scrollbar-width: auto; scrollbar-color: var(--line-3) transparent; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  code, kbd, pre, samp { font-family: var(--mono); }
  /* Label over a group (section, field, table column, step list): uppercase at meta size, tracked so caps stay readable */
  .label, th, dt { color: var(--text-2); font-size: var(--fs-meta); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  /* Data inside a label (counts, names, notes, controls) keeps its own case */
  :is(.label, th, dt) :is(.label-note, button, input, kbd, code) { text-transform: none; letter-spacing: normal; }
  .label-note { font-weight: 400; }
  /* Scenario kind pill: basic (the main path), alternate (another path to the goal), exception (goal not reached).
     Outlined and tinted, so it never reads like the solid Core pill */
  .scenario-kind { display: inline-flex; align-items: center; flex: none; padding: 1px 8px; font: 600 var(--fs-tag)/1.5 var(--mono); text-transform: uppercase; white-space: nowrap; color: var(--neutral); background: var(--neutral-soft); border: 1px solid currentColor; border-radius: 999px; }
  .scenario-kind.basic { color: var(--ok); background: var(--ok-soft); }
  .scenario-kind.exception { color: var(--bad); background: var(--bad-soft); }
  /* Core scenario ("core": true in use-cases.js): play it first. Solid accent so it reads in a long list */
  .core-pill { display: inline-flex; align-items: center; flex: none; padding: 1px 8px; font: 600 var(--fs-tag)/1.5 var(--mono); color: var(--bg); text-transform: uppercase; background: var(--accent); border: 1px solid var(--accent); border-radius: 999px; white-space: nowrap; }
  /* trace IDs hide behind a "N refs" chip; a click shows them on the same line */
  .references-chip { flex: none; padding: 1px 8px; font: var(--fs-tag)/1.5 var(--mono); color: var(--text-2); text-transform: uppercase; background: none; border: 1px solid var(--line-strong); border-radius: 999px; cursor: pointer; }
  .references-chip:hover { background: var(--hover); }
  .references-chip[aria-expanded="true"] { color: var(--accent); border-color: var(--accent); }
  .references-chip[aria-expanded="false"] + .references-ids { display: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
  }
  /* theme:base:end */
  /* theme:pdf:start */
  /* Synced from theme/pdf.css by theme/sync.mjs. Do not edit here. */
  /* .float-bar: one long box at the bottom right; Export PDF goes last, page tools can sit before it */
  .float-bar { position: fixed; right: 20px; bottom: 20px; z-index: 50; display: flex; gap: 2px; padding: 4px; background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: var(--radius-xl); }
  .float-bar button { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border: 0; border-radius: var(--radius-md); background: none; color: var(--text-2); font: 500 var(--fs-body) var(--sans); white-space: nowrap; cursor: pointer; }
  .float-bar button:hover { background: var(--hover); color: var(--text); }
  /* Text size picker: three A's in px, so the picker never resizes itself. A line splits it from Export PDF */
  .font-size-picker { display: inline-flex; align-items: center; gap: 2px; }
  .float-bar .font-size-picker { padding-right: 2px; margin-right: 2px; border-right: 1px solid var(--line); }
  .font-size-picker .font-size-button { display: inline-grid; place-items: center; min-width: 32px; height: 32px; padding: 0 6px; border: 0; border-radius: var(--radius-md); background: none; color: var(--text-2); font-family: var(--sans); font-weight: 600; line-height: 1; cursor: pointer; }
  .font-size-picker .font-size-button:hover { background: var(--hover); color: var(--text); }
  .font-size-picker .font-size-button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
  .font-size-picker .font-size-button[data-size="small"] { font-size: 12px; }
  .font-size-picker .font-size-button[data-size="medium"] { font-size: 15px; }
  .font-size-picker .font-size-button[data-size="large"] { font-size: 18px; }
  /* Room under the last line so the bar never hides it: bar 42px + its 20px offset + a 14px gap.
     An embedded diagram posts its body height with this padding, so the host frame keeps the room too. */
  body:has(.float-bar) { --float-space: 76px; padding-bottom: var(--float-space); }
  @page { margin: 0; }
  @media print {
      html, body { background: var(--bg); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .no-print { display: none !important; }
      body:has(.float-bar) { --float-space: 0px; padding-bottom: 0; }
      pre, figure, img, svg, tr { break-inside: avoid; }
      h1, h2, h3 { break-after: avoid; }
      .references-chip { display: none !important; }
      .references-ids { display: inline !important; }
  }
  /* theme:pdf:end */

  /* buttons first, so the shared pressed filter style below still wins on hover */
  button { font: inherit; font-size: var(--fs-body); border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--text); border-radius: var(--radius); padding: 4px 10px; cursor: pointer; }
  button:hover:not(:disabled) { background: var(--hover); }
  button:disabled { opacity: .45; cursor: default; }
  /* theme:report:start */
  /* Synced from theme/report.css by theme/sync.mjs. Do not edit here. */
  body { font-size: var(--fs-body); line-height: 1.5; }
  [hidden] { display: none !important; }
  /* no sidebar here, so the report gets a wider column than the theme text width */
  main { max-width: min(80%, var(--max-w-4xl)); margin: 0 auto; padding: 16px var(--gutter) 48px; }
  h1 { font-size: var(--fs-h1); line-height: 1.25; margin: 0; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; overflow-wrap: anywhere; }
  code { font-size: var(--fs-code); overflow-wrap: anywhere; }

  .pill { display: inline-flex; gap: 5px; align-items: center; padding: 1px 9px; border-radius: 999px; font-weight: 600; font-size: var(--fs-tag); text-transform: uppercase; white-space: nowrap; }
  .tone-ok { color: var(--ok); background: var(--ok-soft); }
  .tone-warn { color: var(--warn); background: var(--warn-soft); }
  .tone-bad { color: var(--bad); background: var(--bad-soft); }
  .tone-neutral { color: var(--neutral); background: var(--neutral-soft); }
  .tone-accent { color: var(--accent); background: var(--accent-soft); }

  .summary-line .lead { font-weight: 600; }
  .summary-line .meta { font-size: var(--fs-meta); }
  .summary-line .color-bad { color: var(--bad); }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; }
  .tools button[aria-pressed="true"] { background: var(--accent-fill); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .empty-filter { margin-top: 16px; font-size: var(--fs-meta); }
  .head-row { display: flex; gap: 6px 16px; flex-wrap: wrap; align-items: center; }
  .command code { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 3px 8px; color: var(--text); }
  /* theme:report:end */
  /* theme:disclosure:start */
  /* Synced from theme/disclosure.css by theme/sync.mjs. Do not edit here. */
  /* Disclosure is h2 (or h3) > button, not <summary>: a summary flattens any heading inside it for screen readers. */
  .disclosure { border: 1px solid var(--line); border-radius: var(--radius-lg); margin-top: 6px; background: var(--surface); overflow: hidden; }
  .disclosure-head { padding: 8px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; transition: background-color .15s var(--ease); }
  .disclosure-head:hover { background: var(--hover); }
  .disclosure.open { border-color: var(--accent); }
  /* the open row matches the pressed filter button, so it reads as selected */
  .disclosure.open > .disclosure-head, .disclosure.open > .disclosure-head:hover { background: var(--accent-fill); border-bottom: 1px solid var(--line-strong); }
  .disclosure.open > .disclosure-head .mark { color: var(--accent); }
  .disclosure.open > .disclosure-head :is(h2, h3) { font-weight: 600; }
  /* Two lines: mark, status and title, then the facts below. Title at body size keeps rows compact. */
  .disclosure-head :is(h2, h3) { min-width: 0; font-size: var(--fs-body); }
  .disclosure-head :is(h2, h3) button { all: unset; display: flex; flex-direction: row; gap: 12px; align-items: center; cursor: pointer; border-radius: var(--radius); }
  .disclosure-head :is(h2, h3) .pill { flex: none; }
  .disclosure-head :is(h2, h3) button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .disclosure-head .info { display: flex; flex-direction: row; flex-wrap: wrap; gap: 2px 12px; }
  .mark { font-family: var(--mono); color: var(--text-3); width: 1ch; flex: none; }
  .mark::before { content: "+"; }
  .disclosure.open > .disclosure-head .mark::before { content: "\2212"; }
  /* theme:disclosure:end */
  /* Native <details> slide too where the browser can animate to auto height. */
  @supports (interpolate-size: allow-keywords) {
    :root { interpolate-size: allow-keywords; }
    details::details-content { height: 0; overflow: hidden; transition: height .2s var(--ease), content-visibility .2s allow-discrete; }
    details[open]::details-content { height: auto; }
  }
  /* Title, one summary line at one size, then the status filter on the left above the rows. */
  header { display: grid; gap: 8px; justify-items: start; margin-bottom: 8px; }
  /* Headings use the shared theme steps (--fs-h1/h2/h3); other text uses the role tokens (--fs-body / meta / code / tag). */
  h2 { font-size: var(--fs-h2); line-height: 1.3; margin: 0; overflow-wrap: anywhere; }
  h3 { font-size: var(--fs-h3); margin: 0; overflow-wrap: anywhere; }
  .meta { color: var(--text-3); font-size: var(--fs-meta); }
  .summary-line { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--fs-body); }
  .summary-line .color-warn { color: var(--warn); }


  .use-case-title { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: baseline; }
  .use-case-title .meta { font-weight: 400; }

  /* The open test grows past the text column so the screenshot and steps get room; negative margins keep it centered. */
  .test.open { margin-inline: min(0px, calc((100% - min(96vw, var(--max-w-7xl))) / 2)); }
  .test-head h2 button:hover { background: transparent; }
  .test-head .title { overflow-wrap: anywhere; min-width: 0; }
  .test.open .mark::before { content: "\2212"; }
  .test-body { padding: 10px 14px 12px; display: grid; gap: 10px; min-width: 0; }


  .viewer { border-radius: var(--radius); min-width: 0; }
  .viewer:focus-visible { outline-offset: 4px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 8px; }
  .bar h3 { flex: 1 1 240px; }
  .bar .buttons { display: flex; gap: 6px; }
  .viewer-body { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); grid-template-areas: "err" "stage" "list"; }
  .viewer-body > .error { grid-area: err; }
  .viewer-body > .stage { grid-area: stage; }
  .viewer-body > .list { grid-area: list; }
  @media (min-width: 1100px) {
    .viewer-body { grid-template-columns: minmax(0, 2fr) minmax(320px, 1fr); grid-template-rows: auto 1fr; grid-template-areas: "stage err" "stage list"; align-items: start; }
  }

  .stage { position: relative; user-select: none; }
  .frame { border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); }
  .stage img { width: 100%; max-height: 78vh; object-fit: contain; display: block; }
  /* Full-page shots: scroll the frame at full width instead of shrinking the page to an unreadable strip. */
  .stage.tall .frame { max-height: 78vh; overflow-y: auto; overscroll-behavior: contain; }
  .stage.tall img { max-height: none; height: auto; object-fit: initial; object-position: top; }
  .hint { position: absolute; right: 10px; bottom: 10px; padding: 2px 8px; border-radius: 999px; font-size: var(--fs-meta); color: var(--text); background: var(--surface-3); border: 1px solid var(--line-strong); pointer-events: none; }
  /* The whole shot is the click target: left half goes back, right half forward. The arrows only show the side;
     they ignore the pointer, so a tall shot still scrolls under them. */
  .stage[data-side="prev"] .frame { cursor: w-resize; }
  .stage[data-side="next"] .frame { cursor: e-resize; }
  .edge { position: absolute; top: 50%; transform: translateY(-50%); padding: 4px 12px; border-radius: 999px; font-size: var(--fs-lg); color: var(--text); background: var(--surface-3); border: 1px solid var(--line-strong); pointer-events: none; opacity: 0; transition: opacity .15s var(--ease); }
  .edge.previous { left: 12px; }
  .edge.next { right: 20px; }
  .stage[data-side="prev"] .edge.previous, .stage[data-side="next"] .edge.next { opacity: 1; }

  .list { margin: 0; padding: 0; list-style: none; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .list li + li { border-top: 1px solid var(--line); }
  .list button { width: 100%; display: grid; grid-template-columns: 2.2em 1.2em minmax(0, 1fr) auto; gap: 8px; align-items: baseline; text-align: left; border: 0; border-radius: 0; background: transparent; padding: 4px 10px; }
  .list button:hover { background: var(--hover); }
  .list button:focus-visible { outline-offset: -2px; }
  .list button[aria-current="step"] { background: var(--accent-fill); box-shadow: inset 2px 0 0 var(--accent); }
  .list .number { color: var(--text-3); font-variant-numeric: tabular-nums; }
  .list .glyph.ok { color: var(--ok); }
  .list .glyph.bad { color: var(--bad); }
  .list .glyph.neutral { color: var(--neutral); }
  .list .title { overflow-wrap: anywhere; }
  .list .duration { color: var(--text-3); font-size: var(--fs-meta); font-variant-numeric: tabular-nums; }

  pre { font-size: var(--fs-code); background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0 0; max-height: 50vh; overflow-y: auto; }
  .error { display: grid; gap: 4px; }
  .error pre { margin: 0; }
  .error-label { color: var(--bad); font-weight: 600; }
  .command { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .command > .meta { min-width: 4em; font-size: var(--fs-meta); }
  .commands { display: grid; gap: 8px; }

  .notes { margin: 0; padding: 10px 12px; list-style: none; display: grid; gap: 4px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); }
  .notes b { font-weight: 600; margin-right: 6px; }
  details.attempts { border: 1px solid var(--line); border-radius: var(--radius); }
  details.attempts > summary { padding: 8px 12px; cursor: pointer; color: var(--text-2); }
  details.attempts > summary:focus-visible { outline-offset: -2px; }
  details.attempts ol { margin: 0; padding: 0 12px 12px; list-style: none; display: grid; gap: 10px; }
  .attempt-head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }

  dialog { border: 1px solid var(--line-strong); border-radius: var(--radius-lg); padding: 0; background: var(--surface); color: var(--text); max-width: 96vw; max-height: 96vh; }
  dialog .dialog-head { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  dialog .dialog-body { max-height: calc(96vh - 52px); overflow: auto; }
  dialog img { max-width: 96vw; max-height: calc(96vh - 52px); display: block; object-fit: contain; }
  dialog.tall img { max-height: none; height: auto; }
  dialog::backdrop { background: rgb(0 0 0 / .75); }

  /* Surface tag (ui / mcp / api / job): the runner that played the scenario. */
  .scenario-kind { flex: none; }
  .surface { flex: none; font-family: var(--mono); font-size: var(--fs-tag); font-weight: 600; line-height: 1.5; text-transform: uppercase; color: var(--text-2); border: 1px solid var(--line-strong); border-radius: 999px; padding: 1px 8px; }
  .tools .separator { width: 1px; align-self: stretch; background: var(--line-strong); margin: 0 4px; }
  .viewer-body > .messages { grid-area: err; display: grid; gap: 10px; min-width: 0; }
  .review { display: grid; gap: 4px; padding: 8px 10px; border-radius: var(--radius); background: var(--warn-soft); }
  .review-label { color: var(--warn); font-weight: 600; }
  .review .meta { font-weight: 400; margin-left: 6px; }
  .test-head .info .color-warn { color: var(--warn); }
  .list .flag { color: var(--warn); font-size: var(--fs-tag); font-weight: 600; margin-left: 6px; white-space: nowrap; }
  /* Request / response of an mcp, api or job step, in the place of the screenshot. */
  .callview { grid-area: stage; display: grid; gap: 8px; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); }
  .callview .target { font-family: var(--mono); font-size: var(--fs-code); color: var(--text); overflow-wrap: anywhere; }
  .callview pre { margin: 0; max-height: 40vh; }

  /* PDF: the tests as filtered and opened on screen, full height, no controls. */
  @media print {
    main { max-width: none; padding: 16px; }
    .test.open { margin-inline: 0; }
    .tools, .bar .buttons, .hint, .edge { display: none !important; }
    .stage img, .stage.tall .frame, pre, .callview pre { max-height: none; overflow: visible; }
  }
</style>
</head>
<body>
<main id="app"></main>
<dialog id="zoom" aria-labelledby="zoom-title">
  <div class="dialog-head"><span id="zoom-title" class="meta"></span><button type="button" id="zoom-close">Close</button></div>
  <div class="dialog-body"><img alt=""></div>
</dialog>
<div id="announce" class="sr-only" aria-live="polite"></div>
<script>
/* theme:pdf-js:start */
/* Synced from theme/pdf.js by theme/sync.mjs. Do not edit here. */
const FONT_SIZES = { small: '14px', medium: '16px', large: '18px' };
const FONT_SIZE_KEY = 'naphatwx-font-size';
// The px values live in base.css (html[data-font-size]); every rem token scales from the root size.

        counts.notrun ? count(counts.notrun, 'not run') : null, count(flagCount, 'review flag' + (flagCount === 1 ? '' : 's'), 'warn'),
        coreTests.length ? createElement('span', { class: 'meta', title: 'Core: play first' }, 'Core: ' + coreTests.filter((t) => kind(t) === 'passed').length + '/' + coreTests.length + ' passed') : null,
        createElement('span', { class: 'meta' }, DATA.tests.length + (DATA.coreOnly ? ' core scenarios' : ' scenarios') + ' · ' + formatDuration(DATA.ms)),
        createElement('time', { class: 'meta', datetime: DATA.startedAt }, isoLocal(DATA.startedAt)),
        DATA.baseURL ? createElement('span', { class: 'meta' }, DATA.baseURL) : null)),
    createElement('div', { class: 'head-row' }, tools)));
  addExportPdf();
  place();
}
render();
</script>
