<html lang="en">

<style>
  /* theme:tokens:start */

  :root {

      --bg: #121316;
      --surface: #18191d;
      --surface-2: #1f2025;
      --surface-3: #24262c;
      --line: #26282e;
      --line-strong: #363940;
      --line-3: #4a4d55;
      /* Hover fill for every control: a clear step up from any surface. Hover never changes the border */

      /* Ink. Running text is --text; text-2 / text-3 are for chrome and meta labels only */
      --text: #e2e3e7;
      --text-2: #c6c8cf;
      --text-3: #a3a6b0;

      /* One accent */
      --accent: #8ab0ff;
      --accent-fill: #1b2232;
      --accent-soft: rgba(138, 176, 255, 0.12);

      /* Status: one hue set, two meanings. ok = add / pass, warn = change / flaky, bad = drop / fail */
      --ok: #8fd694;
      --warn: #f0c26b;
      --bad: #f28b8d;
      --neutral: #a3a6b0;
      --ok-soft: rgba(143, 214, 148, 0.12);
      --warn-soft: rgba(240, 194, 107, 0.12);
      --bad-soft: rgba(242, 139, 141, 0.12);
      --neutral-soft: rgba(163, 166, 176, 0.12);
      --add: var(--ok);
      --change: var(--warn);
      --drop: var(--bad);

      /* Diagrams: connectors and their labels */
      --connector: #6b6e78;

      /* Type. ui-monospace first, or macOS Chromium falls back to Courier */
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Cascadia Code", monospace;

      /* Type scale. Nothing renders below --fs-xs. Pages set font sizes by role (below), not by step. */
      --fs-xs: 0.75rem;
      --fs-sm: 0.875rem;
      --fs-md: 1rem;
      --fs-lg: 1.25rem;
      --fs-xl: 1.5rem;
      --fs-2xl: 2rem;
      /* Headings and lead line: the same steps on every page */
      --fs-lead: var(--fs-lg);
      --fs-h3: var(--fs-lg);
      --fs-h2: var(--fs-xl);
      --fs-h1: var(--fs-2xl);
      /* Roles: one step down per role, so the eye lands on body text first.
         body = running text, tables, buttons, action bars · meta = hints, asides, legends, captions, code · tag = pills, kbd, counts */
      --fs-body: var(--fs-md);
      --fs-meta: var(--fs-sm);
      --fs-code: var(--fs-sm);
      --fs-tag: var(--fs-xs);
      /* Diagrams draw at 1:1 with shapes sized for 14px: main labels 14, secondary lines (detail, sub, note, type) 12 */
      --fs-dia: var(--fs-sm);
      --fs-dia-sub: var(--fs-xs);

      /* Max widths: Tailwind max-w steps (md 448px, 3xl 768px, 4xl 896px, 5xl 1024px, 6xl 1152px, 7xl 1280px). Use these, not raw px */

      --max-w-3xl: 48rem;
      --max-w-4xl: 56rem;
      --max-w-5xl: 64rem;
      --max-w-6xl: 72rem;
      --max-w-7xl: 80rem;

      /* Page frame: every page centers its content at the same width, 80% of the window up to --max-w-3xl */
      --page-w: min(80%, var(--max-w-3xl));
      --gutter: clamp(16px, 3vw, 24px);

      --radius: 6px;
      --radius-md: 8px;
      --radius-lg: 10px;
      --radius-xl: 12px;

  }
  /* theme:base:end */
  /* theme:pdf:start */

  .float-bar button { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border: 0; border-radius: var(--radius-md); background: none; color: var(--text-2); font: 500 var(--fs-body) var(--sans); white-space: nowrap; cursor: pointer; }
  .float-bar button:hover { background: var(--hover); color: var(--text); }
  /* Room under the last line so the bar never hides it: bar 42px + its 20px offset + a 14px gap.

  body:has(.float-bar) { --float-space: 76px; padding-bottom: var(--float-space); }

  /* theme:report:start */

  h1 { font-size: var(--fs-h1); line-height: 1.25; margin: 0; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; overflow-wrap: anywhere; }

  .disclosure-head h2 .pill { flex: none; }

  h3 { font-size: var(--fs-h3); margin: 0; overflow-wrap: anywhere; }
  .meta { color: var(--text-3); font-size: var(--fs-meta); }
  .summary-line { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--fs-body); }
  .summary-line .c-warn { color: var(--warn); }


  .uc-title { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: baseline; }
  .uc-title .meta { font-weight: 400; }

  /* The open test grows past the text column so the screenshot and steps get room; negative margins keep it centered. */
  .test.open { margin-inline: min(0px, calc((100% - min(96vw, var(--max-w-7xl))) / 2)); }
  .test-head h2 button:hover { background: transparent; }
  .test-head .t { overflow-wrap: anywhere; min-width: 0; }
  .test.open .mark::before { content: "\2212"; }

  .viewer { border-radius: var(--radius); min-width: 0; }
  .viewer:focus-visible { outline-offset: 4px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 8px; }

  .cmd { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }

  dialog .dbody { max-height: calc(96vh - 52px); overflow: auto; }
  dialog img { max-width: 96vw; max-height: calc(96vh - 52px); display: block; object-fit: contain; }
  dialog.tall img { max-height: none; height: auto; }
  dialog::backdrop { background: rgb(0 0 0 / .75); }

  /* Surface tag (ui / mcp / api / job): the runner that played the scenario. */
  .sc-kind { flex: none; }
  .surface { flex: none; font-family: var(--mono); font-size: var(--fs-tag); color: var(--text-2); border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 0 6px; }
  .tools .sep { width: 1px; align-self: stretch; background: var(--line-strong); margin: 0 4px; }
  .vbody > .msgs { grid-area: err; display: grid; gap: 10px; min-width: 0; }
  .review { display: grid; gap: 4px; padding: 8px 10px; border-radius: var(--radius); background: var(--warn-soft); }
  .review-label { color: var(--warn); font-weight: 600; }
  .review .meta { font-weight: 400; margin-left: 6px; }
  .test-head .info .c-warn { color: var(--warn); }
  .list .flag { color: var(--warn); font-size: var(--fs-tag); font-weight: 600; margin-left: 6px; white-space: nowrap; }
  /* Request / response of an mcp, api or job step, in the place of the screenshot. */
  .callview { grid-area: stage; display: grid; gap: 8px; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); }
  .callview .target { font-family: var(--mono); font-size: var(--fs-code); color: var(--text); overflow-wrap: anywhere; }
  .callview pre { margin: 0; max-height: 40vh; }

  /* PDF: the tests as filtered and opened on screen, full height, no controls. */
  @media print {
    main { max-width: none; padding: 16px; }
    .test.open { margin-inline: 0; }
    .tools, .bar .btns, .hint, .edge { display: none !important; }
    .stage img, .stage.tall .frame, pre, .callview pre { max-height: none; overflow: visible; }
  }
</style>

<main id="app"></main>
<dialog id="zoom" aria-labelledby="zoom-title">
  <div class="dhead"><span id="zoom-title" class="meta"></span><button type="button" id="zoom-close">Close</button></div>
  <div class="dbody"><img alt=""></div>
</dialog>

  expected: { word: 'passed', glyph: '✓', tone: 'ok' },
  flaky: { word: 'flaky', glyph: '✓', tone: 'warn' },

const pill = (s) => el('span', { class: 'pill tone-' + st(s).tone }, el('span', { 'aria-hidden': 'true' }, st(s).glyph), st(s).word);
// Buckets follow Playwright's own outcome, so header and filters match its summary.
const OUTCOME = { expected: 'passed', unexpected: 'failed', flaky: 'flaky', skipped: 'skipped', notrun: 'notrun' };
const kind = (t) => OUTCOME[t.outcome] || (t.status === 'passed' ? (t.retry ? 'flaky' : 'passed') : t.status === 'skipped' ? 'skipped' : 'failed');

const announcer = document.getElementById('announce');
async function copy(text, btn, what) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const t = el('textarea', {}, text);
    document.body.append(t); t.select();
    try { document.execCommand('copy'); } catch {}
    t.remove();
  }
  btn.textContent = 'Copied';
  announcer.textContent = '';
  setTimeout(() => { announcer.textContent = 'Copied ' + what; }, 50);
  setTimeout(() => { btn.textContent = 'Copy'; }, 1200);
}
const cmdRow = (label, cmd, what) => {
  const btn = el('button', { type: 'button', 'aria-label': 'Copy ' + what }, 'Copy');
  btn.onclick = () => copy(cmd, btn, what);
  return el('div', { class: 'cmd' }, el('span', { class: 'meta' }, label), el('code', {}, cmd), btn);
};

const zoom = document.getElementById('zoom');
const zoomImg = zoom.querySelector('img');
document.getElementById('zoom-close').onclick = () => zoom.close();
zoom.onclick = (e) => { if (e.target === zoom || e.target === zoomImg) zoom.close(); };
// Stand-in for a step without a screenshot, so every step shows a frame you can click through.
const NO_SHOT = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">'
  + '<rect width="1280" height="720" fill="#18191d"/><rect x="560" y="250" width="160" height="120" rx="12" fill="none" stroke="#4a4d55" stroke-width="6"/>'
  + '<circle cx="640" cy="310" r="26" fill="none" stroke="#4a4d55" stroke-width="6"/><path d="M548 238 L732 382" stroke="#4a4d55" stroke-width="6"/>'
  + '<text x="640" y="440" fill="#a3a6b0" font-family="-apple-system, Segoe UI, system-ui, sans-serif" font-size="32" text-anchor="middle">No screenshot for this step</text></svg>');
const isTall = (img) => img.naturalWidth > 0 && img.naturalHeight / img.naturalWidth > 1.5;

// Reviewer flags: 'ok' shows nothing; the rest show the reviewer's note on the step.
const FLAG = { test: 'Test problem', product: 'Product problem', unsure: 'Check by hand' };
const flagged = (s) => s.review && s.review.flag !== 'ok';
const show = (v) => (v == null ? '' : typeof v === 'string' ? v : JSON.stringify(v, null, 2));

// One step at a time, like slides. Built once per test, so collapse and re-expand keeps the last step seen.
// ui steps show their screenshot; mcp / api / job steps show the call's request and response.
function viewer(slides, surface) {
  let i = 0;
  const box = el('div', { class: 'viewer', tabindex: '0', 'aria-label': 'Step viewer, use left and right arrow keys' });
  const title = el('h3', {});
  const status = el('span', {});
  const time = el('span', { class: 'meta' });
  const count = el('span', { class: 'meta', 'aria-live': 'polite' });
  const prev = el('button', { type: 'button' }, '‹ Prev');
  const next = el('button', { type: 'button' }, 'Next ›');
  const full = el('button', { type: 'button' }, 'Zoom');
  const err = el('div', { class: 'err' }, el('div', { class: 'err-label' }, 'Error in this step'), el('pre', {}));
  const revLabel = el('div', { class: 'review-label' });
  const revNote = el('div', {});
  const rev = el('div', { class: 'review' }, revLabel, revNote);
  const msgs = el('div', { class: 'msgs' }, err, rev);
  const img = el('img', { alt: '' });
  // Clicking the shot is a mouse shortcut only; keyboard users have Prev/Next and the step list.
  const left = el('span', { class: 'edge prev', 'aria-hidden': 'true' }, '‹');
  const right = el('span', { class: 'edge next', 'aria-hidden': 'true' }, '›');
  const hint = el('span', { class: 'hint', 'aria-hidden': 'true', hidden: '' }, 'scroll ↓');
  const frame = el('div', { class: 'frame' }, img);
  const stage = el('div', { class: 'stage' }, frame, left, right, hint);
  const target = el('div', { class: 'target' });
  const reqPre = el('pre', {});
  const resPre = el('pre', {});
  const reqBox = el('div', {}, el('div', { class: 'label' }, 'Request'), reqPre);
  const resBox = el('div', {}, el('div', { class: 'label' }, 'Response'), resPre);
  const none = el('div', { class: 'meta' }, 'No call recorded for this step.');
  const callview = el('div', { class: 'callview' }, target, reqBox, resBox, none);
  const side = (e) => {
    const r = frame.getBoundingClientRect();
    if (e.clientX - r.left > frame.clientWidth) return '';  // on the scrollbar
    const d = e.clientX - r.left < r.width / 2 ? 'prev' : 'next';
    return (d === 'prev' ? i > 0 : i < slides.length - 1) ? d : '';
  };
  frame.onmousemove = (e) => { stage.dataset.side = side(e); };
  frame.onmouseleave = () => { stage.dataset.side = ''; };
  frame.onclick = (e) => { const d = side(e); if (d) { go(d === 'prev' ? -1 : 1); stage.dataset.side = side(e); } };
  // Tall shots make the frame a scroll region, which keyboard users must be able to focus.
  const fit = () => {
    const tall = isTall(img);
    stage.classList.toggle('tall', tall);
    if (tall) { frame.setAttribute('tabindex', '0'); frame.setAttribute('aria-label', 'Full-page screenshot, scrolls vertically'); }
    else { frame.removeAttribute('tabindex'); frame.removeAttribute('aria-label'); }
    hint.hidden = !tall || frame.scrollTop + frame.clientHeight >= frame.scrollHeight - 4;
  };
  img.onload = fit;
  frame.onscroll = fit;
  const items = slides.map((s, n) => {
    const t = st(s.status);
    const b = el('button', { type: 'button' }, el('span', { class: 'n' }, n + 1 + '.'),
      el('span', { class: 'g ' + t.tone, 'aria-hidden': 'true' }, t.glyph), el('span', { class: 't' }, s.title,
      el('span', { class: 'sr-only' }, ', ' + t.word), flagged(s) ? el('span', { class: 'flag' }, '⚑ ' + (FLAG[s.review.flag] || 'Review')) : null),
      el('span', { class: 'ms' }, ms(s.ms)));
    b.onclick = () => { i = n; update(); };
    return el('li', {}, b);
  });
  const list = el('ol', { class: 'list', 'aria-label': 'Steps' }, items);

  const update = () => {
    const s = slides[i];
    title.textContent = (i + 1) + '. ' + s.title;
    status.replaceChildren(pill(s.status));
    time.textContent = ms(s.ms);
    count.textContent = 'Step ' + (i + 1) + ' / ' + slides.length;
    prev.disabled = i === 0;
    next.disabled = i === slides.length - 1;
    full.disabled = !s.shot;
    err.hidden = !s.error;
    err.querySelector('pre').textContent = s.error || '';
    rev.hidden = !flagged(s);
    if (flagged(s)) {
      revLabel.replaceChildren('⚑ Review: ' + (FLAG[s.review.flag] || s.review.flag), s.review.check ? el('span', { class: 'meta' }, s.review.check) : null);
      revNote.textContent = s.review.note || '';
    }
    msgs.hidden = err.hidden && rev.hidden;
    // A step with a screenshot shows it; a call step, or any non-ui step, shows the request and response.
    const asCall = !s.shot && (s.call || surface !== 'ui');
    stage.hidden = asCall;
    callview.hidden = !asCall;
    if (asCall) {
      const c = s.call;
      target.textContent = c ? c.target || '' : '';
      target.hidden = !c || !c.target;
      reqBox.hidden = resBox.hidden = !c;
      none.hidden = !!c;
      reqPre.textContent = c ? show(c.request) : '';
      resPre.textContent = c ? show(c.response) : '';
    } else {
      frame.scrollTop = 0;
      img.src = s.shot || NO_SHOT;
      img.alt = s.shot ? s.title : 'No screenshot for this step';
      fit();
    }
    items.forEach((li, n) => {
      const b = li.firstChild;
      if (n === i) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
    });
    // A control that just became disabled drops focus; keep it inside the viewer.
    if (document.activeElement?.disabled) box.focus({ preventScroll: true });
  };
  const go = (d) => { const n = i + d; if (n >= 0 && n < slides.length) { i = n; update(); } };
  prev.onclick = () => go(-1);
  next.onclick = () => go(1);
  full.onclick = () => {
    const s = slides[i];
    zoomImg.src = s.shot; zoomImg.alt = s.title;
    zoom.classList.toggle('tall', isTall(img));
    document.getElementById('zoom-title').textContent = (i + 1) + '. ' + s.title;
    zoom.showModal();
  };
  box.onkeydown = (e) => {
    if (e.target.closest('pre, .frame')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
  };
  box.append(el('div', { class: 'bar' }, title, status, time, count, el('div', { class: 'btns' }, prev, next, full)),
    el('div', { class: 'vbody' }, msgs, stage, callview, list));
  update();
  return box;
}

const NOTE = { skip: 'Skipped', fixme: 'Fixme', fail: 'Expected to fail' };
let uid = 0;
// Slides a row's panel open or shut; a click mid-slide reverses from the current height.
const EASE = getComputedStyle(document.documentElement).getPropertyValue('--ease').trim() || 'ease';
const calm = matchMedia('(prefers-reduced-motion: reduce)');
function slide(panel, open, instant) {
  const from = panel.hidden ? 0 : panel.getBoundingClientRect().height;
  panel.getAnimations().forEach((a) => a.cancel());
  panel.style.overflow = '';
  panel.hidden = false;
  const to = open ? panel.getBoundingClientRect().height : 0;
  if (instant || calm.matches || from === to) { panel.hidden = !open; return; }
  const cs = getComputedStyle(panel);
  const at = (h) => h ? { height: h + 'px', paddingTop: cs.paddingTop, paddingBottom: cs.paddingBottom, opacity: 1 }
    : { height: '0px', paddingTop: '0px', paddingBottom: '0px', opacity: 0 };
  panel.style.overflow = 'hidden';
  const a = panel.animate([at(from), at(to)], { duration: 220, easing: EASE, fill: 'forwards' });
  a.onfinish = () => { panel.hidden = !open; panel.style.overflow = ''; a.cancel(); };
}

let closeOpen = null;

function testBox(t) {
  const k = kind(t);
  const id = 'test-' + (++uid);
  const box = el('section', { class: 'test disclosure', 'aria-labelledby': id + '-h' });
  box.dataset.kind = k;
  const flags = t.steps.filter(flagged).length;
  box.dataset.flags = String(flags);
  const toggle = el('button', { type: 'button', 'aria-expanded': 'false', 'aria-controls': id + '-b' },
    el('span', { class: 'mark', 'aria-hidden': 'true' }), pill(k === 'failed' && st(t.status).tone === 'bad' ? t.status : k),
    t.surface ? el('span', { class: 'surface', title: 'Surface: ' + t.surface }, t.surface) : null, el('span', { class: 't' }, t.title),
    t.scKind ? el('span', { class: 'sc-kind ' + t.scKind, title: 'Scenario kind' }, t.scKind) : null);
  const attempts = t.attempts || [];
  const runs = attempts.length ? ' · ' + (attempts.length + 1) + ' attempts' : t.retry ? ' · retry ' + t.retry : '';
  const where = t.runner === 'ai' ? 'AI tester' + (t.role ? ' as ' + t.role : '') : t.file;
  const head = el('div', { class: 'test-head disclosure-head' }, el('h2', { id: id + '-h' }, toggle),
    el('div', { class: 'info' }, t.scenario ? el('span', { class: 'meta' }, t.scenario) : null, where ? el('span', { class: 'meta' }, where) : null,
      k === 'notrun' ? null : el('span', { class: 'meta' }, ms(t.ms) + runs + (t.project ? ' · ' + t.project : '')),
      flags ? el('span', { class: 'meta c-warn' }, '⚑ ' + flags + ' review flag' + (flags > 1 ? 's' : '')) : null));
  // The whole row is a mouse target; keyboard and screen readers use the heading's button.
  head.onclick = (e) => { if (!e.target.closest('button')) toggle.click(); };
  const body = el('div', { class: 'test-body', id: id + '-b' });
  const setOpen = (o, instant) => { box.classList.toggle('open', o); toggle.setAttribute('aria-expanded', String(o)); slide(body, o, instant); };
  toggle.onclick = () => {
    const o = !box.classList.contains('open');
    // Only one test open at a time; the other shuts at once so this row can be scrolled back into view.
    const other = o && closeOpen && closeOpen !== close;
    if (other) closeOpen(true);
    closeOpen = o ? close : null;
    setOpen(o);
    if (other) head.scrollIntoView({ block: 'nearest' });
  };
  const close = (instant) => setOpen(false, instant);

  const notes = t.annotations || [];
  if (notes.length) body.append(el('ul', { class: 'notes', 'aria-label': 'Annotations' },
    notes.map((a) => el('li', {}, el('b', {}, NOTE[a.type] || a.type), a.description || 'no reason given'))));
  const slides = t.steps.slice();
  if (t.finalShot) slides.push({ title: 'Page at failure', status: 'failed', shot: t.finalShot });
  if (slides.length) body.append(viewer(slides, t.surface || 'ui'));
  else if (!notes.length) body.append(el('div', { class: 'meta' }, k === 'skipped' ? 'Skipped, with no reason given.'
    : k === 'notrun' ? 'This scenario is in use-cases.js but has no result in this run.' : 'This test has no named steps.'));
  // Playwright usually repeats the failed step's error as the test error; show it once.
  const stepErrors = t.steps.map((s) => (s.error || '').trim()).filter(Boolean);
  if (t.error && !stepErrors.some((e) => e === t.error.trim())) body.append(el('div', {}, el('h3', {}, 'Test error'), el('pre', {}, t.error)));
  if (attempts.length) body.append(el('details', { class: 'attempts' },
    el('summary', {}, 'Earlier attempts (' + attempts.length + ')'),
    el('ol', {}, attempts.map((a) => el('li', {},
      el('div', { class: 'att-head' }, el('span', {}, a.retry ? 'Retry ' + a.retry : 'First run'), pill(a.status), el('span', { class: 'meta' }, ms(a.duration))),
      a.error ? el('pre', {}, a.error) : null)))));
  if (k !== 'passed' && k !== 'notrun' && t.runner !== 'ai' && t.file) {
    const cmd = 'npx playwright test ' + t.file + (t.project ? ' --project=' + JSON.stringify(t.project).replace(/^"([\w.-]+)"$/, '$1') : '');
    body.append(el('div', { class: 'cmds' }, cmdRow('Rerun', cmd, 'rerun command for ' + t.title),
      t.trace ? cmdRow('Trace', 'npx playwright show-trace ' + t.trace, 'trace command for ' + t.title) : null));
  }
  box.append(head, body);
  setOpen(false, true);
  return box;
}

function render() {
  const app = document.getElementById('app');
  if (!DATA) { app.append(el('p', {}, 'No data in this report.')); return; }
  const n = { failed: 0, flaky: 0, passed: 0, skipped: 0, notrun: 0 };
  for (const t of DATA.tests) n[kind(t)]++;
  const tools = el('div', { class: 'tools', role: 'group', 'aria-label': 'Show tests' });
  const boxes = DATA.tests.map(testBox);
  const flaggedTests = boxes.filter((b) => +b.dataset.flags > 0).length;
  const flagCount = boxes.reduce((c, b) => c + +b.dataset.flags, 0);
  // The tree from use-cases.js: UC1 → its scenarios in file order, UC2 → …, then tests with no known use case.
  const known = new Set((DATA.useCases || []).map((u) => u.id));
  const ucOf = (t) => (known.has(t.useCase) ? t.useCase : '');
  const useCases = [...(DATA.useCases || []), { id: '', title: 'Other tests' }].filter((u) => DATA.tests.some((t) => ucOf(t) === u.id));
  const heads = new Map(useCases.map((u) => {
    const tests = DATA.tests.filter((t) => ucOf(t) === u.id);
    const passed = tests.filter((t) => kind(t) === 'passed').length;
    return [u.id, el('h2', { class: 'uc-title' }, (u.id ? u.id + ' ' : '') + u.title, el('span', { class: 'meta' }, passed + ' / ' + tests.length + ' passed'))];
  }));
  const none = el('p', { class: 'meta empty-filter', hidden: '' }, 'No tests match this filter.');
  const FILTERS = [['all', 'All', DATA.tests.length], ['failed', 'Failed', n.failed], ['flaky', 'Flaky', n.flaky], ['passed', 'Passed', n.passed],
    ['skipped', 'Skipped', n.skipped], ['notrun', 'Not run', n.notrun], ['review', 'Review flags', flaggedTests]].filter(([key, , c]) => c || ['all', 'failed', 'passed'].includes(key));
  let failedFirst = false;
  const order = { failed: 0, flaky: 1, passed: 2, skipped: 3, notrun: 4 };
  const place = () => {
    const sorted = boxes.map((b, i) => [b, i]).sort((a, b) => (failedFirst ? order[a[0].dataset.kind] - order[b[0].dataset.kind] : 0) || a[1] - b[1]);
    for (const u of useCases) {
      app.append(heads.get(u.id));
      sorted.filter(([, i]) => ucOf(DATA.tests[i]) === u.id).forEach(([b]) => app.append(b));
    }
    app.append(none);
  };
  const buttons = FILTERS.map(([key, label, c]) => {
    const b = el('button', { type: 'button', 'aria-pressed': String(key === 'all') }, label + ' ' + c);
    b.onclick = () => {
      buttons.forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      let shown = 0;
      for (const box of boxes) {
        box.hidden = key !== 'all' && (key === 'review' ? box.dataset.flags === '0' : box.dataset.kind !== key);
        if (!box.hidden) shown++;
      }
      for (const [u, h] of heads) h.hidden = !boxes.some((box, i) => !box.hidden && ucOf(DATA.tests[i]) === u);
      none.hidden = shown > 0;
    };
    return b;
  });
  // Default order is use-cases.js order, the same tree every skill shows; this toggle lifts failures to the top of each use case.
  const sortBtn = el('button', { type: 'button', 'aria-pressed': 'false' }, 'Failed first');
  sortBtn.onclick = () => { failedFirst = !failedFirst; sortBtn.setAttribute('aria-pressed', String(failedFirst)); place(); };
  tools.append(...buttons, el('span', { class: 'sep', 'aria-hidden': 'true' }), sortBtn);
  // Same buckets and order as the filters; a count is colored only when it is not zero.
  const count = (c, word, tone) => el('span', { class: 'lead' + (c && tone ? ' c-' + tone : '') }, c + ' ' + word);
  app.append(el('header', {},
    el('div', {}, el('h1', {}, 'E2E report · ' + DATA.name, pill(DATA.status)),
      el('div', { class: 'summary-line' },
        count(n.failed, 'failed', 'bad'), count(n.flaky, 'flaky', 'warn'), count(n.passed, 'passed'), count(n.skipped, 'skipped'),
        n.notrun ? count(n.notrun, 'not run') : null, count(flagCount, 'review flag' + (flagCount === 1 ? '' : 's'), 'warn'),
        el('span', { class: 'meta' }, DATA.tests.length + ' scenarios · ' + ms(DATA.ms)),
        el('time', { class: 'meta', datetime: DATA.startedAt }, isoLocal(DATA.startedAt)),
        DATA.baseURL ? el('span', { class: 'meta' }, DATA.baseURL) : null)),
    el('div', { class: 'head-row' }, tools)));
  addExportPdf();
  place();
}
render();
</script>
</body>
</html>
