<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock · Example</title>
    <!-- same stack as the app; this default is Tailwind v4 from CDN (swap for the app's CSS if it is not Tailwind) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @custom-variant dark (&:where(.dark, .dark *));
    </style>
    <script src="../contract/rules.js"></script>
    <script src="../contract/data.js"></script>
    <script src="../shared/states.js"></script>
    <script src="../shared/components.js"></script>
    <script src="../shared/fake-api.js"></script>
    <script src="../../use-cases.js"></script>
    <script src="../shared/scenario-play.js"></script>
    <script src="../shared/shell.js"></script>
</head>

<body>
    <script>
        // One screen. State comes from ?state= plus any param a scenario needs (?status= pre-sets the filter, ?modal=CREATE opens the form).
        const P = States.params;
        const { page: el, owner } = Shell.mount();
        const S = window.S = { page: 1, status: P.get('status') || '', loading: true, error: null, res: null };

        async function load() {
            S.loading = true; S.error = null; render();
            try { S.res = await FakeApi.GetThings({ ownerId: owner.id, page: S.page, limit: 10, ...(S.status && { status: S.status }) }); } catch (e) { S.error = e; }
            S.loading = false; render();
        }
        function setStatus(v) { S.status = v; load(); }

        // No permission → hidden, as the real app hides it. A reason the spec names → disabled, reason under it.
        // aria-disabled, not native disabled: the button stays focusable, so the reason is announced with it.
        function createBtn() {
            if (!States.current.perms.includes('things.create')) return '';
            const reason = States.current.blocked;
            if (!reason) return UI.btn('primary', 'md', 'Create', 'onclick="openCreate()"');
            return `<span class="inline-flex flex-col items-end">${UI.btn('primary', 'md', 'Create', 'aria-disabled="true" aria-describedby="createReason"')
                .replace('class="', 'class="opacity-50 cursor-not-allowed ')}
              <span id="createReason" class="mt-1 max-w-64 text-right text-xs text-gray-500">${UI.esc(reason)}</span></span>`;
        }

        // Create form: the field check runs first, then the operation (its refusal shows as an alert in the form)
        const F = S.form = { open: P.get('modal') === 'CREATE', name: '', error: '', busy: false };
        function openCreate() { Object.assign(F, { open: true, name: '', error: '', busy: false }); renderModal(); }
        function closeCreate() { F.open = false; renderModal(); }
        async function submitCreate() {
            F.name = document.getElementById('thingName').value;
            if (!F.name.trim()) { F.error = Rules.NAME_REQUIRED; return renderModal(); }
            F.busy = true; F.error = ''; renderModal();
            try {
                const t = await FakeApi.CreateThing({ ownerId: owner.id, name: F.name });
                F.open = false; renderModal(); UI.toast(Rules.created(t.name), ''); load();
            } catch (e) { F.busy = false; F.error = e.message; renderModal(); }
        }
        function renderModal() {
            document.getElementById('modalRoot').innerHTML = !F.open ? '' : UI.modal(`
              <div class="p-6 space-y-4">
                <h3 class="text-lg font-semibold">Create thing</h3>
                <label class="block text-sm font-medium">Name
                  <input id="thingName" value="${UI.esc(F.name)}" aria-invalid="${!!F.error}" aria-describedby="nameError" class="mt-1 w-full rounded-lg border ${F.error ? 'border-red-500' : 'border-gray-300 dark:border-gray-600'} bg-white dark:bg-gray-900 px-3 py-2 text-sm">
                </label>
                ${F.error ? `<p id="nameError" class="-mt-2 text-xs text-red-600 dark:text-red-400">${UI.esc(F.error)}</p>` : ''}
                <div class="flex justify-end gap-2">
                  ${UI.btn('neutral', 'md', 'Cancel', 'onclick="closeCreate()"')}${UI.btn('primary', 'md', F.busy ? 'Creating…' : 'Create', `onclick="submitCreate()" ${F.busy ? 'disabled' : ''}`)}
                </div>
              </div>`, 'max-w-md', 'closeCreate()');
        }

        function render() {
            el.innerHTML = `
              <div class="flex items-center justify-between gap-3 mb-4">
                <h2 class="text-lg font-bold">Things</h2>
                <div class="flex items-center gap-2">
                  <select onchange="setStatus(this.value)" aria-label="Status" class="rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 px-3 py-2 text-sm">
                    ${[['', 'All Status'], ['PENDING', 'Pending'], ['READY', 'Ready'], ['FAILED', 'Failed']].map(([v, l]) => `<option value="${v}" ${v === S.status ? 'selected' : ''}>${l}</option>`).join('')}
                  </select>
                  ${UI.btn('neutral', 'md', 'Refresh', 'onclick="load()"')}${createBtn()}
                </div>
              </div>
              ${S.loading ? UI.skel('h-24 w-full')
                : S.error ? UI.emptyState('Could not load', UI.esc(S.error.message), UI.btn('neutral', 'md', 'Retry', 'onclick="load()"'))
                : !S.res.entities.length ? (S.status ? UI.emptyState('No things match this filter', '') : UI.emptyState('Nothing yet', 'No things have been created.'))
                : S.res.entities.map(t => `<div class="flex items-center gap-3 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 p-4 mb-2">
                    <span class="font-medium">${UI.esc(t.name)}</span>${UI.statusBadge(t.status)}<span class="text-xs text-gray-500 ml-auto">${UI.date(t.createdAt)}</span></div>`).join('')}`;
        }
        load(); renderModal();
    </script>
</body>

</html>
