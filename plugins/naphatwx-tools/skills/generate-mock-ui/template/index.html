<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock · Feature name</title>
    <!-- Tailwind stays: layout utilities here, and the screens' shared components need it -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* theme:tokens:start */
        /* Synced from theme/tokens.css by theme/sync.mjs. Do not edit here. */
        :root {
            color-scheme: dark;

            /* Surfaces, darkest first */
            --bg: #121316;
            --surface: #18191d;
            --surface-2: #1f2025;
            --surface-3: #24262c;
            --line: #26282e;
            --line-strong: #363940;
            --line-3: #4a4d55;

            /* Ink. Running text is --text; text-2 / text-3 are for chrome and meta labels only */
            --text: #e2e3e7;
            --text-2: #c6c8cf;
            --text-3: #a3a6b0;

            /* One accent */
            --accent: #8ab0ff;
            --accent-fill: #1b2232;
            --accent-soft: rgba(138, 176, 255, 0.12);

            /* Status: one hue set, two meanings. ok = add / pass, warn = change / flaky, bad = drop / fail */
            --ok: #8fd694;
            --warn: #f0c26b;
            --bad: #f28b8d;
            --neutral: #a3a6b0;
            --ok-soft: rgba(143, 214, 148, 0.12);
            --warn-soft: rgba(240, 194, 107, 0.12);
            --bad-soft: rgba(242, 139, 141, 0.12);
            --neutral-soft: rgba(163, 166, 176, 0.12);
            --add: var(--ok);
            --change: var(--warn);
            --drop: var(--bad);

            /* Diagrams: connectors and their labels */
            --connector: #6b6e78;

            /* Type. ui-monospace first, or macOS Chromium falls back to Courier */
            --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Cascadia Code", monospace;

            /* Type scale. Body text is --fs-md on every page; code and pills --fs-sm. Reports use only
               --fs-lg (title), --fs-md and --fs-sm. Nothing renders below --fs-xs. */
            --fs-xs: 0.75rem;
            --fs-sm: 0.875rem;
            --fs-md: 1rem;
            --fs-lg: 1.25rem;
            --fs-xl: 1.5rem;
            --fs-2xl: 2rem;
            /* Headings and lead line: the same steps on every page */
            --fs-lead: var(--fs-lg);
            --fs-h3: var(--fs-lg);
            --fs-h2: var(--fs-xl);
            --fs-h1: var(--fs-2xl);

            /* Page frame: every page centers its content at the same width */
            --page-w: 1200px;
            --gutter: clamp(16px, 3vw, 24px);

            --radius: 6px;
            --radius-lg: 10px;
            --ease: cubic-bezier(0.2, 0, 0, 1);
        }
        /* theme:tokens:end */
        /* theme:base:start */
        /* Synced from theme/base.css by theme/sync.mjs. Do not edit here. */
        *, *::before, *::after { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            -webkit-font-smoothing: antialiased;
        }
        ::selection { background: rgba(138, 176, 255, 0.35); color: #fff; }
        * { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
        a { color: var(--accent); }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        code, kbd, pre, samp { font-family: var(--mono); }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
        }
        /* theme:base:end */

        /* Index chrome only. The screens inside the frames use the target app's own design system. */
        html { scroll-padding-top: 24px; }
        body { line-height: 1.55; }
        /* ch ("0") is wider than an average glyph: 48ch of the element's own font is about 68 characters a line */
        .page { max-width: var(--page-w); margin: 0 auto; padding-inline: var(--gutter); }
        .measure { max-width: 48ch; }
        .muted { color: var(--text-2); }
        .meta { color: var(--text-3); }
        /* Headings use the shared theme steps; other text --fs-md, code and the frame's toolbar --fs-sm. */
        body { font-size: var(--fs-md); }
        h1 { font-size: var(--fs-h1); line-height: 1.15; }
        h2 { font-size: var(--fs-h2); line-height: 1.25; }
        h3 { font-size: var(--fs-h3); line-height: 1.3; }
        .t-code { font-size: var(--fs-sm); }
        .label { color: var(--text-3); font-weight: 500; }
        /* Steps and expected result stay folded so the frame leads; one click opens them. */
        .guide > summary { display: inline-flex; gap: 8px; align-items: center; color: var(--text-2); cursor: pointer; list-style: none; border-radius: var(--radius); }
        .guide > summary::-webkit-details-marker { display: none; }
        .guide > summary::before { content: "+"; font-family: var(--mono); color: var(--text-3); width: 1ch; }
        .guide[open] > summary::before { content: "\2212"; }
        .guide > summary:hover { color: var(--text); }
        .link { color: var(--accent); text-decoration: none; }
        .link:hover { text-decoration: underline; }
        .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); }
        a.panel { color: inherit; text-decoration: none; transition: border-color .15s var(--ease); }
        a.panel:hover { border-color: var(--accent); }
        /* chips wrap onto more rows rather than scroll out of sight on a narrow screen */
        .tabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
        .tab { flex-shrink: 0; min-width: 9rem; max-width: 14rem; padding: 6px 14px; margin-bottom: -1px; color: var(--text-2); background: none; border: 0; border-bottom: 2px solid transparent; cursor: pointer; }
        .tab:hover { color: var(--text); background: var(--surface); }
        .tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
        .frame { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-lg); overflow: hidden; }
        .toolbar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; font-size: var(--fs-sm); background: var(--surface-2); border-bottom: 1px solid var(--line); }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line-3); }
        .url { font-family: var(--mono); padding: 2px 8px; border: 1px solid var(--line-strong); border-radius: var(--radius); color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
        .btn-ghost { padding: 4px 8px; color: var(--text); background: none; border: 1px solid var(--line-strong); border-radius: var(--radius); cursor: pointer; white-space: nowrap; }
        .btn-ghost:hover { border-color: var(--accent); }
        .rows > * + * { border-top: 1px solid var(--line); }
        /* the screen renders at desktop width and is scaled down to the frame */
        .fit { position: relative; overflow: hidden; }
        .fit iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 8px; }
    </style>
    <script src="contract/rules.js"></script>
    <script src="contract/data.js"></script>
    <script src="shared/scenarios.js"></script>
    <script src="shared/components.js"></script>
    <script src="shared/fake-api.js"></script>
    <script src="../use-cases.js"></script>
    <script src="shared/use-case-play.js"></script>
</head>

<body>
    <div class="page py-6 space-y-8">
        <header>
            <a href="../overview.html#use-cases" class="link">← Feature plan</a>
            <h1 class="font-bold mt-2">Mock UI · Feature name</h1>
        </header>

        <div id="flows" class="space-y-8"></div>

        <section>
            <h2 class="font-bold mb-1">Audit log (this browser session)</h2>
            <p class="meta mb-3 measure">What the real service writes: audit rows, events. Picking or restarting a use case clears it.</p>
            <div id="log"></div>
        </section>

        <section>
            <h2 class="font-bold mb-3">Contract</h2>
            <div class="grid md:grid-cols-3 gap-4">
                <a href="contract/types.ts" class="panel p-4 block"><div class="font-mono t-code font-semibold">types.ts</div><p class="meta mt-1">Real shapes to implement.</p></a>
                <a href="contract/rules.js" class="panel p-4 block"><div class="font-mono t-code font-semibold">rules.js</div><p class="meta mt-1">Spec rules as functions.</p></a>
                <a href="contract/data.js" class="panel p-4 block"><div class="font-mono t-code font-semibold">data.js</div><p class="meta mt-1">Mock data, typed against types.ts.</p></a>
            </div>
        </section>
    </div>

    <script>
        const SCREEN_W = 1600, SCREEN_H = 940;
        const list = items => items.map(s => `<li>${UI.esc(s)}</li>`).join('');
        const nn = flow => flow.split('.')[1].padStart(2, '0');
        const ucsOf = flow => USE_CASES.filter(u => u.flow === flow);
        const scenarioOf = uc => Scenarios.LIST.find(s => s.id === uc.scenario);

        function screenSrc(uc) {
            const q = new URLSearchParams({ scenario: uc.scenario, uc: uc.id, embed: '1', ...(uc.params || {}) });
            return `page/${uc.page}.html?${q}`;
        }
        // The URL the real app would show for this use case: edit the route to the app's own.
        function screenUrl(uc) {
            if (uc.page === 'console') return `MCP client · <ServiceName> · ${uc.op}`;
            const q = new URLSearchParams(uc.params || {}); q.delete('modal');
            return `localhost:3000/owners/${scenarioOf(uc).ownerId}${q.size ? '?' + q : ''}${uc.params?.modal ? ' · ' + uc.params.modal : ''}`;
        }
        /** Each use case starts from a clean mock: no rows written by another card, empty audit log. */
        function clearState() {
            try { Object.keys(sessionStorage).filter(k => k.startsWith(FakeApi.STORE + ':')).forEach(k => sessionStorage.removeItem(k)); } catch { }
            renderLog();
        }

        // ---------------------------------------------------------------- one block per flow
        document.getElementById('flows').innerHTML = USE_CASE_FLOWS.map(f => {
            const ucs = ucsOf(f.flow);
            const head = `
              <div class="flex items-baseline justify-between gap-x-4 gap-y-1 flex-wrap mb-2">
                <h2 class="font-bold"><span class="meta mr-2">${f.flow}</span>${UI.esc(f.title)}</h2>
                <span class="t-code font-mono meta">${UI.esc(f.refs)} · <a href="../overview.html#flow-${nn(f.flow)}" class="link">plan</a></span>
              </div>`;
            const skipped = USE_CASES_SKIPPED.filter(u => u.flow === f.flow);
            if (!ucs.length) return `<section id="flow-${nn(f.flow)}">${head}<p class="muted measure">${UI.esc(f.none || skipped[0]?.skip || 'No use case to play.')}</p></section>`;
            return `
              <section id="flow-${nn(f.flow)}" data-flow="${f.flow}">
                ${head}
                <div class="tabs" role="tablist" aria-label="Use cases of flow ${f.flow}">
                  ${ucs.map(u => `<button type="button" role="tab" class="tab" data-uc="${u.id}" aria-selected="false" onclick="pick('${u.id}', true)">${UI.esc(u.title)}</button>`).join('')}
                </div>
                <div class="card mt-3"></div>
                ${skipped.map(u => `<p class="meta measure mt-2">Not in the mock: ${UI.esc(u.title)} — ${UI.esc(u.skip)}</p>`).join('')}
              </section>`;
        }).join('');

        function pick(id, fromClick) {
            const uc = USE_CASES.find(u => u.id === id);
            const block = document.querySelector(`section[data-flow="${uc.flow}"]`);
            block.querySelectorAll('[role=tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.uc === id)));
            if (fromClick) { clearState(); history.replaceState(null, '', '#uc-' + id); }
            block.querySelector('.card').innerHTML = `
              <div class="flex items-baseline gap-x-3 gap-y-1 flex-wrap"><h3 class="font-semibold">${UI.esc(uc.title)}</h3><span class="t-code font-mono meta">${UI.esc(uc.story)} · ${UI.esc(scenarioOf(uc).label)}</span></div>
              <details class="guide mt-2 mb-3">
                <summary>How to play · what you should see</summary>
                <div class="grid md:grid-cols-2 gap-x-10 gap-y-4 mt-3">
                <div>
                  <div class="label mb-1">How to play</div>
                  <ol class="list-decimal pl-5 space-y-0.5 muted measure">${list(uc.steps)}</ol>
                </div>
                <div>
                  <div class="label mb-1">What you should see</div>
                  <ul class="list-disc pl-5 space-y-0.5 muted measure">${list(uc.expect)}</ul>
                </div>
                </div>
              </details>
              <div class="frame">
                <div class="toolbar">
                  <span class="flex gap-1.5 shrink-0" aria-hidden="true"><i class="dot"></i><i class="dot"></i><i class="dot"></i></span>
                  <span class="url">${UI.esc(screenUrl(uc))}</span>
                  <span class="ml-auto font-mono meta whitespace-nowrap scale-label"></span>
                  <button type="button" onclick="restart('${uc.id}')" class="btn-ghost">↻ Restart</button>
                </div>
                <div class="fit"><iframe title="${UI.esc(uc.title)} — interactive mock" src="${screenSrc(uc)}" width="${SCREEN_W}" height="${SCREEN_H}"></iframe></div>
              </div>`;
            fit(block);
        }
        function restart(id) { clearState(); pick(id); }

        function fit(block) {
            const box = block.querySelector('.fit'); if (!box) return;
            const s = Math.min(1, box.clientWidth / SCREEN_W);
            box.querySelector('iframe').style.transform = `scale(${s})`;
            box.style.height = Math.round(SCREEN_H * s) + 'px';
            block.querySelector('.scale-label').textContent = `${Math.round(s * 100)}% of ${SCREEN_W} px`;
        }
        new ResizeObserver(() => document.querySelectorAll('section[data-flow]').forEach(fit)).observe(document.getElementById('flows'));

        function renderLog() {
            const rows = FakeApi.log();
            const html = !rows.length
                ? '<div class="panel meta p-6 text-center">Nothing yet.</div>'
                : `<div class="panel rows">${rows.map(r => `<div class="px-4 py-2 flex gap-4"><span class="meta whitespace-nowrap">${UI.date(r.at)}</span><span>${UI.esc(r.message)}</span></div>`).join('')}</div>`;
            const el = document.getElementById('log');
            if (el.innerHTML !== html) el.innerHTML = html;
        }

        clearState(); // a reload starts clean too: rows written in an earlier visit would leak into every card
        // first use case of every flow, or the one in the URL (#uc-<id>, from the plan's links)
        const wanted = USE_CASES.find(u => location.hash === '#uc-' + u.id);
        USE_CASE_FLOWS.forEach(f => { const first = ucsOf(f.flow)[0]; if (first) pick(wanted?.flow === f.flow ? wanted.id : first.id); });
        if (wanted) document.querySelector(`section[data-flow="${wanted.flow}"]`).scrollIntoView();
        addEventListener('hashchange', () => {
            const uc = USE_CASES.find(u => location.hash === '#uc-' + u.id);
            if (uc) { clearState(); pick(uc.id); document.querySelector(`section[data-flow="${uc.flow}"]`).scrollIntoView(); }
        });
        setInterval(renderLog, 1500); // the screens write the log from inside their frames
    </script>
</body>

</html>
