<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smoke Report</title>
<style>
  /* theme:tokens:start */
  /* Synced from theme/tokens.css by theme/sync.mjs. Do not edit here. */
  :root {
      color-scheme: dark;

      /* Surfaces, darkest first */
      --bg: #121316;
      --surface: #18191d;
      --surface-2: #1f2025;
      --surface-3: #24262c;
      --line: #26282e;
      --line-strong: #363940;
      --line-3: #4a4d55;

      /* Ink. Running text is --text; text-2 / text-3 are for chrome and meta labels only */
      --text: #e2e3e7;
      --text-2: #c6c8cf;
      --text-3: #a3a6b0;

      /* One accent */
      --accent: #8ab0ff;
      --accent-fill: #1b2232;
      --accent-soft: rgba(138, 176, 255, 0.12);

      /* Status: one hue set, two meanings. ok = add / pass, warn = change / flaky, bad = drop / fail */
      --ok: #8fd694;
      --warn: #f0c26b;
      --bad: #f28b8d;
      --neutral: #a3a6b0;
      --ok-soft: rgba(143, 214, 148, 0.12);
      --warn-soft: rgba(240, 194, 107, 0.12);
      --bad-soft: rgba(242, 139, 141, 0.12);
      --neutral-soft: rgba(163, 166, 176, 0.12);
      --add: var(--ok);
      --change: var(--warn);
      --drop: var(--bad);

      /* Diagrams: connectors and their labels */
      --connector: #6b6e78;

      /* Type. ui-monospace first, or macOS Chromium falls back to Courier */
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Cascadia Code", monospace;

      /* Type scale: one hierarchy for every page. Dense pages (reports) set body to --fs-sm and step
         headings down one size; projector pages (plan) use body --fs-md. Nothing renders below --fs-xs. */
      --fs-xs: 0.75rem;
      --fs-sm: 0.875rem;
      --fs-md: 1rem;
      --fs-lg: 1.25rem;
      --fs-xl: 1.75rem;
      --fs-2xl: 2.75rem;

      --radius: 6px;
      --radius-lg: 10px;
      --ease: cubic-bezier(0.2, 0, 0, 1);
  }
  /* theme:tokens:end */
  /* theme:base:start */
  /* Synced from theme/base.css by theme/sync.mjs. Do not edit here. */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(138, 176, 255, 0.35); color: #fff; }
  * { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  code, kbd, pre, samp { font-family: var(--mono); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
  }
  /* theme:base:end */

  body { font-size: var(--fs-sm); line-height: 1.5; }
  [hidden] { display: none !important; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: var(--fs-xl); line-height: 1.2; margin: 0; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  h1 .pill { font-size: var(--fs-sm); }
  h2 { font-size: var(--fs-lg); line-height: 1.3; margin: 32px 0 10px; }
  h2 .count { color: var(--text-3); font-weight: 500; }
  h3 { font-size: var(--fs-md); margin: 0; }
  .meta { color: var(--text-3); font-size: var(--fs-sm); }
  .meta code { color: var(--text-2); }
  code { font-size: var(--fs-xs); overflow-wrap: anywhere; }

  .pill { display: inline-flex; gap: 5px; align-items: center; padding: 1px 9px; border-radius: 999px; font-weight: 600; font-size: var(--fs-xs); white-space: nowrap; }
  .tone-ok { color: var(--ok); background: var(--ok-soft); }
  .tone-warn { color: var(--warn); background: var(--warn-soft); }
  .tone-bad { color: var(--bad); background: var(--bad-soft); }
  .tone-neutral { color: var(--neutral); background: var(--neutral-soft); }

  .summary-line { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
  .lead { margin: 24px 0 0; font-size: var(--fs-md); font-weight: 600; overflow-wrap: anywhere; }
  .lead .sep { color: var(--text-3); font-weight: 400; }

  .broken { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); overflow: hidden; }
  .broken li + li { border-top: 1px solid var(--line); }
  .broken a { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; padding: 10px 14px; color: var(--text); text-decoration: none; }
  .broken a:hover { background: var(--surface-2); }
  .broken a:focus-visible { outline-offset: -2px; }
  .broken .flow-name { font-weight: 600; color: var(--accent); }
  .broken .detail { color: var(--text-2); overflow-wrap: anywhere; min-width: 0; }

  /* Flow boxes use the heading-plus-button disclosure, so the flow name stays a real heading. */
  .flow { border: 1px solid var(--line); border-radius: var(--radius-lg); margin-top: 12px; background: var(--surface); overflow: hidden; scroll-margin-top: 12px; }
  .flow-head { margin: 0; font-size: var(--fs-sm); font-weight: 400; }
  .flow-toggle { all: unset; box-sizing: border-box; width: 100%; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; cursor: pointer; transition: background-color .15s var(--ease); }
  .flow-toggle:hover { background: var(--surface-2); }
  .flow-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .flow-toggle[aria-expanded="true"] { border-bottom: 1px solid var(--line); }
  .flow-name-text { font-size: var(--fs-md); font-weight: 600; color: var(--text); }
  .flow-toggle[aria-expanded="true"] .mark::before { content: "\2212"; }

  summary { cursor: pointer; list-style: none; transition: background-color .15s var(--ease); }
  summary::-webkit-details-marker { display: none; }
  summary:hover { background: var(--surface-2); }
  summary:focus-visible { outline-offset: -2px; }
  .mark { font-family: var(--mono); color: var(--text-3); width: 1ch; flex: none; }
  .mark::before { content: "+"; }
  details[open] > summary .mark::before { content: "\2212"; }

  .chain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 14px 16px 10px; margin: 0; list-style: none; }
  .node { display: inline-flex; gap: 6px; align-items: center; padding: 4px 10px; border-radius: var(--radius); font-weight: 600; font-size: var(--fs-sm); border: 1px solid var(--line-strong); }
  .node.plain { color: var(--text-2); font-weight: 500; border-style: dashed; }
  .arrow { color: var(--connector); font-size: var(--fs-xs); }
  .verdict { margin: 0 16px 12px; padding: 8px 12px; color: var(--text); border-radius: var(--radius); overflow-wrap: anywhere; }
  .verdict.bad { background: var(--bad-soft); font-weight: 600; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 0 16px 12px; }
  .cmd { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 0 16px 12px; }
  .cmd code { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 3px 8px; color: var(--text); }

  .hop { border-top: 1px solid var(--line); }
  .hop > summary, .hop.plain { padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .hop .route { color: var(--text-2); }
  .hop .detail { color: var(--text-2); overflow-wrap: anywhere; min-width: 0; }
  .hop-body { padding: 0 16px 14px 40px; }
  .polled { margin-top: 4px; color: var(--text-2); overflow-wrap: anywhere; }
  .polled code { color: var(--text); }

  button { font: inherit; font-size: var(--fs-xs); border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--text); border-radius: var(--radius); padding: 2px 10px; cursor: pointer; }
  button:hover { background: var(--surface-3); }

  .table-wrap { overflow-x: auto; margin: 8px 0; }
  table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: var(--fs-sm); }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--text-3); font-weight: 500; white-space: nowrap; }
  td:first-child code { white-space: nowrap; overflow-wrap: normal; }
  .evidence-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 10px; }
  pre { font-size: var(--fs-xs); background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0 0; max-height: 360px; overflow-y: auto; }
  .full { margin-top: 8px; }
  .full > summary { display: inline-flex; gap: 6px; align-items: center; color: var(--accent); font-size: var(--fs-xs); padding: 2px 0; }
  .full > summary:hover { background: none; text-decoration: underline; }
  .full-head { display: flex; justify-content: flex-end; margin-top: 6px; }
  .note { color: var(--warn); font-size: var(--fs-xs); margin-top: 4px; }

  @media (max-width: 600px) {
    .chain { flex-direction: column; align-items: flex-start; }
    .arrow { transform: rotate(90deg); }
    .hop-body { padding-left: 16px; }
  }
</style>
</head>
<body>
<main id="app"></main>
<div id="announce" class="sr-only" aria-live="polite"></div>
<script>
const DATA = /*__SMOKE_DATA__*/null;

const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === 'class' ? (n.className = v) : n.setAttribute(k, v);
  for (const k of kids.flat()) if (k != null) n.append(k.nodeType ? k : document.createTextNode(String(k)));
  return n;
};
// Same words as the e2e report. Color always comes with a glyph and the word.
const STATUS = {
  pass: { word: 'passed', glyph: '✓', tone: 'ok' },
  fail: { word: 'failed', glyph: '✕', tone: 'bad' },
  'timed-out': { word: 'timed out', glyph: '✕', tone: 'bad' },
  'not-reached': { word: 'not reached', glyph: '–', tone: 'neutral' },
  skipped: { word: 'skipped', glyph: '–', tone: 'neutral' },
};
const st = (s) => STATUS[s] || { word: String(s), glyph: '–', tone: 'neutral' };
const pill = (s) => el('span', { class: 'pill tone-' + st(s).tone }, el('span', { 'aria-hidden': 'true' }, st(s).glyph), st(s).word);
const ms = (v) => (v == null ? '' : v >= 1000 ? (v / 1000).toFixed(1) + ' s' : v + ' ms');
const slug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const pad = (n) => String(n).padStart(2, '0');
function isoLocal(v) {
  const d = new Date(v);
  if (isNaN(d)) return String(v ?? '');
  const off = -d.getTimezoneOffset();
  const z = (off >= 0 ? '+' : '-') + pad(Math.floor(Math.abs(off) / 60)) + ':' + pad(Math.abs(off) % 60);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) + z;
}

async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const t = el('textarea', {}, text);
    document.body.append(t); t.select();
    try { document.execCommand('copy'); } catch {}
    t.remove();
  }
  const was = btn.textContent;
  btn.textContent = 'Copied';
  // Clear first so a second copy of the same thing is announced again.
  const live = document.getElementById('announce');
  live.textContent = '';
  setTimeout(() => { live.textContent = 'Copied ' + btn.dataset.what; }, 50);
  setTimeout(() => { btn.textContent = was; }, 1200);
}
// `what` names the thing copied, for the aria-label and the "Copied …" announcement.
const copyBtn = (text, what, label = 'Copy') => {
  const b = el('button', { type: 'button', 'aria-label': 'Copy ' + what, 'data-what': what }, label);
  b.onclick = () => copy(text, b);
  return b;
};

const firstBroken = (f) => f.hops.find((h) => h.status !== 'pass' && h.status !== 'not-reached');
const flowId = (f) => 'flow-' + slug(f.flow);
const entryOf = (f) => f.entry || 'entry';

// Short cause for one-line summaries: names the env var, or the trigger answer.
function cause(f) {
  if (f.error) return 'trigger → ' + entryOf(f) + ' failed';
  const b = firstBroken(f);
  if (!b) return '';
  if (b.envMismatch?.length) return b.service + ' env ' + b.envMismatch.join(', ');
  return b.service + ' ' + st(b.status).word;
}

function verdict(f) {
  if (f.error) return { bad: true, text: '✕ Trigger failed: ' + f.error };
  const broken = firstBroken(f);
  const ok = [entryOf(f), ...f.hops.filter((h) => h.status === 'pass').map((h) => h.service)].filter((s, i, a) => s !== a[i - 1]);
  if (!broken) return { bad: false, text: '✓ Every hop answered: ' + ok.join(' → ') + '.' };
  const what = broken.envMismatch?.length ? 'env var mismatch: ' + broken.detail : st(broken.status).word + (broken.detail ? ' (' + broken.detail + ')' : '');
  // The failing link already names its source node, so leave it out of the "OK" prefix.
  const before = broken.from && ok.at(-1) === broken.from ? ok.slice(0, -1) : ok;
  return { bad: true, text: '✕ ' + (before.length ? before.join(' → ') + ' OK; ' : '') + (broken.from ? broken.from + ' → ' : '') + broken.service + ' ' + what + '.' };
}

const pretty = (text) => { try { return JSON.stringify(JSON.parse(text), null, 2); } catch { return text; } };

// Shows only this hop's entry when the runner found one; the full body sits behind a toggle.
function evidence(label, e, what) {
  const box = el('div', {});
  const body = pretty(e.body || '');
  const entry = e.entry ? pretty(e.entry) : '';
  const shown = entry || body;
  box.append(el('div', { class: 'evidence-head' },
    el('span', { class: 'meta' }, label + ': HTTP ' + e.status + ' · ' + ms(e.ms)), el('code', {}, e.url),
    shown ? copyBtn(shown, (entry ? 'hop entry' : 'response body') + ' for ' + what) : null));
  if (entry) {
    box.append(el('div', { class: 'meta' }, 'This hop’s entry, ', el('code', {}, e.entryPath || 'hops[]'), ':'), el('pre', {}, entry));
    if (body) {
      const full = el('details', { class: 'full' }, el('summary', {}, el('span', { class: 'mark', 'aria-hidden': 'true' }), 'Show full response'),
        el('div', { class: 'full-head' }, copyBtn(body, 'full response for ' + what)), el('pre', {}, body));
      if (e.truncated) full.append(el('div', { class: 'note' }, 'Truncated: only the first 2,000 characters were kept.'));
      box.append(full);
    }
  } else {
    if (body) box.append(el('pre', {}, body));
    if (e.truncated) box.append(el('div', { class: 'note' }, 'Truncated: only the first 2,000 characters were kept.'));
  }
  return box;
}

function polled(p) {
  const answer = p.sameStatus ? (p.polls > 1 ? p.lastStatus + ' each time' : p.lastStatus) : 'last answer ' + p.lastStatus;
  return el('div', { class: 'polled' }, 'Polled ', el('code', {}, (p.method || 'GET') + ' ' + p.lastUrl), ' ' + p.polls + '× over ' + ms(p.waitedMs) + ' — HTTP ' + answer +
    (p.lastReason ? ' (' + p.lastReason + ')' : '') + '.');
}

function hopRow(f, h) {
  const route = el('span', { class: 'route' }, (h.from ? h.from + ' → ' : '') + h.service + (h.transport ? ' via ' + h.transport : ''));
  const id = flowId(f) + '-hop-' + slug(h.id || h.service);
  if (h.status === 'not-reached') {
    return el('div', { class: 'hop plain', id }, el('span', { class: 'mark', 'aria-hidden': 'true', style: 'visibility:hidden' }), pill(h.status), route,
      el('span', { class: 'meta' }, 'Not checked: an earlier hop failed.'));
  }
  const d = el('details', { class: 'hop', id });
  d.append(el('summary', {}, el('span', { class: 'mark', 'aria-hidden': 'true' }), pill(h.status), route,
    el('span', { class: 'meta' }, ms(h.ms)), h.detail ? el('span', { class: 'detail' }, h.detail) : null));
  const body = el('div', { class: 'hop-body' });
  if (h.polling) body.append(polled(h.polling));
  if (h.instance) body.append(el('div', { class: 'meta' }, 'Instance: ', el('code', {}, h.instance)));
  if (h.env?.length) {
    body.append(el('div', { class: 'table-wrap' }, el('table', {},
      el('thead', {}, el('tr', {}, el('th', { scope: 'col' }, 'Env var'), el('th', { scope: 'col' }, 'Used'), el('th', { scope: 'col' }, 'Check'))),
      el('tbody', {}, h.env.map((e) => el('tr', {}, el('td', {}, el('code', {}, e.name)), el('td', {}, el('code', {}, e.value ?? '')),
        el('td', {}, pill(e.ok ? 'pass' : 'fail'), e.note ? ' ' + e.note : '')))))));
  }
  if (h.evidence) body.append(evidence(h.polling ? 'Last poll' : 'Evidence', h.evidence, h.service + ' in ' + f.flow));
  if (!body.childNodes.length) body.append(el('div', { class: 'meta' }, 'The runner recorded no request for this hop.'));
  d.append(body);
  d.open = h.status !== 'pass';
  return d;
}

function flowBox(f) {
  const failed = f.status !== 'pass';
  const id = flowId(f);
  const box = el('section', { class: 'flow', id, 'aria-labelledby': id + '-name' });
  const panel = el('div', { id: id + '-panel' });
  const toggle = el('button', { type: 'button', class: 'flow-toggle', 'aria-controls': id + '-panel' },
    el('span', { class: 'mark', 'aria-hidden': 'true' }), pill(f.status), el('span', { class: 'flow-name-text', id: id + '-name' }, f.flow),
    f.description ? el('span', { class: 'meta' }, f.description) : null, el('span', { class: 'meta' }, ms(f.ms)));
  const set = (open) => { toggle.setAttribute('aria-expanded', String(open)); panel.hidden = !open; };
  toggle.onclick = () => set(panel.hidden);
  set(failed);
  box.append(el('h3', { class: 'flow-head' }, toggle), panel);

  const chain = el('div', { class: 'chain', role: 'list', 'aria-label': 'Hop chain' });
  const node = (name, s) => el('span', { class: 'node tone-' + st(s).tone, role: 'listitem' },
    el('span', { 'aria-hidden': 'true' }, st(s).glyph), name, el('span', { class: 'sr-only' }, ' ' + st(s).word));
  const arrow = () => el('span', { class: 'arrow', 'aria-hidden': 'true' }, '→');
  chain.append(el('span', { class: 'node plain', role: 'listitem' }, 'trigger'), arrow(), node(entryOf(f), f.error ? 'fail' : 'pass'));
  let prev = entryOf(f);
  for (const h of f.hops) {
    // A hop that starts somewhere other than the previous node gets its own source node, so the chain stays truthful.
    if (h.from && h.from !== prev && h.from !== 'runner') chain.append(arrow(), el('span', { class: 'node plain', role: 'listitem' }, h.from));
    chain.append(arrow(), node(h.service, h.status));
    prev = h.service;
  }
  const v = verdict(f);
  panel.append(chain, el('div', { class: 'verdict' + (v.bad ? ' bad' : '') }, v.text));

  const facts = el('div', { class: 'facts' });
  if (f.probeId) facts.append(el('span', { class: 'meta' }, 'Probe ID: ', el('code', {}, f.probeId)));
  if (f.startedAt) facts.append(el('span', { class: 'meta' }, 'Started ' + isoLocal(f.startedAt)));
  if (facts.childNodes.length) panel.append(facts);
  if (failed && f.rerun) panel.append(el('div', { class: 'cmd' }, el('span', { class: 'meta' }, 'Rerun this flow:'), el('code', {}, f.rerun), copyBtn(f.rerun, 'rerun command for ' + f.flow)));

  if (f.trigger) {
    const t = el('details', { class: 'hop', id: id + '-trigger' });
    t.append(el('summary', {}, el('span', { class: 'mark', 'aria-hidden': 'true' }), pill(f.error ? 'fail' : 'pass'),
      el('span', { class: 'route' }, 'trigger → ' + entryOf(f)), el('span', { class: 'meta' }, ms(f.trigger.ms))),
      el('div', { class: 'hop-body' }, evidence('Trigger', f.trigger, 'trigger of ' + f.flow)));
    t.open = !!f.error;
    panel.append(t);
  }
  for (const h of f.hops) panel.append(hopRow(f, h));
  box.reveal = set;
  return box;
}

function render() {
  const app = document.getElementById('app');
  if (!DATA) { app.append(el('p', {}, 'No data in this report.')); return; }
  const passed = DATA.flows.filter((f) => f.status === 'pass').length;
  app.append(el('header', {},
    el('h1', {}, 'Smoke report · ' + DATA.env, pill(DATA.status)),
    el('div', { class: 'summary-line meta' },
      el('span', {}, passed + ' / ' + DATA.flows.length + ' flows passed'),
      el('span', {}, ms(DATA.ms)),
      el('time', { datetime: DATA.startedAt }, isoLocal(DATA.startedAt))),
    DATA.command ? el('div', { class: 'summary-line meta' }, el('span', {}, 'Command: ', el('code', {}, DATA.command)), copyBtn(DATA.command, 'run command')) : null));

  // Failed flows first; the rest keep the runner's order.
  const flows = DATA.flows.map((f, n) => [f, n]).sort((a, b) => (a[0].status === 'pass') - (b[0].status === 'pass') || a[1] - b[1]).map((x) => x[0]);
  const failed = flows.filter((f) => f.status !== 'pass');
  const boxes = {};
  if (failed.length) {
    app.append(el('p', { class: 'lead' }, failed.length + ' of ' + DATA.flows.length + ' flows broken',
      el('span', { class: 'sep', 'aria-hidden': 'true' }, ' · '), el('span', { class: 'sr-only' }, '. '), 'first break: ' + cause(failed[0]) + ' (' + failed[0].flow + ')'));
    app.append(el('h2', {}, 'Broken links ', el('span', { class: 'count' }, '(' + failed.length + ')')));
    app.append(el('ul', { class: 'broken' }, failed.map((f) => {
      const b = firstBroken(f);
      const from = f.error ? 'trigger' : b?.from || 'trigger';
      const to = f.error ? entryOf(f) : b?.service || '';
      const detail = f.error || (b?.envMismatch?.length ? 'env ' + b.detail : b?.detail) || st(b?.status).word;
      const a = el('a', { href: '#' + flowId(f) }, pill(b?.status || f.status), el('span', { class: 'flow-name' }, f.flow),
        el('span', {}, from + ' → ' + to), el('span', { class: 'detail' }, '— ' + detail));
      a.onclick = () => boxes[f.flow]?.reveal(true);
      return el('li', {}, a);
    })));
  }
  app.append(el('h2', {}, 'Flows ', el('span', { class: 'count' }, '(' + DATA.flows.length + ')')));
  for (const f of flows) { const b = flowBox(f); boxes[f.flow] = b; app.append(b); }
}
render();
</script>
</body>
</html>
