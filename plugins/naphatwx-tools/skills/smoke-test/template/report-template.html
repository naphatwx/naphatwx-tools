<html lang="en">

<style>
  /* theme:tokens:start */
  /* Synced from theme/tokens.css by theme/sync.mjs. Do not edit here. */
  :root {
      color-scheme: dark;

      /* Surfaces, darkest first */
      --bg: #121316;
      --surface: #18191d;
      --surface-2: #1f2025;
      --surface-3: #24262c;
      --line: #4a4d55;
      --line-strong: #5c6069;
      --line-3: #70737d;
      /* Hover fill for every control: a clear step up from any surface. Hover never changes the border */
      --hover: #33353b;

      /* Ink. Running text is --text; text-2 / text-3 are for chrome and meta labels only */
      --text: #e2e3e7;
      --text-2: #c6c8cf;
      --text-3: #a3a6b0;

      /* One accent */
      --accent: #8ab0ff;
      --accent-fill: #1b2232;
      --accent-soft: rgba(138, 176, 255, 0.12);

      /* Status: one hue set, two meanings. ok = add / pass, warn = change / flaky, bad = drop / fail */
      --ok: #8fd694;
      --warn: #f0c26b;
      --bad: #f28b8d;
      --neutral: #a3a6b0;
      --ok-soft: rgba(143, 214, 148, 0.12);
      --warn-soft: rgba(240, 194, 107, 0.12);
      --bad-soft: rgba(242, 139, 141, 0.12);
      --neutral-soft: rgba(163, 166, 176, 0.12);
      --add: var(--ok);
      --change: var(--warn);
      --drop: var(--bad);

      /* Diagrams: connectors and their labels */
      --connector: #6b6e78;

      /* Type. ui-monospace first, or macOS Chromium falls back to Courier */
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Cascadia Code", monospace;

      /* Type scale. Nothing renders below --fs-xs. Pages set font sizes by role (below), not by step. */
      --fs-xs: 0.75rem;
      --fs-sm: 0.875rem;
      --fs-md: 1rem;
      --fs-lg: 1.25rem;
      --fs-xl: 1.5rem;
      --fs-2xl: 2rem;
      /* Headings and lead line: the same steps on every page */
      --fs-lead: var(--fs-lg);
      --fs-h3: var(--fs-lg);
      --fs-h2: var(--fs-xl);
      --fs-h1: var(--fs-2xl);
      /* Roles: one step down per role, so the eye lands on body text first.
         body = running text, tables, buttons, action bars · meta = hints, asides, legends, captions, code · tag = pills, kbd, counts */
      --fs-body: var(--fs-md);
      --fs-meta: var(--fs-sm);
      --fs-code: var(--fs-sm);
      --fs-tag: var(--fs-xs);
      /* Diagrams draw at 1:1 with shapes sized for 14px: main labels 14, secondary lines (detail, sub, note, type) 12 */
      --fs-dia: var(--fs-sm);
      --fs-dia-sub: var(--fs-xs);

      /* Max widths: Tailwind max-w steps (md 448px, 3xl 768px, 4xl 896px, 5xl 1024px, 6xl 1152px, 7xl 1280px). Use these, not raw px */
      --max-w-md: 28rem;
      --max-w-3xl: 48rem;
      --max-w-4xl: 56rem;
      --max-w-5xl: 64rem;
      --max-w-6xl: 72rem;
      --max-w-7xl: 80rem;

      /* Page frame: every page centers its content at the same width, 80% of the window up to --max-w-5xl */
      --page-w: min(80%, var(--max-w-5xl));
      --gutter: clamp(16px, 3vw, 24px);

      --radius: 6px;
      --radius-md: 8px;
      --radius-lg: 10px;
      --radius-xl: 12px;
      --ease: cubic-bezier(0.2, 0, 0, 1);
  }

  /* Text size picker (theme/font-size.js) sets html[data-fs]. Medium is the default above.
     Only body, meta and code change; Large also grows tags and diagram labels. */

      --fs-body: 0.875rem;
      --fs-meta: 0.75rem;
      --fs-code: 0.75rem;
  }
  :root[data-fs="large"] {
      --fs-body: 1.125rem;
      --fs-meta: 1rem;
      --fs-code: 1rem;
      --fs-tag: 0.875rem;
      --fs-dia: 1rem;
      --fs-dia-sub: 0.875rem;

  /* theme:tokens:end */
  /* theme:base:start */
  /* Synced from theme/base.css by theme/sync.mjs. Do not edit here. */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(138, 176, 255, 0.35); color: #fff; }
  /* Chrome ignores ::-webkit-scrollbar once scrollbar-color is set, so the standard rule is for Firefox only */
  @supports not selector(::-webkit-scrollbar) { * { scrollbar-width: auto; scrollbar-color: var(--line-3) transparent; } }
  ::-webkit-scrollbar { width: 12px; height: 12px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-3); border-radius: var(--radius-md); }

  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  code, kbd, pre, samp { font-family: var(--mono); }
  /* Label over a group (section, field, table column, step list): uppercase at meta size, tracked so caps stay readable */
  .label, th, dt { color: var(--text-2); font-size: var(--fs-meta); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  /* Data inside a label (counts, names, notes, controls) keeps its own case */
  :is(.label, th, dt) :is(.label-note, button, input, kbd, code) { text-transform: none; letter-spacing: normal; }
  .label-note { font-weight: 400; }
  /* Scenario kind pill: basic (the main path), alternate (another path to the goal), exception (goal not reached).
     Outlined and tinted, so it never reads like the solid Core pill */
  .scenario-kind { display: inline-flex; align-items: center; flex: none; padding: 1px 8px; font: 600 var(--fs-tag)/1.5 var(--mono); text-transform: uppercase; white-space: nowrap; color: var(--neutral); background: var(--neutral-soft); border: 1px solid currentColor; border-radius: 999px; }
  .scenario-kind.basic { color: var(--ok); background: var(--ok-soft); }
  .scenario-kind.exception { color: var(--bad); background: var(--bad-soft); }
  /* Core scenario ("core": true in use-cases.js): play it first. Solid accent so it reads in a long list */
  .core-pill { display: inline-flex; align-items: center; flex: none; padding: 1px 8px; font: 600 var(--fs-tag)/1.5 var(--mono); color: var(--bg); text-transform: uppercase; background: var(--accent); border: 1px solid var(--accent); border-radius: 999px; white-space: nowrap; }
  /* trace IDs hide behind a "N refs" chip; a click shows them on the same line */
  .references-chip { flex: none; padding: 1px 8px; font: var(--fs-tag)/1.5 var(--mono); color: var(--text-2); text-transform: uppercase; background: none; border: 1px solid var(--line-strong); border-radius: 999px; cursor: pointer; }
  .references-chip:hover { background: var(--hover); }
  .references-chip[aria-expanded="true"] { color: var(--accent); border-color: var(--accent); }
  .references-chip[aria-expanded="false"] + .references-ids { display: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
  }
  /* theme:base:end */
  /* theme:pdf:start */
  /* Synced from theme/pdf.css by theme/sync.mjs. Do not edit here. */
  /* .float-bar: one long box at the bottom right; Export PDF goes last, page tools can sit before it */
  .float-bar { position: fixed; right: 20px; bottom: 20px; z-index: 50; display: flex; gap: 2px; padding: 4px; background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: var(--radius-xl); }
  .float-bar button { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border: 0; border-radius: var(--radius-md); background: none; color: var(--text-2); font: 500 var(--fs-body) var(--sans); white-space: nowrap; cursor: pointer; }

  @page { margin: 0; }
  @media print {
      html, body { background: var(--bg); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .no-print { display: none !important; }
      body:has(.float-bar) { --float-space: 0px; padding-bottom: 0; }

  }
  /* theme:pdf:end */
  /* theme:font-size:start */
  /* Synced from theme/font-size.css by theme/sync.mjs. Do not edit here. */
  .fs-picker {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 2px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-lg);
      background: var(--surface-2);
  }
  /* Inside the float bar: no box of its own, a line before Export PDF */

      padding: 0 4px 0 0;
      margin-right: 2px;
      border: 0;
      border-right: 1px solid var(--line-strong);
      border-radius: 0;
      background: none;
  }
  /* .fs-picker prefix: beats toolbar rules like `.tools button` and `.float-bar button` */
  .fs-picker .fs-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 30px;
      height: 30px;
      padding: 0;

      color: var(--text-3);

      font-family: var(--sans);

  .float-bar .fs-picker .fs-btn { height: 32px; border-radius: var(--radius-md); }
  /* px, not rem: the picker must not resize itself when the text size changes */
  .fs-picker .fs-btn[data-size="small"] { font-size: 12px; }
  .fs-picker .fs-btn[data-size="medium"] { font-size: 15px; }
  .fs-picker .fs-btn[data-size="large"] { font-size: 18px; }
  .fs-picker .fs-btn:hover { background: var(--hover); color: var(--text); }
  .fs-picker .fs-btn.active { background: var(--accent-soft); color: var(--accent); }
  /* theme:font-size:end */

  /* theme:report:start */
  /* Synced from theme/report.css by theme/sync.mjs. Do not edit here. */
  body { font-size: var(--fs-body); line-height: 1.5; }
  [hidden] { display: none !important; }
  /* no sidebar here, so the report gets a wider column than the theme text width */
  main { max-width: min(80%, var(--max-w-5xl)); margin: 0 auto; padding: 16px var(--gutter) 48px; }
  h1 { font-size: var(--fs-h1); line-height: 1.25; margin: 0; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; overflow-wrap: anywhere; }
  code { font-size: var(--fs-code); overflow-wrap: anywhere; }

  .pill { display: inline-flex; gap: 5px; align-items: center; padding: 1px 9px; border-radius: 999px; font-weight: 600; font-size: var(--fs-tag); text-transform: uppercase; white-space: nowrap; }
  .tone-ok { color: var(--ok); background: var(--ok-soft); }
  .tone-warn { color: var(--warn); background: var(--warn-soft); }
  .tone-bad { color: var(--bad); background: var(--bad-soft); }
  .tone-neutral { color: var(--neutral); background: var(--neutral-soft); }
  .tone-accent { color: var(--accent); background: var(--accent-soft); }

  .summary-line .lead { font-weight: 600; }
  .summary-line .meta { font-size: var(--fs-meta); }
  .summary-line .color-bad { color: var(--bad); }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; }
  .tools button[aria-pressed="true"] { background: var(--accent-fill); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .empty-filter { margin-top: 16px; font-size: var(--fs-meta); }
  .head-row { display: flex; gap: 6px 16px; flex-wrap: wrap; align-items: center; }
  .command code { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 3px 8px; color: var(--text); }
  /* theme:report:end */
  /* theme:disclosure:start */
  /* Synced from theme/disclosure.css by theme/sync.mjs. Do not edit here. */
  /* Disclosure is h2 (or h3) > button, not <summary>: a summary flattens any heading inside it for screen readers. */
  .disclosure { border: 1px solid var(--line); border-radius: var(--radius-lg); margin-top: 6px; background: var(--surface); overflow: hidden; }

  .disclosure.open > .disclosure-head, .disclosure.open > .disclosure-head:hover { background: var(--accent-fill); border-bottom: 1px solid var(--line-strong); }

  .disclosure-head :is(h2, h3) { min-width: 0; font-size: var(--fs-body); }
  .disclosure-head :is(h2, h3) button { all: unset; display: flex; flex-direction: row; gap: 12px; align-items: center; cursor: pointer; border-radius: var(--radius); }

  summary:hover { background: var(--hover); }

  .chain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px 14px 8px; margin: 0; list-style: none; }
  .node { display: inline-flex; gap: 6px; align-items: center; padding: 2px 10px; border-radius: var(--radius); font-weight: 600; font-size: var(--fs-body); border: 1px solid var(--line-strong); }

  /* Hops are a numbered table-like list: fixed columns so status, route and time line up row to row.

  .hop-row .route { overflow-wrap: anywhere; min-width: 0; }
  .hop-row .via { color: var(--text-3); }
  .hop-row .meta { text-align: right; white-space: nowrap; }
  .hop.skipped .route { color: var(--text-3); }
  .hop[open] > .hop-row { background: var(--surface-2); }
  .hop-body { padding: 8px 12px 10px calc(2ch + 24px); border-top: 1px solid var(--line); display: grid; gap: 8px; min-width: 0; }
  .hop-body .why { color: var(--text); font-weight: 600; overflow-wrap: anywhere; }
  .hop-body .why.bad { color: var(--bad); }
  .polled { margin-top: 4px; color: var(--text-2); overflow-wrap: anywhere; }
  .polled code { color: var(--text); }

  button { font: inherit; font-size: var(--fs-body); border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--text); border-radius: var(--radius); padding: 2px 10px; cursor: pointer; }
  button:hover { background: var(--hover); }

  .table-wrap { overflow-x: auto; margin: 8px 0; }
  table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: var(--fs-body); }
  th, td { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { white-space: nowrap; }
  td:first-child code { white-space: nowrap; overflow-wrap: normal; }
  .evidence-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 10px; }
  pre { font-size: var(--fs-code); background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0 0; max-height: 360px; overflow-y: auto; }
  .full { margin-top: 8px; }
  .full > summary { display: inline-flex; gap: 6px; align-items: center; color: var(--accent); padding: 2px 0; }
  .full > summary:hover { background: none; text-decoration: underline; }
  .full-head { display: flex; justify-content: flex-end; margin-top: 6px; }
  .note { color: var(--warn); margin-top: 4px; }
  .head-row > button { padding: 4px 10px; }

  /* PDF: the flows as filtered and opened on screen, full height, no controls. */
  @media print {
    main { max-width: none; padding: 16px; }
    .tools, .full-head, header button { display: none !important; }
    pre { max-height: none; overflow: visible; }
  }

  @media (max-width: 600px) {
    .chain { flex-direction: column; align-items: flex-start; }
    .arrow { transform: rotate(90deg); }
    .hop-row { grid-template-columns: 1ch 2ch minmax(0, 1fr) auto; row-gap: 4px; }
    .hop-row .pill { grid-column: 3; grid-row: 1; justify-self: start; }
    .hop-row .route { grid-column: 3 / -1; grid-row: 2; }
    .hop-body { padding-left: 12px; }
  }
</style>

const createElement = (tag, attributes = {}, ...children) => {
  const node = document.createElement(tag);
  for (const [name, value] of Object.entries(attributes)) name === 'class' ? (node.className = value) : node.setAttribute(name, value);
  for (const child of children.flat()) if (child != null) node.append(child.nodeType ? child : document.createTextNode(String(child)));
  return node;
};
// Same words as the e2e report. Color always comes with a glyph and the word.
const STATUS = {
  pass: { word: 'passed', glyph: '✓', tone: 'ok' },
  fail: { word: 'failed', glyph: '✕', tone: 'bad' },
  'timed-out': { word: 'timed out', glyph: '✕', tone: 'bad' },
  'not-reached': { word: 'not reached', glyph: '–', tone: 'neutral' },
  skipped: { word: 'skipped', glyph: '–', tone: 'neutral' },
};
const statusOf = (status) => STATUS[status] || { word: String(status), glyph: '–', tone: 'neutral' };
const pill = (status) => createElement('span', { class: 'pill tone-' + statusOf(status).tone }, createElement('span', { 'aria-hidden': 'true' }, statusOf(status).glyph), statusOf(status).word);
const formatDuration = (milliseconds) => (milliseconds == null ? '' : milliseconds >= 1000 ? (milliseconds / 1000).toFixed(1) + ' s' : milliseconds + ' ms');
const slug = (text) => String(text).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const pad = (number) => String(number).padStart(2, '0');
function isoLocal(value) {
  const date = new Date(value);
  if (isNaN(date)) return String(value ?? '');
  const offsetMinutes = -date.getTimezoneOffset();
  const timezone = (offsetMinutes >= 0 ? '+' : '-') + pad(Math.floor(Math.abs(offsetMinutes) / 60)) + ':' + pad(Math.abs(offsetMinutes) % 60);
  return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate()) + 'T' + pad(date.getHours()) + ':' + pad(date.getMinutes()) + ':' + pad(date.getSeconds()) + timezone;
}

async function copy(text, button) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const textarea = createElement('textarea', {}, text);
    document.body.append(textarea); textarea.select();
    try { document.execCommand('copy'); } catch {}
    textarea.remove();
  }
  const previousLabel = button.textContent;
  button.textContent = 'Copied';
  // Clear first so a second copy of the same thing is announced again.
  const live = document.getElementById('announce');
  live.textContent = '';
  setTimeout(() => { live.textContent = 'Copied ' + button.dataset.what; }, 50);
  setTimeout(() => { button.textContent = previousLabel; }, 1200);
}
// `what` names the thing copied, for the aria-label and the "Copied …" announcement.
const copyButton = (text, what, label = 'Copy') => {
  const button = createElement('button', { type: 'button', 'aria-label': 'Copy ' + what, 'data-what': what }, label);
  button.onclick = () => copy(text, button);
  return button;
};

const firstBroken = (flow) => flow.hops.find((h) => h.status !== 'pass' && h.status !== 'not-reached');
const flowId = (flow) => 'flow-' + slug(flow.flow);
const entryOf = (flow) => flow.entry || 'entry';

function verdict(flow) {
  if (flow.error) return { bad: true, text: '✕ Trigger failed: ' + flow.error };
  const broken = firstBroken(flow);
  const answered = [entryOf(flow), ...flow.hops.filter((h) => h.status === 'pass').map((h) => h.service)].filter((s, i, a) => s !== a[i - 1]);
  if (!broken) return { bad: false, text: '✓ Every hop answered: ' + answered.join(' → ') + '.' };
  const what = broken.envMismatch?.length ? 'env var mismatch: ' + broken.detail : statusOf(broken.status).word + (broken.detail ? ' (' + broken.detail + ')' : '');
  // The failing link already names its source node, so leave it out of the "OK" prefix.
  const before = broken.from && answered.at(-1) === broken.from ? answered.slice(0, -1) : answered;
  return { bad: true, text: '✕ ' + (before.length ? before.join(' → ') + ' OK; ' : '') + (broken.from ? broken.from + ' → ' : '') + broken.service + ' ' + what + '.' };
}

const pretty = (text) => { try { return JSON.stringify(JSON.parse(text), null, 2); } catch { return text; } };

// Shows only this hop's entry when the runner found one; the full body sits behind a toggle.
function evidence(label, record, what) {
  const box = createElement('div', {});
  const body = pretty(record.body || '');
  const entry = record.entry ? pretty(record.entry) : '';
  const shown = entry || body;
  box.append(createElement('div', { class: 'evidence-head' },
    createElement('span', { class: 'meta' }, label + ': HTTP ' + record.status + ' · ' + formatDuration(record.ms)), createElement('code', {}, record.url),
    shown ? copyButton(shown, (entry ? 'hop entry' : 'response body') + ' for ' + what) : null));
  if (entry) {
    box.append(createElement('div', { class: 'meta' }, 'This hop’s entry, ', createElement('code', {}, record.entryPath || 'hops[]'), ':'), createElement('pre', {}, entry));
    if (body) {
      const full = createElement('details', { class: 'full' }, createElement('summary', {}, 'Show full response'),
        createElement('div', { class: 'full-head' }, copyButton(body, 'full response for ' + what)), createElement('pre', {}, body));
      if (record.truncated) full.append(createElement('div', { class: 'note' }, 'Truncated: only the first 2,000 characters were kept.'));
      box.append(full);
    }
  } else {
    if (body) box.append(createElement('pre', {}, body));
    if (record.truncated) box.append(createElement('div', { class: 'note' }, 'Truncated: only the first 2,000 characters were kept.'));
  }
  return box;
}

function polled(polling) {
  const answer = polling.sameStatus ? (polling.polls > 1 ? polling.lastStatus + ' each time' : polling.lastStatus) : 'last answer ' + polling.lastStatus;
  return createElement('div', { class: 'polled' }, 'Polled ', createElement('code', {}, (polling.method || 'GET') + ' ' + polling.lastUrl), ' ' + polling.polls + '× over ' + formatDuration(polling.waitedMs) + ' — HTTP ' + answer +
    (polling.lastReason ? ' (' + polling.lastReason + ')' : '') + '.');
}

// One numbered row per hop; a closed row is a single line, the cause and evidence open below it.
function hopShell(tag, number, status, from, to, via, time) {
  return createElement(tag, { class: 'hop-row' }, createElement('span', { class: 'number' }, number), pill(status),
    createElement('span', { class: 'route' }, (from ? from + ' → ' : '') + to, via ? createElement('span', { class: 'via' }, '  via ' + via) : null),
    createElement('span', { class: 'meta' }, time));
}

function hopRow(flow, hop, number) {
  const id = flowId(flow) + '-hop-' + slug(hop.id || hop.service);
  if (hop.status === 'not-reached') {
    return createElement('li', { class: 'hop skipped', id }, hopShell('div', number, hop.status, hop.from, hop.service, hop.transport, 'not checked'));
  }
  const details = createElement('details', { class: 'hop', id });
  details.append(hopShell('summary', number, hop.status, hop.from, hop.service, hop.transport, formatDuration(hop.ms)));
  const body = createElement('div', { class: 'hop-body' });
  if (hop.detail) body.append(createElement('div', { class: 'why' + (hop.status === 'pass' ? '' : ' bad') }, hop.detail));
  if (hop.polling) body.append(polled(hop.polling));
  if (hop.instance) body.append(createElement('div', { class: 'meta' }, 'Instance: ', createElement('code', {}, hop.instance)));
  if (hop.env?.length) {
    body.append(createElement('div', { class: 'table-wrap' }, createElement('table', {},
      createElement('thead', {}, createElement('tr', {}, createElement('th', { scope: 'col' }, 'Env var'), createElement('th', { scope: 'col' }, 'Used'), createElement('th', { scope: 'col' }, 'Check'))),
      createElement('tbody', {}, hop.env.map((envVar) => createElement('tr', {}, createElement('td', {}, createElement('code', {}, envVar.name)), createElement('td', {}, createElement('code', {}, envVar.value ?? '')),
        createElement('td', {}, pill(envVar.ok ? 'pass' : 'fail'), envVar.note ? ' ' + envVar.note : '')))))));
  }
  if (hop.evidence) body.append(evidence(hop.polling ? 'Last poll' : 'Evidence', hop.evidence, hop.service + ' in ' + flow.flow));
  if (!body.childNodes.length) body.append(createElement('div', { class: 'meta' }, 'The runner recorded no request for this hop.'));
  details.append(body);
  return createElement('li', {}, details);
}

/* theme:slide-js:start */
/* Synced from theme/slide.js by theme/sync.mjs. Do not edit here. */
const EASE = getComputedStyle(document.documentElement).getPropertyValue('--ease').trim() || 'ease';
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
function slide(panel, open, instant) {
  const from = panel.hidden ? 0 : panel.getBoundingClientRect().height;
  panel.getAnimations().forEach((a) => a.cancel());
  panel.style.overflow = '';
  panel.hidden = false;
  const to = open ? panel.getBoundingClientRect().height : 0;
  if (instant || reducedMotion.matches || from === to) { panel.hidden = !open; return; }
  const computedStyle = getComputedStyle(panel);
  const keyframe = (height) => height ? { height: height + 'px', paddingTop: computedStyle.paddingTop, paddingBottom: computedStyle.paddingBottom, opacity: 1 }
    : { height: '0px', paddingTop: '0px', paddingBottom: '0px', opacity: 0 };
  panel.style.overflow = 'hidden';
  const animation = panel.animate([keyframe(from), keyframe(to)], { duration: 220, easing: EASE, fill: 'forwards' });
  animation.onfinish = () => { panel.hidden = !open; panel.style.overflow = ''; animation.cancel(); };
}
/* theme:slide-js:end */

let closeOpen = null;

function flowBox(flow) {
  const failed = flow.status !== 'pass';
  const id = flowId(flow);
  const box = createElement('section', { class: 'flow disclosure', id, 'aria-labelledby': id + '-name' });
  const panel = createElement('div', { id: id + '-panel' });
  box.dataset.kind = failed ? 'failed' : 'passed';
  const toggle = createElement('button', { type: 'button', 'aria-controls': id + '-panel' },
    pill(flow.status), createElement('span', { id: id + '-name' }, flow.flow));
  const head = createElement('div', { class: 'flow-head disclosure-head' }, createElement('h2', {}, toggle),
    createElement('div', { class: 'info' }, flow.description ? createElement('span', { class: 'meta' }, flow.description) : null, createElement('span', { class: 'meta' }, formatDuration(flow.ms))));
  // Same disclosure as the e2e report: the whole row is a mouse target, the heading's button serves keyboards.
  head.onclick = (e) => { if (!e.target.closest('button')) toggle.click(); };
  const set = (open, instant) => { box.classList.toggle('open', open); toggle.setAttribute('aria-expanded', String(open)); slide(panel, open, instant); };
  toggle.onclick = () => {
    const open = !box.classList.contains('open');
    // Only one flow open at a time; the other shuts at once so this row can be scrolled back into view.
    const other = open && closeOpen && closeOpen !== close;
    if (other) closeOpen(true);
    closeOpen = open ? close : null;
    set(open);
    if (other) head.scrollIntoView({ block: 'nearest' });
  };
  const close = (instant) => set(false, instant);
  set(false, true);
  box.append(head, panel);

  const chain = createElement('div', { class: 'chain', role: 'list', 'aria-label': 'Hop chain' });
  const node = (name, status) => createElement('span', { class: 'node tone-' + statusOf(status).tone, role: 'listitem' },
    createElement('span', { 'aria-hidden': 'true' }, statusOf(status).glyph), name, createElement('span', { class: 'sr-only' }, ' ' + statusOf(status).word));
  const arrow = () => createElement('span', { class: 'arrow', 'aria-hidden': 'true' }, '→');
  chain.append(createElement('span', { class: 'node plain', role: 'listitem' }, 'trigger'), arrow(), node(entryOf(flow), flow.error ? 'fail' : 'pass'));
  let previousService = entryOf(flow);
  for (const hop of flow.hops) {
    // A hop that starts somewhere other than the previous node gets its own source node, so the chain stays truthful.
    if (hop.from && hop.from !== previousService && hop.from !== 'runner') chain.append(arrow(), createElement('span', { class: 'node plain', role: 'listitem' }, hop.from));
    chain.append(arrow(), node(hop.service, hop.status));
    previousService = hop.service;
  }
  const flowVerdict = verdict(flow);
  panel.append(chain, createElement('div', { class: 'verdict' + (flowVerdict.bad ? ' bad' : '') }, flowVerdict.text));

  const facts = createElement('div', { class: 'facts' });
  if (flow.probeId) facts.append(createElement('span', { class: 'meta' }, 'Probe ID: ', createElement('code', {}, flow.probeId)));
  if (flow.startedAt) facts.append(createElement('span', { class: 'meta' }, 'Started ' + isoLocal(flow.startedAt)));
  if (facts.childNodes.length) panel.append(facts);
  if (failed && flow.rerun) panel.append(createElement('div', { class: 'command' }, createElement('span', { class: 'meta' }, 'Rerun this flow:'), createElement('code', {}, flow.rerun), copyButton(flow.rerun, 'rerun command for ' + flow.flow)));

  const list = createElement('ol', { class: 'hops', 'aria-label': 'Hops of ' + flow.flow });
  if (flow.trigger) {
    const triggerRow = createElement('details', { class: 'hop', id: id + '-trigger' });
    triggerRow.append(hopShell('summary', '0', flow.error ? 'fail' : 'pass', 'trigger', entryOf(flow), '', formatDuration(flow.trigger.ms)),
      createElement('div', { class: 'hop-body' }, flow.error ? createElement('div', { class: 'why bad' }, flow.error) : null, evidence('Trigger', flow.trigger, 'trigger of ' + flow.flow)));
    list.append(createElement('li', {}, triggerRow));
  }
  flow.hops.forEach((hop, i) => list.append(hopRow(flow, hop, String(i + 1))));
  panel.append(createElement('div', { class: 'label hops-label' }, 'Hops'), list);
  return box;
}

function render() {
  const app = document.getElementById('app');
  if (!DATA) { app.append(createElement('p', {}, 'No data in this report.')); return; }
  const counts = { failed: 0, passed: 0 };
  for (const flow of DATA.flows) counts[flow.status === 'pass' ? 'passed' : 'failed']++;
  // Failed flows first; the rest keep the runner's order.
  const flows = DATA.flows.map((f, i) => [f, i]).sort((a, b) => (a[0].status === 'pass') - (b[0].status === 'pass') || a[1] - b[1]).map((x) => x[0]);
  const boxes = flows.map(flowBox);
  const none = createElement('p', { class: 'meta empty-filter', hidden: '' }, 'No flows match this filter.');
  const tools = createElement('div', { class: 'tools', role: 'group', 'aria-label': 'Show flows' });
  const FILTERS = [['all', 'All', DATA.flows.length], ['failed', 'Failed', counts.failed], ['passed', 'Passed', counts.passed]];
  const buttons = FILTERS.map(([key, label, total]) => {
    const button = createElement('button', { type: 'button', 'aria-pressed': String(key === 'all') }, label + ' ' + total);
    button.onclick = () => {
      buttons.forEach((x) => x.setAttribute('aria-pressed', String(x === button)));
      let shown = 0;
      for (const box of boxes) {
        box.hidden = key !== 'all' && box.dataset.kind !== key;
        if (!box.hidden) shown++;
      }
      none.hidden = shown > 0;
    };
    return button;
  });
  tools.append(...buttons);
  // Same header as the e2e report: counts in filter order, colored only when not zero.
  const count = (total, word, tone) => createElement('span', { class: 'lead' + (total && tone ? ' color-' + tone : '') }, total + ' ' + word);
  app.append(createElement('header', {},
    createElement('div', {}, createElement('h1', {}, 'Smoke report · ' + DATA.env, pill(DATA.status)),
      createElement('div', { class: 'summary-line' },
        count(counts.failed, 'failed', 'bad'), count(counts.passed, 'passed'),
        createElement('span', { class: 'meta' }, DATA.flows.length + ' flows · ' + formatDuration(DATA.ms)),
        createElement('time', { class: 'meta', datetime: DATA.startedAt }, isoLocal(DATA.startedAt))),
      DATA.command ? createElement('div', { class: 'summary-line' }, createElement('span', { class: 'meta' }, 'Command: ', createElement('code', {}, DATA.command)), copyButton(DATA.command, 'run command')) : null),
    createElement('div', { class: 'head-row' }, tools)));
  addFontSize();
  addExportPdf();
  app.append(...boxes, none);
}
render();
</script>
