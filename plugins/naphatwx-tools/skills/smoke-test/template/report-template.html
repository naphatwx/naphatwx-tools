<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smoke Report</title>
<style>
  /* theme:tokens:start */
  /* Synced from theme/tokens.css by theme/sync.mjs. Do not edit here. */
  :root {
      color-scheme: dark;

      /* Surfaces, darkest first */
      --bg: #121316;
      --surface: #18191d;
      --surface-2: #1f2025;
      --surface-3: #24262c;
      --line: #26282e;
      --line-strong: #363940;
      --line-3: #4a4d55;

      /* Ink. Running text is --text; text-2 / text-3 are for chrome and meta labels only */
      --text: #e2e3e7;
      --text-2: #c6c8cf;
      --text-3: #a3a6b0;

      /* One accent */
      --accent: #8ab0ff;
      --accent-fill: #1b2232;
      --accent-soft: rgba(138, 176, 255, 0.12);

      /* Status: one hue set, two meanings. ok = add / pass, warn = change / flaky, bad = drop / fail */
      --ok: #8fd694;
      --warn: #f0c26b;
      --bad: #f28b8d;
      --neutral: #a3a6b0;
      --ok-soft: rgba(143, 214, 148, 0.12);
      --warn-soft: rgba(240, 194, 107, 0.12);
      --bad-soft: rgba(242, 139, 141, 0.12);
      --neutral-soft: rgba(163, 166, 176, 0.12);
      --add: var(--ok);
      --change: var(--warn);
      --drop: var(--bad);

      /* Diagrams: connectors and their labels */
      --connector: #6b6e78;

      /* Type. ui-monospace first, or macOS Chromium falls back to Courier */
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Cascadia Code", monospace;

      /* Type scale. Body text is --fs-md on every page; code and pills --fs-sm. Reports use only
         --fs-lg (title), --fs-md and --fs-sm. Nothing renders below --fs-xs. */
      --fs-xs: 0.75rem;
      --fs-sm: 0.875rem;
      --fs-md: 1rem;
      --fs-lg: 1.25rem;
      --fs-xl: 1.5rem;
      --fs-2xl: 2rem;
      /* Headings and lead line: the same steps on every page */
      --fs-lead: var(--fs-lg);
      --fs-h3: var(--fs-lg);
      --fs-h2: var(--fs-xl);
      --fs-h1: var(--fs-2xl);

      /* Page frame: every page centers its content at the same width */
      --page-w: 1200px;
      --gutter: clamp(16px, 3vw, 24px);

      --radius: 6px;
      --radius-lg: 10px;
      --ease: cubic-bezier(0.2, 0, 0, 1);
  }
  /* theme:tokens:end */
  /* theme:base:start */
  /* Synced from theme/base.css by theme/sync.mjs. Do not edit here. */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(138, 176, 255, 0.35); color: #fff; }
  * { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  code, kbd, pre, samp { font-family: var(--mono); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
  }
  /* theme:base:end */

  body { font-size: var(--fs-md); line-height: 1.5; }
  [hidden] { display: none !important; }
  main { max-width: var(--page-w); margin: 0 auto; padding: 16px var(--gutter) 48px; }
  /* Title, one summary line at one size, then the status filter on the left above the rows. */
  header { display: grid; gap: 8px; justify-items: start; margin-bottom: 8px; }
  /* Headings use the shared theme steps (--fs-h1/h2/h3); other text --fs-md, pills and code --fs-sm. */
  h1 { font-size: var(--fs-h1); line-height: 1.25; margin: 0; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; overflow-wrap: anywhere; }
  h2 { font-size: var(--fs-h2); line-height: 1.3; margin: 0; overflow-wrap: anywhere; }
  .meta { color: var(--text-3); font-size: var(--fs-md); }
  .meta code { color: var(--text-2); }
  code { font-size: var(--fs-sm); overflow-wrap: anywhere; }

  .pill { display: inline-flex; gap: 5px; align-items: center; padding: 1px 9px; border-radius: 999px; font-weight: 600; font-size: var(--fs-sm); white-space: nowrap; }
  .tone-ok { color: var(--ok); background: var(--ok-soft); }
  .tone-warn { color: var(--warn); background: var(--warn-soft); }
  .tone-bad { color: var(--bad); background: var(--bad-soft); }
  .tone-neutral { color: var(--neutral); background: var(--neutral-soft); }

  .summary-line { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; font-size: var(--fs-md); }
  .summary-line .lead { font-weight: 600; }
  .summary-line .c-bad { color: var(--bad); }
  .summary-line .meta { font-size: inherit; }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; }
  .tools button { font-size: var(--fs-md); padding: 4px 10px; }
  .tools button[aria-pressed="true"] { background: var(--accent-fill); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .empty-filter { margin-top: 16px; font-size: var(--fs-md); }

  /* Flow boxes use the heading-plus-button disclosure, so the flow name stays a real heading. */
  .flow { border: 1px solid var(--line); border-radius: var(--radius-lg); margin-top: 6px; background: var(--surface); overflow: hidden; scroll-margin-top: 12px; }
  .flow-head { padding: 8px 14px; cursor: pointer; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; transition: background-color .15s var(--ease); }
  .flow-head:hover { background: var(--surface-2); }
  .flow.open { border-color: var(--accent); }
  /* the open row matches the pressed filter button, so it reads as selected */
  .flow.open > .flow-head, .flow.open > .flow-head:hover { background: var(--accent-fill); border-bottom: 1px solid var(--line-strong); }
  .flow.open > .flow-head .mark { color: var(--accent); }
  .flow.open > .flow-head h2 { font-weight: 600; }
  /* row titles at body size: a closed row is one compact line, so more flows fit on a screen */
  .flow-head h2 { flex: 1 1 320px; min-width: 0; font-size: var(--fs-md); }
  .flow-head h2 button { all: unset; display: flex; gap: 6px 12px; align-items: center; flex-wrap: wrap; cursor: pointer; border-radius: var(--radius); }
  .flow-head h2 button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .flow-head .info { display: flex; flex-wrap: wrap; gap: 2px 12px; }
  .flow.open .flow-head .mark::before { content: "\2212"; }

  summary { cursor: pointer; list-style: none; transition: background-color .15s var(--ease); }
  summary::-webkit-details-marker { display: none; }
  summary:hover { background: var(--surface-2); }
  summary:focus-visible { outline-offset: -2px; }
  .mark { font-family: var(--mono); color: var(--text-3); width: 1ch; flex: none; }
  .mark::before { content: "+"; }
  details[open] > summary .mark::before { content: "\2212"; }

  /* Native <details> slide too where the browser can animate to auto height. */
  @supports (interpolate-size: allow-keywords) {
    :root { interpolate-size: allow-keywords; }
    details::details-content { height: 0; overflow: hidden; transition: height .2s var(--ease), content-visibility .2s allow-discrete; }
    details[open]::details-content { height: auto; }
  }

  .chain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px 14px 8px; margin: 0; list-style: none; }
  .node { display: inline-flex; gap: 6px; align-items: center; padding: 2px 10px; border-radius: var(--radius); font-weight: 600; font-size: var(--fs-md); border: 1px solid var(--line-strong); }
  .node.plain { color: var(--text-2); font-weight: 500; border-style: dashed; }
  .arrow { color: var(--connector); }
  .verdict { margin: 0 14px 8px; padding: 6px 12px; color: var(--text); border-radius: var(--radius); overflow-wrap: anywhere; }
  .verdict.bad { background: var(--bad-soft); font-weight: 600; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 0 14px 8px; }
  .cmd { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 0 14px 8px; }
  .cmd code { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 3px 8px; color: var(--text); }

  /* Hops are a numbered table-like list: fixed columns so status, route and time line up row to row.
     The cause lives in the opened row, not the summary, so a closed row stays one line. */
  .hops-label { padding: 0 14px 4px; color: var(--text-3); }
  .hops { list-style: none; margin: 0 14px 12px; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .hops > li + li { border-top: 1px solid var(--line); }
  .hop-row { display: grid; grid-template-columns: 1ch 2ch 8.5em minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 5px 12px; }
  .hop-row .pill { justify-self: start; }
  .hop-row .n { color: var(--text-3); font-variant-numeric: tabular-nums; text-align: right; }
  .hop-row .route { overflow-wrap: anywhere; min-width: 0; }
  .hop-row .via { color: var(--text-3); }
  .hop-row .meta { text-align: right; white-space: nowrap; }
  .hop.skipped .route { color: var(--text-3); }
  .hop.skipped .mark { visibility: hidden; }
  .hop[open] > .hop-row { background: var(--surface-2); }
  .hop-body { padding: 8px 12px 10px calc(1ch + 2ch + 36px); border-top: 1px solid var(--line); display: grid; gap: 8px; min-width: 0; }
  .hop-body .why { color: var(--text); font-weight: 600; overflow-wrap: anywhere; }
  .hop-body .why.bad { color: var(--bad); }
  .polled { margin-top: 4px; color: var(--text-2); overflow-wrap: anywhere; }
  .polled code { color: var(--text); }

  button { font: inherit; font-size: var(--fs-md); border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--text); border-radius: var(--radius); padding: 2px 10px; cursor: pointer; }
  button:hover { background: var(--surface-3); }

  .table-wrap { overflow-x: auto; margin: 8px 0; }
  table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: var(--fs-md); }
  th, td { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--text-3); font-weight: 500; white-space: nowrap; }
  td:first-child code { white-space: nowrap; overflow-wrap: normal; }
  .evidence-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 10px; }
  pre { font-size: var(--fs-sm); background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0 0; max-height: 360px; overflow-y: auto; }
  .full { margin-top: 8px; }
  .full > summary { display: inline-flex; gap: 6px; align-items: center; color: var(--accent); padding: 2px 0; }
  .full > summary:hover { background: none; text-decoration: underline; }
  .full-head { display: flex; justify-content: flex-end; margin-top: 6px; }
  .note { color: var(--warn); margin-top: 4px; }

  @media (max-width: 600px) {
    .chain { flex-direction: column; align-items: flex-start; }
    .arrow { transform: rotate(90deg); }
    .hop-row { grid-template-columns: 1ch 2ch minmax(0, 1fr) auto; row-gap: 4px; }
    .hop-row .pill { grid-column: 3; grid-row: 1; justify-self: start; }
    .hop-row .route { grid-column: 3 / -1; grid-row: 2; }
    .hop-body { padding-left: 12px; }
  }
</style>
</head>
<body>
<main id="app"></main>
<div id="announce" class="sr-only" aria-live="polite"></div>
<script>
const DATA = /*__SMOKE_DATA__*/null;

const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === 'class' ? (n.className = v) : n.setAttribute(k, v);
  for (const k of kids.flat()) if (k != null) n.append(k.nodeType ? k : document.createTextNode(String(k)));
  return n;
};
// Same words as the e2e report. Color always comes with a glyph and the word.
const STATUS = {
  pass: { word: 'passed', glyph: '✓', tone: 'ok' },
  fail: { word: 'failed', glyph: '✕', tone: 'bad' },
  'timed-out': { word: 'timed out', glyph: '✕', tone: 'bad' },
  'not-reached': { word: 'not reached', glyph: '–', tone: 'neutral' },
  skipped: { word: 'skipped', glyph: '–', tone: 'neutral' },
};
const st = (s) => STATUS[s] || { word: String(s), glyph: '–', tone: 'neutral' };
const pill = (s) => el('span', { class: 'pill tone-' + st(s).tone }, el('span', { 'aria-hidden': 'true' }, st(s).glyph), st(s).word);
const ms = (v) => (v == null ? '' : v >= 1000 ? (v / 1000).toFixed(1) + ' s' : v + ' ms');
const slug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const pad = (n) => String(n).padStart(2, '0');
function isoLocal(v) {
  const d = new Date(v);
  if (isNaN(d)) return String(v ?? '');
  const off = -d.getTimezoneOffset();
  const z = (off >= 0 ? '+' : '-') + pad(Math.floor(Math.abs(off) / 60)) + ':' + pad(Math.abs(off) % 60);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) + z;
}

async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const t = el('textarea', {}, text);
    document.body.append(t); t.select();
    try { document.execCommand('copy'); } catch {}
    t.remove();
  }
  const was = btn.textContent;
  btn.textContent = 'Copied';
  // Clear first so a second copy of the same thing is announced again.
  const live = document.getElementById('announce');
  live.textContent = '';
  setTimeout(() => { live.textContent = 'Copied ' + btn.dataset.what; }, 50);
  setTimeout(() => { btn.textContent = was; }, 1200);
}
// `what` names the thing copied, for the aria-label and the "Copied …" announcement.
const copyBtn = (text, what, label = 'Copy') => {
  const b = el('button', { type: 'button', 'aria-label': 'Copy ' + what, 'data-what': what }, label);
  b.onclick = () => copy(text, b);
  return b;
};

const firstBroken = (f) => f.hops.find((h) => h.status !== 'pass' && h.status !== 'not-reached');
const flowId = (f) => 'flow-' + slug(f.flow);
const entryOf = (f) => f.entry || 'entry';

function verdict(f) {
  if (f.error) return { bad: true, text: '✕ Trigger failed: ' + f.error };
  const broken = firstBroken(f);
  const ok = [entryOf(f), ...f.hops.filter((h) => h.status === 'pass').map((h) => h.service)].filter((s, i, a) => s !== a[i - 1]);
  if (!broken) return { bad: false, text: '✓ Every hop answered: ' + ok.join(' → ') + '.' };
  const what = broken.envMismatch?.length ? 'env var mismatch: ' + broken.detail : st(broken.status).word + (broken.detail ? ' (' + broken.detail + ')' : '');
  // The failing link already names its source node, so leave it out of the "OK" prefix.
  const before = broken.from && ok.at(-1) === broken.from ? ok.slice(0, -1) : ok;
  return { bad: true, text: '✕ ' + (before.length ? before.join(' → ') + ' OK; ' : '') + (broken.from ? broken.from + ' → ' : '') + broken.service + ' ' + what + '.' };
}

const pretty = (text) => { try { return JSON.stringify(JSON.parse(text), null, 2); } catch { return text; } };

// Shows only this hop's entry when the runner found one; the full body sits behind a toggle.
function evidence(label, e, what) {
  const box = el('div', {});
  const body = pretty(e.body || '');
  const entry = e.entry ? pretty(e.entry) : '';
  const shown = entry || body;
  box.append(el('div', { class: 'evidence-head' },
    el('span', { class: 'meta' }, label + ': HTTP ' + e.status + ' · ' + ms(e.ms)), el('code', {}, e.url),
    shown ? copyBtn(shown, (entry ? 'hop entry' : 'response body') + ' for ' + what) : null));
  if (entry) {
    box.append(el('div', { class: 'meta' }, 'This hop’s entry, ', el('code', {}, e.entryPath || 'hops[]'), ':'), el('pre', {}, entry));
    if (body) {
      const full = el('details', { class: 'full' }, el('summary', {}, el('span', { class: 'mark', 'aria-hidden': 'true' }), 'Show full response'),
        el('div', { class: 'full-head' }, copyBtn(body, 'full response for ' + what)), el('pre', {}, body));
      if (e.truncated) full.append(el('div', { class: 'note' }, 'Truncated: only the first 2,000 characters were kept.'));
      box.append(full);
    }
  } else {
    if (body) box.append(el('pre', {}, body));
    if (e.truncated) box.append(el('div', { class: 'note' }, 'Truncated: only the first 2,000 characters were kept.'));
  }
  return box;
}

function polled(p) {
  const answer = p.sameStatus ? (p.polls > 1 ? p.lastStatus + ' each time' : p.lastStatus) : 'last answer ' + p.lastStatus;
  return el('div', { class: 'polled' }, 'Polled ', el('code', {}, (p.method || 'GET') + ' ' + p.lastUrl), ' ' + p.polls + '× over ' + ms(p.waitedMs) + ' — HTTP ' + answer +
    (p.lastReason ? ' (' + p.lastReason + ')' : '') + '.');
}

// One numbered row per hop; a closed row is a single line, the cause and evidence open below it.
function hopShell(tag, n, status, from, to, via, time) {
  return el(tag, { class: 'hop-row' }, el('span', { class: 'mark', 'aria-hidden': 'true' }), el('span', { class: 'n' }, n), pill(status),
    el('span', { class: 'route' }, (from ? from + ' → ' : '') + to, via ? el('span', { class: 'via' }, '  via ' + via) : null),
    el('span', { class: 'meta' }, time));
}

function hopRow(f, h, n) {
  const id = flowId(f) + '-hop-' + slug(h.id || h.service);
  if (h.status === 'not-reached') {
    return el('li', { class: 'hop skipped', id }, hopShell('div', n, h.status, h.from, h.service, h.transport, 'not checked'));
  }
  const d = el('details', { class: 'hop', id });
  d.append(hopShell('summary', n, h.status, h.from, h.service, h.transport, ms(h.ms)));
  const body = el('div', { class: 'hop-body' });
  if (h.detail) body.append(el('div', { class: 'why' + (h.status === 'pass' ? '' : ' bad') }, h.detail));
  if (h.polling) body.append(polled(h.polling));
  if (h.instance) body.append(el('div', { class: 'meta' }, 'Instance: ', el('code', {}, h.instance)));
  if (h.env?.length) {
    body.append(el('div', { class: 'table-wrap' }, el('table', {},
      el('thead', {}, el('tr', {}, el('th', { scope: 'col' }, 'Env var'), el('th', { scope: 'col' }, 'Used'), el('th', { scope: 'col' }, 'Check'))),
      el('tbody', {}, h.env.map((e) => el('tr', {}, el('td', {}, el('code', {}, e.name)), el('td', {}, el('code', {}, e.value ?? '')),
        el('td', {}, pill(e.ok ? 'pass' : 'fail'), e.note ? ' ' + e.note : '')))))));
  }
  if (h.evidence) body.append(evidence(h.polling ? 'Last poll' : 'Evidence', h.evidence, h.service + ' in ' + f.flow));
  if (!body.childNodes.length) body.append(el('div', { class: 'meta' }, 'The runner recorded no request for this hop.'));
  d.append(body);
  return el('li', {}, d);
}

// Slides a row's panel open or shut; a click mid-slide reverses from the current height.
const EASE = getComputedStyle(document.documentElement).getPropertyValue('--ease').trim() || 'ease';
const calm = matchMedia('(prefers-reduced-motion: reduce)');
function slide(panel, open, instant) {
  const from = panel.hidden ? 0 : panel.getBoundingClientRect().height;
  panel.getAnimations().forEach((a) => a.cancel());
  panel.style.overflow = '';
  panel.hidden = false;
  const to = open ? panel.getBoundingClientRect().height : 0;
  if (instant || calm.matches || from === to) { panel.hidden = !open; return; }
  const cs = getComputedStyle(panel);
  const at = (h) => h ? { height: h + 'px', paddingTop: cs.paddingTop, paddingBottom: cs.paddingBottom, opacity: 1 }
    : { height: '0px', paddingTop: '0px', paddingBottom: '0px', opacity: 0 };
  panel.style.overflow = 'hidden';
  const a = panel.animate([at(from), at(to)], { duration: 220, easing: EASE, fill: 'forwards' });
  a.onfinish = () => { panel.hidden = !open; panel.style.overflow = ''; a.cancel(); };
}

let closeOpen = null;

function flowBox(f) {
  const failed = f.status !== 'pass';
  const id = flowId(f);
  const box = el('section', { class: 'flow', id, 'aria-labelledby': id + '-name' });
  const panel = el('div', { id: id + '-panel' });
  box.dataset.kind = failed ? 'failed' : 'passed';
  const toggle = el('button', { type: 'button', 'aria-controls': id + '-panel' },
    el('span', { class: 'mark', 'aria-hidden': 'true' }), pill(f.status), el('span', { id: id + '-name' }, f.flow));
  const head = el('div', { class: 'flow-head' }, el('h2', {}, toggle),
    el('div', { class: 'info' }, f.description ? el('span', { class: 'meta' }, f.description) : null, el('span', { class: 'meta' }, ms(f.ms))));
  // Same disclosure as the e2e report: the whole row is a mouse target, the heading's button serves keyboards.
  head.onclick = (e) => { if (!e.target.closest('button')) toggle.click(); };
  const set = (open, instant) => { box.classList.toggle('open', open); toggle.setAttribute('aria-expanded', String(open)); slide(panel, open, instant); };
  toggle.onclick = () => {
    const open = !box.classList.contains('open');
    // Only one flow open at a time; the other shuts at once so this row can be scrolled back into view.
    const other = open && closeOpen && closeOpen !== close;
    if (other) closeOpen(true);
    closeOpen = open ? close : null;
    set(open);
    if (other) head.scrollIntoView({ block: 'nearest' });
  };
  const close = (instant) => set(false, instant);
  set(false, true);
  box.append(head, panel);

  const chain = el('div', { class: 'chain', role: 'list', 'aria-label': 'Hop chain' });
  const node = (name, s) => el('span', { class: 'node tone-' + st(s).tone, role: 'listitem' },
    el('span', { 'aria-hidden': 'true' }, st(s).glyph), name, el('span', { class: 'sr-only' }, ' ' + st(s).word));
  const arrow = () => el('span', { class: 'arrow', 'aria-hidden': 'true' }, '→');
  chain.append(el('span', { class: 'node plain', role: 'listitem' }, 'trigger'), arrow(), node(entryOf(f), f.error ? 'fail' : 'pass'));
  let prev = entryOf(f);
  for (const h of f.hops) {
    // A hop that starts somewhere other than the previous node gets its own source node, so the chain stays truthful.
    if (h.from && h.from !== prev && h.from !== 'runner') chain.append(arrow(), el('span', { class: 'node plain', role: 'listitem' }, h.from));
    chain.append(arrow(), node(h.service, h.status));
    prev = h.service;
  }
  const v = verdict(f);
  panel.append(chain, el('div', { class: 'verdict' + (v.bad ? ' bad' : '') }, v.text));

  const facts = el('div', { class: 'facts' });
  if (f.probeId) facts.append(el('span', { class: 'meta' }, 'Probe ID: ', el('code', {}, f.probeId)));
  if (f.startedAt) facts.append(el('span', { class: 'meta' }, 'Started ' + isoLocal(f.startedAt)));
  if (facts.childNodes.length) panel.append(facts);
  if (failed && f.rerun) panel.append(el('div', { class: 'cmd' }, el('span', { class: 'meta' }, 'Rerun this flow:'), el('code', {}, f.rerun), copyBtn(f.rerun, 'rerun command for ' + f.flow)));

  const list = el('ol', { class: 'hops', 'aria-label': 'Hops of ' + f.flow });
  if (f.trigger) {
    const t = el('details', { class: 'hop', id: id + '-trigger' });
    t.append(hopShell('summary', '0', f.error ? 'fail' : 'pass', 'trigger', entryOf(f), '', ms(f.trigger.ms)),
      el('div', { class: 'hop-body' }, f.error ? el('div', { class: 'why bad' }, f.error) : null, evidence('Trigger', f.trigger, 'trigger of ' + f.flow)));
    list.append(el('li', {}, t));
  }
  f.hops.forEach((h, i) => list.append(hopRow(f, h, String(i + 1))));
  panel.append(el('div', { class: 'hops-label' }, 'Hops'), list);
  return box;
}

function render() {
  const app = document.getElementById('app');
  if (!DATA) { app.append(el('p', {}, 'No data in this report.')); return; }
  const n = { failed: 0, passed: 0 };
  for (const f of DATA.flows) n[f.status === 'pass' ? 'passed' : 'failed']++;
  // Failed flows first; the rest keep the runner's order.
  const flows = DATA.flows.map((f, i) => [f, i]).sort((a, b) => (a[0].status === 'pass') - (b[0].status === 'pass') || a[1] - b[1]).map((x) => x[0]);
  const boxes = flows.map(flowBox);
  const none = el('p', { class: 'meta empty-filter', hidden: '' }, 'No flows match this filter.');
  const tools = el('div', { class: 'tools', role: 'group', 'aria-label': 'Show flows' });
  const FILTERS = [['all', 'All', DATA.flows.length], ['failed', 'Failed', n.failed], ['passed', 'Passed', n.passed]];
  const buttons = FILTERS.map(([key, label, c]) => {
    const b = el('button', { type: 'button', 'aria-pressed': String(key === 'all') }, label + ' ' + c);
    b.onclick = () => {
      buttons.forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      let shown = 0;
      for (const box of boxes) {
        box.hidden = key !== 'all' && box.dataset.kind !== key;
        if (!box.hidden) shown++;
      }
      none.hidden = shown > 0;
    };
    return b;
  });
  tools.append(...buttons);
  // Same header as the e2e report: counts in filter order, colored only when not zero.
  const count = (c, word, tone) => el('span', { class: 'lead' + (c && tone ? ' c-' + tone : '') }, c + ' ' + word);
  app.append(el('header', {},
    el('div', {}, el('h1', {}, 'Smoke report · ' + DATA.env, pill(DATA.status)),
      el('div', { class: 'summary-line' },
        count(n.failed, 'failed', 'bad'), count(n.passed, 'passed'),
        el('span', { class: 'meta' }, DATA.flows.length + ' flows · ' + ms(DATA.ms)),
        el('time', { class: 'meta', datetime: DATA.startedAt }, isoLocal(DATA.startedAt))),
      DATA.command ? el('div', { class: 'summary-line' }, el('span', { class: 'meta' }, 'Command: ', el('code', {}, DATA.command)), copyBtn(DATA.command, 'run command')) : null),
    tools));
  app.append(...boxes, none);
}
render();
</script>
</body>
</html>
