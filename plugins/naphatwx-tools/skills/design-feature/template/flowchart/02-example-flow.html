<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example flow</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    ::selection { background: rgba(138, 176, 255, 0.35); color: #fff; }
    :root {
      --color-paper:   #18191d;
      --color-ink:     #ececef;
      --color-muted:   #b9bbc2;
      --font-sans:     -apple-system, "Segoe UI", system-ui, sans-serif;
      --font-serif:    -apple-system, "Segoe UI", system-ui, sans-serif;
      --font-mono:     ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; margin: 0 auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flow 02 · Flowchart · diagram-design</p>
    <h1>Example flow</h1>

        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8ab0ff"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#18191d"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <line x1="500" y1="224" x2="500" y2="272" stroke="#b9bbc2" stroke-width="1.2" marker-end="url(#arrow)"/>

      <path d="M 180 304 L 180 256 Q 180 248 188 248 L 496 248" fill="none" stroke="#b9bbc2" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="384" x2="500" y2="424" stroke="#8ab0ff" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="500" y1="472" x2="500" y2="512" stroke="#b9bbc2" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Arrow labels: masked, 6px+ clear of their stroke -->

      <text x="668" y="157" fill="#b9bbc2" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>

      <text x="528" y="245" fill="#b9bbc2" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>
      <rect x="316" y="308" width="24" height="12" rx="2" fill="#18191d"/>
      <text x="328" y="317" fill="#b9bbc2" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>
      <rect x="318" y="228" width="44" height="12" rx="2" fill="#18191d"/>
      <text x="340" y="237" fill="#b9bbc2" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">RETRY</text>
      <rect x="512" y="396" width="32" height="12" rx="2" fill="#18191d"/>
      <text x="528" y="405" fill="#8ab0ff" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>
      <!-- Nodes -->

      <text x="500" y="62" fill="#ececef" font-size="12" font-weight="600" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" text-anchor="middle">Open the form</text>
      <text x="500" y="78" fill="#b9bbc2" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">/things/:id</text>
      <polygon points="500,112 620,168 500,224 380,168" fill="#1f2025" stroke="#ececef" stroke-width="1"/>
      <text x="500" y="166" fill="#ececef" font-size="12" font-weight="600" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" text-anchor="middle">Can edit?</text>
      <text x="500" y="182" fill="#b9bbc2" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">thing.edit</text>
      <rect x="720" y="144" width="200" height="48" rx="24" fill="#18191d"/>
      <rect x="720" y="144" width="200" height="48" rx="24" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <text x="820" y="166" fill="#ececef" font-size="12" font-weight="600" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" text-anchor="middle">No Edit button</text>
      <text x="820" y="182" fill="#b9bbc2" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">read-only view</text>
      <polygon points="500,272 620,328 500,384 380,328" fill="#1f2025" stroke="#ececef" stroke-width="1"/>
      <text x="500" y="326" fill="#ececef" font-size="12" font-weight="600" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" text-anchor="middle">Name valid?</text>
      <text x="500" y="342" fill="#b9bbc2" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">name max 64 chars</text>
      <rect x="80" y="304" width="200" height="48" rx="6" fill="#18191d"/>

      <rect x="400" y="424" width="200" height="48" rx="6" fill="rgba(138,176,255,0.08)" stroke="#8ab0ff" stroke-width="1"/>
      <text x="500" y="446" fill="#ececef" font-size="12" font-weight="600" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" text-anchor="middle">Save record</text>
      <text x="500" y="462" fill="#b9bbc2" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">CreateThing</text>
      <rect x="400" y="512" width="200" height="48" rx="24" fill="#18191d"/>
      <rect x="400" y="512" width="200" height="48" rx="24" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <text x="500" y="534" fill="#ececef" font-size="12" font-weight="600" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" text-anchor="middle">Saved</text>
      <text x="500" y="550" fill="#b9bbc2" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">status = ACTIVE</text>
      <line x1="40" y1="588" x2="960" y2="588" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <text x="40" y="604" fill="#b9bbc2" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="40" y="620" width="24" height="12" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <text x="76" y="630" fill="#b9bbc2" font-size="8.5" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif">Start / end</text>
      <rect x="220" y="620" width="24" height="12" rx="2" fill="#1f2025" stroke="#ececef" stroke-width="1"/>
      <text x="256" y="630" fill="#b9bbc2" font-size="8.5" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif">Step</text>
      <polygon points="400,626 412,620 424,626 412,632" fill="#1f2025" stroke="#ececef" stroke-width="1"/>
      <text x="436" y="630" fill="#b9bbc2" font-size="8.5" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif">Decision</text>
      <line x1="580" y1="626" x2="604" y2="626" stroke="#8ab0ff" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="616" y="630" fill="#b9bbc2" font-size="8.5" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif">Happy path</text>
      <line x1="760" y1="626" x2="784" y2="626" stroke="#b9bbc2" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="796" y="630" fill="#b9bbc2" font-size="8.5" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif">Branch</text>

    </svg>
  </div>
  <script>
    // Report the real height to the host page so its iframe fits (postMessage works on file://).
    // body, not documentElement: documentElement.scrollHeight never drops below the iframe's current height.
    // Fractional rect height, not scrollHeight (rounds down): a 0.1px overflow shows a scrollbar strip.
    // Thin scrollbars that match the dark paper; the default white track shows whenever the SVG overflows.
    const style = document.createElement("style");
    style.textContent = `* { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.18) transparent; }
      ::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 8px; }`;
    document.head.append(style);
    if (parent !== window) {
      // Embedded: the host sizes the height; slimmer padding and a 720px floor fit an 880px column without a scrollbar.
      document.documentElement.style.overflowY = "hidden";
      document.body.style.padding = "1rem";
      document.querySelectorAll("svg").forEach(svg => { svg.style.minWidth = "min(720px, 100%)"; });
    }
    const postHeight = () => parent.postMessage({ type: "diagram-height", height: document.body.getBoundingClientRect().height }, "*");
    addEventListener("load", postHeight);
    new ResizeObserver(postHeight).observe(document.body);
  </script>

</body>
</html>
