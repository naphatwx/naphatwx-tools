<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example flow</title>
  <style>
    /* theme:tokens:start */
    /* Synced from theme/tokens.css by theme/sync.mjs. Do not edit here. */
    :root {
        color-scheme: dark;

        /* Surfaces, darkest first */
        --bg: #121316;
        --surface: #18191d;
        --surface-2: #1f2025;
        --surface-3: #24262c;
        --line: #26282e;
        --line-strong: #363940;
        --line-3: #4a4d55;

        /* Ink. Running text is --text; text-2 / text-3 are for chrome and meta labels only */
        --text: #e2e3e7;
        --text-2: #c6c8cf;
        --text-3: #a3a6b0;

        /* One accent */
        --accent: #8ab0ff;
        --accent-fill: #1b2232;
        --accent-soft: rgba(138, 176, 255, 0.12);

        /* Status: one hue set, two meanings. ok = add / pass, warn = change / flaky, bad = drop / fail */
        --ok: #8fd694;
        --warn: #f0c26b;
        --bad: #f28b8d;
        --neutral: #a3a6b0;
        --ok-soft: rgba(143, 214, 148, 0.12);
        --warn-soft: rgba(240, 194, 107, 0.12);
        --bad-soft: rgba(242, 139, 141, 0.12);
        --neutral-soft: rgba(163, 166, 176, 0.12);
        --add: var(--ok);
        --change: var(--warn);
        --drop: var(--bad);

        /* Diagrams: connectors and their labels */
        --connector: #6b6e78;

        /* Type. ui-monospace first, or macOS Chromium falls back to Courier */
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Cascadia Code", monospace;

        --radius: 6px;
        --radius-lg: 10px;
        --ease: cubic-bezier(0.2, 0, 0, 1);
    }
    /* theme:tokens:end */
    /* theme:base:start */
    /* Synced from theme/base.css by theme/sync.mjs. Do not edit here. */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
    }
    ::selection { background: rgba(138, 176, 255, 0.35); color: #fff; }
    * { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
    a { color: var(--accent); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    code, kbd, pre, samp { font-family: var(--mono); }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
    }
    /* theme:base:end */

    * { margin: 0; padding: 0; }
    body { background: var(--surface); padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; margin: 0 auto; }
    .eyebrow { font-size: 0.8125rem; color: var(--text-3); margin-bottom: 0.5rem; }
    h1 { font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 600; letter-spacing: -0.015em; line-height: 1.15; margin-bottom: 1.5rem; }
    /* Scales up to 1.5x on wide screens; never below 1:1, so a narrow window scrolls the diagram, not the page. */
    .diagram { overflow-x: auto; }
    .diagram svg { display: block; width: 100%; height: auto; margin: 0 auto; font-family: var(--sans); }
    @media (max-width: 640px) { body { padding: 1.5rem 1rem; } }
    .diagram svg { min-width: 760px; max-width: 1140px; }
    .conn { fill: none; stroke: var(--connector); stroke-width: 1.6; }
    .ah { fill: var(--connector); }
    .exit { fill: var(--text-3); font-size: 13px; text-anchor: middle; }
    .node text { fill: var(--text); font-size: 14px; font-weight: 600; text-anchor: middle; }
    .node .detail { fill: var(--text-2); font-family: var(--mono); font-size: 12px; font-weight: 400; }
    .pill { fill: var(--bg); stroke: var(--line-3); stroke-width: 1.4; }
    .box { fill: var(--surface-3); stroke: var(--line-strong); stroke-width: 1.2; }
    .decision { fill: var(--accent-fill); stroke: var(--accent); stroke-width: 1.4; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flow 02 · Flowchart</p>
    <h1>Example flow</h1>

    <div class="diagram">
      <svg viewBox="0 0 760 490" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="example-flow-chart-title example-flow-chart-desc">
        <title id="example-flow-chart-title">Example flow: flowchart, 7 nodes</title>
        <desc id="example-flow-chart-desc">Open the form, check the thing.edit permission, validate the name, save it with CreateThing as ACTIVE, or show INVALID_ARGUMENT and retry.</desc>
        <defs>
          <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
        </defs>
        <!-- Connectors first, behind nodes. The retry loop enters "Name valid?" on its own edge, not on the Yes connector. -->
        <g class="conn" marker-end="url(#ah)">
          <path d="M380,70 V103"/>
          <path d="M490,165 H578"/>
          <path d="M380,225 V263"/>
          <path d="M490,325 H578"/>
          <path d="M270,325 H202"/>
          <path d="M660,355 V418"/>
          <path d="M120,293 V258 H325 V293"/>
        </g>
        <text class="exit" x="534" y="157">No</text>
        <text class="exit" x="398" y="250">Yes</text>
        <text class="exit" x="534" y="317">Yes</text>
        <text class="exit" x="236" y="317">No</text>
        <text class="exit" x="222" y="250">Retry</text>
        <g class="node"><rect class="pill" x="300" y="20" width="160" height="50" rx="25"/><text x="380" y="41">Open the form</text><text class="detail" x="380" y="59">/things/:id</text></g>
        <g class="node"><polygon class="decision" points="380,105 490,165 380,225 270,165"/><text x="380" y="160">Can edit?</text><text class="detail" x="380" y="180">thing.edit</text></g>
        <g class="node"><rect class="pill" x="580" y="140" width="160" height="50" rx="25"/><text x="660" y="161">No Edit button</text><text class="detail" x="660" y="179">read-only view</text></g>
        <g class="node"><polygon class="decision" points="380,265 490,325 380,385 270,325"/><text x="380" y="320">Name valid?</text><text class="detail" x="380" y="340">name max 64 chars</text></g>
        <g class="node"><rect class="box" x="40" y="295" width="160" height="60" rx="8"/><text x="120" y="320">Show error</text><text class="detail" x="120" y="340">INVALID_ARGUMENT</text></g>
        <g class="node"><rect class="box" x="580" y="295" width="160" height="60" rx="8"/><text x="660" y="320">Save record</text><text class="detail" x="660" y="340">CreateThing</text></g>
        <g class="node"><rect class="pill" x="580" y="420" width="160" height="50" rx="25"/><text x="660" y="441">Saved</text><text class="detail" x="660" y="459">status = ACTIVE</text></g>
      </svg>
    </div>
  </div>
  <script>
    // Report the real height to the host page so its iframe fits (postMessage works on file://).
    // body, not documentElement: its scrollHeight never drops below the iframe's height; the
    // fractional rect height avoids a 0.1px overflow showing a scrollbar strip.
    const style = document.createElement("style");
    style.textContent = `* { scrollbar-width: thin; scrollbar-color: #363940 transparent; }`;
    document.head.append(style);
    // Never draw a diagram below its viewBox width, so 12px labels stay 12px; a narrow frame scrolls it sideways.
    document.querySelectorAll("svg[viewBox]:not(svg svg)").forEach(svg => {
      svg.style.minWidth = svg.viewBox.baseVal.width + "px";
      if (getComputedStyle(svg.parentElement).overflowX === "auto") return;
      const box = document.createElement("div");
      box.style.overflowX = "auto";
      svg.before(box);
      box.append(svg);
    });
    if (parent !== window) {
      // Embedded: the host sizes the height.
      document.documentElement.style.overflowY = "hidden";
      document.body.style.padding = "1rem";
    }
    const postHeight = () => parent.postMessage({ type: "diagram-height", height: document.body.getBoundingClientRect().height }, "*");
    addEventListener("load", postHeight);
    new ResizeObserver(postHeight).observe(document.body);
  </script>
</body>
</html>
