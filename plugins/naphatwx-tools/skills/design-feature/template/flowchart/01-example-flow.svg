<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 376" width="760" height="376" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="14">
    <title id="t">Example flowchart</title>
    <desc id="d">Open the form, check the thing.edit permission, validate the name, save it with CreateThing or show INVALID_ARGUMENT and retry.</desc>
    <!-- Shapes: terminal = outlined pill · process = filled box · decision = accent diamond. Grey connectors, sentence-case Yes/No labels; a loop back enters its target at its own point.
         Each node: a plain-words line, then a mono line with the real value from the source (permission, RPC, field rule, code, status).
         All text is 14px and hosts draw the file at 1:1, so size each shape to about 8.5px per mono character. -->
    <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#6b6e78" />
        </marker>
    </defs>
    <g fill="none" stroke="#6b6e78" stroke-width="1.6" marker-end="url(#ah)">
        <path d="M380,56 V84" />
        <path d="M500,134 H578" />
        <path d="M380,182 V214" />
        <path d="M500,264 H578" />
        <path d="M260,264 H202" />
        <path d="M660,290 V316" />
        <path d="M120,236 V200 H325 V234" />
    </g>
    <g fill="#a3a6b0" text-anchor="middle">
        <text x="539" y="126">No</text>
        <text x="398" y="203">Yes</text>
        <text x="539" y="256">Yes</text>
        <text x="231" y="256">No</text>
        <text x="222" y="192">Retry</text>
    </g>
    <g fill="#e2e3e7" text-anchor="middle" font-weight="600">
        <rect x="300" y="12" width="160" height="44" rx="22" fill="#121316" stroke="#4a4d55" stroke-width="1.4" />
        <text x="380" y="30">Open the form</text>
        <polygon points="380,86 500,134 380,182 260,134" fill="#1b2232" stroke="#8ab0ff" stroke-width="1.4" />
        <text x="380" y="129">Can edit?</text>
        <rect x="580" y="112" width="160" height="44" rx="22" fill="#121316" stroke="#4a4d55" stroke-width="1.4" />
        <text x="660" y="130">No Edit button</text>
        <polygon points="380,216 500,264 380,312 260,264" fill="#1b2232" stroke="#8ab0ff" stroke-width="1.4" />
        <text x="380" y="259">Name valid?</text>
        <rect x="40" y="238" width="160" height="52" fill="#24262c" stroke="#363940" stroke-width="1.2" rx="8" />
        <text x="120" y="259">Show error</text>
        <rect x="580" y="238" width="160" height="52" fill="#24262c" stroke="#363940" stroke-width="1.2" rx="8" />
        <text x="660" y="259">Save record</text>
        <rect x="580" y="318" width="160" height="44" rx="22" fill="#121316" stroke="#4a4d55" stroke-width="1.4" />
        <text x="660" y="336">Saved</text>
    </g>
    <g fill="#c6c8cf" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">
        <text x="380" y="48">/things/:id</text>
        <text x="380" y="149">thing.edit</text>
        <text x="660" y="148">read-only view</text>
        <text x="380" y="279">name max 64 chars</text>
        <text x="120" y="279">INVALID_ARGUMENT</text>
        <text x="660" y="279">CreateThing</text>
        <text x="660" y="354">status = ACTIVE</text>
    </g>
</svg>
