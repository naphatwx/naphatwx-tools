<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API contracts · Feature Name</title>
    <style>
        /* theme:tokens:start */
        /* Synced from theme/tokens.css by theme/sync.mjs. Do not edit here. */
        :root {
            color-scheme: dark;

            /* Surfaces, darkest first */
            --bg: #121316;
            --surface: #18191d;
            --surface-2: #1f2025;
            --surface-3: #24262c;
            --line: #26282e;
            --line-strong: #363940;
            --line-3: #4a4d55;
            /* Hover fill for every control: a clear step up from any surface. Hover never changes the border */
            --hover: #33353b;

            /* Ink. Running text is --text; text-2 / text-3 are for chrome and meta labels only */
            --text: #e2e3e7;
            --text-2: #c6c8cf;
            --text-3: #a3a6b0;

            /* One accent */
            --accent: #8ab0ff;
            --accent-fill: #1b2232;
            --accent-soft: rgba(138, 176, 255, 0.12);

            /* Status: one hue set, two meanings. ok = add / pass, warn = change / flaky, bad = drop / fail */
            --ok: #8fd694;
            --warn: #f0c26b;
            --bad: #f28b8d;
            --neutral: #a3a6b0;
            --ok-soft: rgba(143, 214, 148, 0.12);
            --warn-soft: rgba(240, 194, 107, 0.12);
            --bad-soft: rgba(242, 139, 141, 0.12);
            --neutral-soft: rgba(163, 166, 176, 0.12);
            --add: var(--ok);
            --change: var(--warn);
            --drop: var(--bad);

            /* Diagrams: connectors and their labels */
            --connector: #6b6e78;

            /* Type. ui-monospace first, or macOS Chromium falls back to Courier */
            --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Cascadia Code", monospace;

            /* Type scale. Nothing renders below --fs-xs. Pages set font sizes by role (below), not by step. */
            --fs-xs: 0.75rem;
            --fs-sm: 0.875rem;
            --fs-md: 1rem;
            --fs-lg: 1.25rem;
            --fs-xl: 1.5rem;
            --fs-2xl: 2rem;
            /* Headings and lead line: the same steps on every page */
            --fs-lead: var(--fs-lg);
            --fs-h3: var(--fs-lg);
            --fs-h2: var(--fs-xl);
            --fs-h1: var(--fs-2xl);
            /* Roles: one step down per role, so the eye lands on body text first.
               body = running text, tables, buttons, action bars · meta = hints, asides, legends, captions, code · tag = pills, kbd, counts */
            --fs-body: var(--fs-md);
            --fs-meta: var(--fs-sm);
            --fs-code: var(--fs-sm);
            --fs-tag: var(--fs-xs);
            /* Diagrams draw at 1:1 with shapes sized for 14px: main labels 14, secondary lines (detail, sub, note, type) 12 */
            --fs-dia: var(--fs-sm);
            --fs-dia-sub: var(--fs-xs);

            /* Max widths: Tailwind max-w steps (md 448px, 3xl 768px, 4xl 896px, 5xl 1024px, 6xl 1152px, 7xl 1280px). Use these, not raw px */
            --max-w-md: 28rem;
            --max-w-3xl: 48rem;
            --max-w-4xl: 56rem;
            --max-w-5xl: 64rem;
            --max-w-6xl: 72rem;
            --max-w-7xl: 80rem;

            /* Page frame: every page centers its content at the same width, 80% of the window up to --max-w-3xl */
            --page-w: min(80%, var(--max-w-3xl));
            --gutter: clamp(16px, 3vw, 24px);

            --radius: 6px;
            --radius-lg: 10px;
            --ease: cubic-bezier(0.2, 0, 0, 1);
        }
        /* theme:tokens:end */
        /* theme:base:start */
        /* Synced from theme/base.css by theme/sync.mjs. Do not edit here. */
        *, *::before, *::after { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            -webkit-font-smoothing: antialiased;
        }
        ::selection { background: rgba(138, 176, 255, 0.35); color: #fff; }
        * { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
        a { color: var(--accent); }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        code, kbd, pre, samp { font-family: var(--mono); }
        /* Label over a group (list, field, table column, step list): body size, brighter and bolder than meta text */
        .label, th, dt { color: var(--text-2); font-weight: 600; }
        /* Table column headers: uppercase at meta size, a little tracking so caps stay readable */
        th { font-size: var(--fs-meta); text-transform: uppercase; letter-spacing: 0.04em; }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
        }
        /* theme:base:end */
        /* theme:pdf:start */
        /* Synced from theme/pdf.css by theme/sync.mjs. Do not edit here. */
        /* .float-bar: one long box at the bottom right; Export PDF goes last, page tools can sit before it */
        .float-bar { position: fixed; right: 20px; bottom: 20px; z-index: 50; display: flex; gap: 2px; padding: 4px; background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 12px; }
        .float-bar button { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border: 0; border-radius: 8px; background: none; color: var(--text-2); font: 500 var(--fs-body) var(--sans); white-space: nowrap; cursor: pointer; }
        .float-bar button:hover { background: var(--hover); color: var(--text); }
        /* Room under the last line so the bar never hides it: bar 42px + its 20px offset + a 14px gap.
           An embedded diagram posts its body height with this padding, so the host frame keeps the room too. */
        body:has(.float-bar) { --float-space: 76px; padding-bottom: var(--float-space); }
        @page { margin: 0; }
        @media print {
            html, body { background: var(--bg); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .no-print { display: none !important; }
            body:has(.float-bar) { --float-space: 0px; padding-bottom: 0; }
            pre, figure, img, svg, tr { break-inside: avoid; }
            h1, h2, h3 { break-after: avoid; }
        }
        /* theme:pdf:end */

        * { margin: 0; padding: 0; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 8px; }

        body { padding: 20px 0 32px; }
        /* one column for header and boards, at most 96% of the screen and max-w-5xl */
        .page { max-width: min(96vw, var(--max-w-5xl)); margin: 0 auto; }

        header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        h1 { font-size: var(--fs-h1); font-weight: 600; letter-spacing: -0.015em; }
        .sub { color: var(--text-3); font-size: var(--fs-meta); margin-top: 2px; }
        .actions { display: flex; gap: 8px; }

        .btn {
            font: inherit;
            font-size: var(--fs-body);
            color: var(--text-2);
            background: var(--surface-2);
            border: 1px solid var(--line-strong);
            border-radius: 8px;
            padding: 6px 12px;
            cursor: pointer;
            text-decoration: none;
        }

        .btn:hover { color: var(--text); background: var(--hover); }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            margin-bottom: 24px;
            font-size: var(--fs-sm);
            color: var(--text-3);
        }

        .legend i { display: inline-block; width: 22px; height: 12px; margin-right: 6px; vertical-align: middle; border: 1.5px solid var(--line-3); border-radius: 3px; }
        .legend .write { border-color: var(--accent); }
        .legend .external { border-style: dashed; }
        .legend .add { color: var(--add); }
        .legend .change { color: var(--change); }
        .legend .drop { color: var(--drop); }

        /* one block per method: numbered title, route line, then its board */
        .method { margin-bottom: 32px; }
        .method h2 { display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px; font-size: var(--fs-h2); font-weight: 600; }
        .method h2 .n { color: var(--text-3); font-family: var(--mono); font-size: var(--fs-h3); }
        .method h2 code { font-size: inherit; }
        .method h2 .tag { color: var(--text-3); font-size: var(--fs-tag); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; border: 1px solid var(--line-strong); border-radius: 999px; padding: 2px 8px; }
        .method h2 .tag.write { color: var(--accent); border-color: var(--accent); }
        .method .sub { margin: 4px 0 10px; }

        /* a board: request and response cards side by side, each half the width; a long name or type wraps */
        .board {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px 24px;
            padding: 16px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--surface);
        }
        .c-label { color: var(--text-3); font-size: var(--fs-tag); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }

        .card { border: 1.5px solid var(--line-3); border-radius: 8px; background: var(--surface-2); overflow: hidden; }
        .card.write { border-color: var(--accent); }
        .card.drop { border-color: var(--drop); }
        .card.external { border-style: dashed; }
        .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 7px 12px; background: var(--surface-3); }
        .card-head .name { font: 600 var(--fs-dia) var(--mono); overflow-wrap: anywhere; }
        .card-head .tag { color: var(--text-3); font-size: var(--fs-dia-sub); font-weight: 600; white-space: nowrap; }
        .card.write .card-head .tag { color: var(--accent); }
        .card.drop .card-head .tag { color: var(--drop); }

        /* field rows: name | number | type. Rows share the card's columns (subgrid), so numbers and types line up */
        .rows { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, max-content); column-gap: 16px; }
        .row { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; align-items: baseline; padding: 4px 12px; border-top: 1px solid var(--line); }
        .row:nth-child(odd) { background: var(--neutral-soft); }
        .row .f { font: var(--fs-dia) var(--mono); overflow-wrap: anywhere; }
        .row .k { color: var(--text-3); font-size: var(--fs-dia-sub); font-weight: 700; }
        .row .t { color: var(--text-3); font-size: var(--fs-dia-sub); text-align: right; overflow-wrap: anywhere; }
        .row.add .f, .row.add .k { color: var(--add); }
        .row.change .f, .row.change .k { color: var(--change); }
        .row.drop .f, .row.drop .t { color: var(--drop); text-decoration: line-through; }
        .row.drop .k { color: var(--drop); }
        .none { padding: 7px 12px; color: var(--text-3); font-size: var(--fs-dia-sub); font-style: italic; }

        /* phones: one card per line */
        @media (max-width: 760px) {
            .board { grid-template-columns: minmax(0, 1fr); }
        }

        @media print {
            .actions { display: none; }
            .card { break-inside: avoid; }
        }
    </style>
</head>

<body>
    <div class="page">
    <header>
        <div>
            <h1>API contracts · Feature Name</h1>
            <p class="sub">Every API the feature adds, changes or calls, with its full request and response.</p>
        </div>
        <div class="actions">
            <a class="btn" href="../overview.html#api">← Overview</a>
        </div>
    </header>

    <div class="legend">
        <span><i class="write"></i>new message or type</span>
        <span><i></i>existing message</span>
        <span><i class="external"></i>external (another service owns it)</span>
        <span><b class="add">+ add</b> · <b class="change">~ change</b> · <b class="drop">− drop</b></span>
    </div>

    <main id="board"></main>
    </div>

    <script>
        /* theme:pdf-js:start */
        /* Synced from theme/pdf.js by theme/sync.mjs. Do not edit here. */
        function addExportPdf(target, prepare) {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'export-pdf no-print';
            if (!target) {
                target = document.querySelector('.float-bar');
                if (!target) { target = document.createElement('div'); target.className = 'float-bar no-print'; document.body.append(target); }
            }
            b.title = 'Export PDF (pick "Save as PDF" in the print dialog)';
            b.textContent = 'Export PDF';
            b.addEventListener('click', async () => {
                if (prepare) await prepare();
                window.print();
            });
            target.append(b);
            return b;
        }
        /* theme:pdf-js:end */
        addExportPdf();

        // Renders one numbered block per method: its title, route and permission, then a board with its request and response cards.
        // fields: [name, type, number, mark?] · mark: add | change | drop. Shared types get one last block.
        // tag: "new" / "changed" / "behaviour" / "called, unchanged" on an API; "new message" / "altered" / "removed message" / "unchanged" on a message.
        const API = {
            apis: [
                { id: "create-thing", name: "CreateThing", tag: "new", route: "POST /api/v1/things", perm: "things.create",
                    req: { name: "CreateThingRequest", tag: "new message", fields: [
                        ["name", "string", "1"], ["ownerId", "int32", "2"], ["note", "optional string", "3"],
                    ] },
                    res: { name: "ThingResponse", tag: "altered", fields: [
                        ["id", "int64", "1"], ["name", "string", "2"], ["legacyFlag", "bool", "− 4", "drop"],
                        ["count", "int32 → int64", "~ 9", "change"], ["source", "RepositorySource", "+ 17", "add"],
                    ] } },
                { id: "get-things", name: "GetThings", tag: "behaviour", route: "GET /api/v1/things", perm: "things.read",
                    req: { name: "GetThingsRequest", tag: "unchanged", fields: [
                        ["source", "optional RepositorySource", "1"], ["page", "int32", "2"],
                    ] },
                    res: { name: "GetThingsResponse", tag: "unchanged", fields: [
                        ["items", "repeated ThingResponse", "1"], ["total", "int64", "2"],
                    ] } },
                { id: "get-owner", name: "GetOwner", tag: "called, unchanged", ext: true, route: "GET /api/v1/owners/{id}", perm: "none · system caller",
                    req: { name: "GetOwnerRequest", tag: "unchanged", fields: [["id", "int32", "1"]] },
                    res: { name: "Owner", tag: "unchanged", fields: [["id", "int32", "1"], ["displayName", "string", "2"]] } },
            ],
            types: [
                { name: "RepositorySource", tag: "new enum", fields: [
                    ["REPOSITORY_SOURCE_UNSPECIFIED", "", "0"], ["GITLAB", "", "1"],
                ] },
            ],
        };


        (function render({ apis, types }) {
            const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
            const kind = c => /^new/.test(c.tag) ? "write" : /removed/.test(c.tag) ? "drop" : "";

            // A card: label above, head with name and tag, then one row per field. No message → one muted line.
            const card = (c, label, ext) => {
                if (!c) return `<div><div class="c-label">${esc(label)}</div><div class="card"><div class="none">no message</div></div></div>`;
                const cls = ["card", kind(c), ext ? "external" : ""].filter(Boolean).join(" ");
                const rows = c.fields.map(([name, type, num, mark]) => `<div class="row${mark ? " " + mark : ""}">`
                    + `<span class="f">${esc(name)}</span><span class="k">${esc(num)}</span><span class="t">${esc(type)}</span></div>`).join("");
                return `<div><div class="c-label">${esc(label)}</div><div class="${cls}" role="group" aria-label="${esc(label)} ${esc(c.name)}${c.tag ? ", " + esc(c.tag) : ""}">`
                    + `<div class="card-head"><span class="name">${esc(c.name)}</span><span class="tag">${esc(c.tag || "")}</span></div><div class="rows">${rows}</div></div></div>`;
            };
            const board = list => `<div class="board">${list.map(l => card(l.c, l.label, l.ext)).join("")}</div>`;

            const blocks = apis.map((a, i) => `<section class="method" id="api-${esc(a.id)}">`
                + `<h2><span class="n">${i + 1}.</span><code>${esc(a.name)}</code><span class="tag${a.tag === "new" ? " write" : ""}">${esc(a.tag)}</span></h2>`
                + `<p class="sub">${esc(a.route)} · permission ${esc(a.perm)}</p>`
                + board([{ c: a.req, label: "request", ext: a.ext }, { c: a.res, label: "response", ext: a.ext }])
                + `</section>`);
            // Shared types: one last block, two cards per line.
            if (types.length) blocks.push(`<section class="method" id="api-shared-types">`
                + `<h2><span class="n">${apis.length + 1}.</span>Shared types</h2><p class="sub">Enums and nested messages used by more than one API.</p>`
                + board(types.map(t => ({ c: t, label: /enum/.test(t.tag) ? "enum" : "message" }))) + `</section>`);
            document.getElementById("board").innerHTML = blocks.join("");
        })(API);

    </script>
</body>

</html>
