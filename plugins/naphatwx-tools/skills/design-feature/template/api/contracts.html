<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API contracts · Feature Name</title>
    <style>
        /* theme:tokens:start */
        /* Synced from theme/tokens.css by theme/sync.mjs. Do not edit here. */
        :root {
            color-scheme: dark;

            /* Surfaces, darkest first */
            --bg: #121316;
            --surface: #18191d;
            --surface-2: #1f2025;
            --surface-3: #24262c;
            --line: #4a4d55;
            --line-strong: #5c6069;
            --line-3: #70737d;
            /* Hover fill for every control: a clear step up from any surface. Hover never changes the border */
            --hover: #33353b;

            /* Ink. Running text is --text; text-2 / text-3 are for chrome and meta labels only */
            --text: #e2e3e7;
            --text-2: #c6c8cf;
            --text-3: #a3a6b0;

            /* One accent */
            --accent: #8ab0ff;
            --accent-fill: #1b2232;
            --accent-soft: rgba(138, 176, 255, 0.12);

            /* Status: one hue set, two meanings. ok = add / pass, warn = change / flaky, bad = drop / fail */
            --ok: #8fd694;
            --warn: #f0c26b;
            --bad: #f28b8d;
            --neutral: #a3a6b0;
            --ok-soft: rgba(143, 214, 148, 0.12);
            --warn-soft: rgba(240, 194, 107, 0.12);
            --bad-soft: rgba(242, 139, 141, 0.12);
            --neutral-soft: rgba(163, 166, 176, 0.12);
            --add: var(--ok);
            --change: var(--warn);
            --drop: var(--bad);

            /* Diagrams: connectors and their labels */
            --connector: #6b6e78;

            /* Type. ui-monospace first, or macOS Chromium falls back to Courier */
            --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Cascadia Code", monospace;

            /* Type scale. Nothing renders below --fs-xs. Pages set font sizes by role (below), not by step. */
            --fs-xs: 0.75rem;
            --fs-sm: 0.875rem;
            --fs-md: 1rem;
            --fs-lg: 1.25rem;
            --fs-xl: 1.5rem;
            --fs-2xl: 2rem;
            /* Headings and lead line: the same steps on every page */
            --fs-lead: var(--fs-lg);
            --fs-h3: var(--fs-lg);
            --fs-h2: var(--fs-xl);
            --fs-h1: var(--fs-2xl);
            /* Roles: one step down per role, so the eye lands on body text first.
               body = running text, tables, buttons, action bars · meta = hints, asides, legends, captions, code · tag = pills, kbd, counts */
            --fs-body: var(--fs-md);
            --fs-meta: var(--fs-sm);
            --fs-code: var(--fs-sm);
            --fs-tag: var(--fs-xs);
            /* Diagrams draw at 1:1 with shapes sized for 14px: main labels 14, secondary lines (detail, sub, note, type) 12 */
            --fs-dia: var(--fs-sm);
            --fs-dia-sub: var(--fs-xs);

            /* Max widths: Tailwind max-w steps (md 448px, 3xl 768px, 4xl 896px, 5xl 1024px, 6xl 1152px, 7xl 1280px). Use these, not raw px */
            --max-w-md: 28rem;
            --max-w-3xl: 48rem;
            --max-w-4xl: 56rem;
            --max-w-5xl: 64rem;
            --max-w-6xl: 72rem;
            --max-w-7xl: 80rem;

            /* Page frame: every page centers its content at the same width, 80% of the window up to --max-w-4xl */
            --page-w: min(80%, var(--max-w-4xl));
            --gutter: clamp(16px, 3vw, 24px);

            --radius: 6px;
            --radius-md: 8px;
            --radius-lg: 10px;
            --radius-xl: 12px;
            --ease: cubic-bezier(0.2, 0, 0, 1);
        }
        /* theme:tokens:end */
        /* theme:base:start */
        /* Synced from theme/base.css by theme/sync.mjs. Do not edit here. */
        *, *::before, *::after { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            -webkit-font-smoothing: antialiased;
        }
        ::selection { background: rgba(138, 176, 255, 0.35); color: #fff; }
        * { scrollbar-width: auto; scrollbar-color: var(--line-3) transparent; }
        a { color: var(--accent); }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        code, kbd, pre, samp { font-family: var(--mono); }
        /* Label over a group (section, field, table column, step list): uppercase at meta size, tracked so caps stay readable */
        .label, th, dt { color: var(--text-2); font-size: var(--fs-meta); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
        /* Data inside a label (counts, names, notes, controls) keeps its own case */
        :is(.label, th, dt) :is(.label-note, button, input, kbd, code) { text-transform: none; letter-spacing: normal; }
        .label-note { font-weight: 400; }
        /* Scenario kind pill: basic (the main path), alternate (another path to the goal), exception (goal not reached).
           Outlined and tinted, so it never reads like the solid Core pill */
        .scenario-kind { display: inline-flex; align-items: center; flex: none; padding: 1px 8px; font: 600 var(--fs-tag)/1.5 var(--mono); text-transform: uppercase; white-space: nowrap; color: var(--neutral); background: var(--neutral-soft); border: 1px solid currentColor; border-radius: 999px; }
        .scenario-kind.basic { color: var(--ok); background: var(--ok-soft); }
        .scenario-kind.exception { color: var(--bad); background: var(--bad-soft); }
        /* Core scenario ("core": true in use-cases.js): play it first. Solid accent so it reads in a long list */
        .core-pill { display: inline-flex; align-items: center; flex: none; padding: 1px 8px; font: 600 var(--fs-tag)/1.5 var(--mono); color: var(--bg); text-transform: uppercase; background: var(--accent); border: 1px solid var(--accent); border-radius: 999px; white-space: nowrap; }
        /* trace IDs hide behind a "N refs" chip; a click shows them on the same line */
        .references-chip { flex: none; padding: 1px 8px; font: var(--fs-tag)/1.5 var(--mono); color: var(--text-2); text-transform: uppercase; background: none; border: 1px solid var(--line-strong); border-radius: 999px; cursor: pointer; }
        .references-chip:hover { background: var(--hover); }
        .references-chip[aria-expanded="true"] { color: var(--accent); border-color: var(--accent); }
        .references-chip[aria-expanded="false"] + .references-ids { display: none; }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
        }
        /* theme:base:end */
        /* theme:pdf:start */
        /* Synced from theme/pdf.css by theme/sync.mjs. Do not edit here. */
        /* .float-bar: one long box at the bottom right; Export PDF goes last, page tools can sit before it */
        .float-bar { position: fixed; right: 20px; bottom: 20px; z-index: 50; display: flex; gap: 2px; padding: 4px; background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: var(--radius-xl); }
        .float-bar button { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border: 0; border-radius: var(--radius-md); background: none; color: var(--text-2); font: 500 var(--fs-body) var(--sans); white-space: nowrap; cursor: pointer; }
        .float-bar button:hover { background: var(--hover); color: var(--text); }
        /* Room under the last line so the bar never hides it: bar 42px + its 20px offset + a 14px gap.
           An embedded diagram posts its body height with this padding, so the host frame keeps the room too. */
        body:has(.float-bar) { --float-space: 76px; padding-bottom: var(--float-space); }
        @page { margin: 0; }
        @media print {
            html, body { background: var(--bg); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .no-print { display: none !important; }
            body:has(.float-bar) { --float-space: 0px; padding-bottom: 0; }
            pre, figure, img, svg, tr { break-inside: avoid; }
            h1, h2, h3 { break-after: avoid; }
            .references-chip { display: none !important; }
            .references-ids { display: inline !important; }
        }
        /* theme:pdf:end */

        * { margin: 0; padding: 0; }
        /* theme:scrollbar:start */
        /* Synced from theme/scrollbar.css by theme/sync.mjs. Do not edit here. */
        ::-webkit-scrollbar { width: 12px; height: 12px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--line-3); border-radius: var(--radius-md); }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-3); }
        /* theme:scrollbar:end */

        body { padding: 20px 0 32px; }
        /* one column for header and boards, at most 96% of the screen and max-w-5xl */
        .page { max-width: min(96vw, var(--max-w-5xl)); margin: 0 auto; }

        /* theme:page-head:start */
        /* Synced from theme/page-head.css by theme/sync.mjs. Do not edit here. */
        header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
        h1 { font-size: var(--fs-h1); font-weight: 600; letter-spacing: -0.015em; }
        .subtitle { color: var(--text-3); font-size: var(--fs-meta); margin-top: 2px; }
        .actions { display: flex; gap: 8px; }

        .button {
            font: inherit;
            font-size: var(--fs-body);
            color: var(--text-2);
            background: var(--surface-2);
            border: 1px solid var(--line-strong);
            border-radius: var(--radius-md);
            padding: 6px 12px;
            cursor: pointer;
            text-decoration: none;
        }

        .button:hover { color: var(--text); background: var(--hover); }
        /* theme:page-head:end */
        header { margin-bottom: 12px; }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            margin-bottom: 24px;
            font-size: var(--fs-sm);
            color: var(--text-3);
        }

        .legend .add { color: var(--add); }
        .legend .change { color: var(--change); }
        .legend .drop { color: var(--drop); }

        /* one block per method: numbered title, route line, then its board */
        .method { margin-bottom: 32px; }
        .method h2 { display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px; font-size: var(--fs-h2); font-weight: 600; }
        .method h2 .number { color: var(--text-3); font-family: var(--mono); font-size: var(--fs-h3); }
        .method h2 code { font-size: inherit; }
        .method h2 .tag { color: var(--text-3); font-size: var(--fs-tag); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; border: 1px solid var(--line-strong); border-radius: 999px; padding: 2px 8px; }
        .method h2 .tag.write { color: var(--add); border-color: var(--add); }
        .method .subtitle { margin: 4px 0 10px; }

        /* a board: request and response cards side by side, each half the width, no frame around them; a long name or type wraps */
        .board { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 24px; }
        .card-label { color: var(--text-3); font-size: var(--fs-tag); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }

        /* a card: head with name and tag, then field rows. State marks come from the theme:diff block below */
        .table-card { border: 1.5px solid var(--line-3); border-radius: var(--radius-md); background: var(--surface-2); overflow: hidden; }
        .table-card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 7px 12px; background: var(--surface-3); }
        .table-card-head .table-card-name { font: 600 var(--fs-dia) var(--mono); overflow-wrap: anywhere; }
        .table-card-head .tag { color: var(--text-3); font-size: var(--fs-dia-sub); font-weight: 600; white-space: nowrap; }

        /* field rows: name | number | type. Rows share the card's columns (subgrid), so numbers and types line up */
        .rows { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, max-content); column-gap: 16px; }
        .row { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; align-items: baseline; padding: 4px 12px; border-top: 1px solid var(--line); }
        .row:nth-child(odd) { background: var(--neutral-soft); }
        .row .column { font: var(--fs-dia) var(--mono); overflow-wrap: anywhere; }
        .row .key { color: var(--text-3); font-size: var(--fs-dia-sub); font-weight: 700; }
        .row .type { color: var(--text-3); font-size: var(--fs-dia-sub); text-align: right; overflow-wrap: anywhere; }
        .none { padding: 7px 12px; color: var(--text-3); font-size: var(--fs-dia-sub); font-style: italic; }

        /* phones: one card per line */
        @media (max-width: 760px) {
            .board { grid-template-columns: minmax(0, 1fr); }
        }

        @media print {
            .actions { display: none; }
            .table-card { break-inside: avoid; }
        }

        /* theme:diff:start */
        /* Synced from theme/diff.css by theme/sync.mjs. Do not edit here. */
        /* Card state shows three ways, not by color alone: a gutter bar, a tinted head and a signed pill */
        .table-card:is(.add, .drop) { position: relative; }
        .table-card.add { border-color: var(--add); }
        .table-card.drop { border-color: var(--drop); }
        .table-card.external { border-style: dashed; }
        .table-card:is(.add, .drop)::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--add); }
        .table-card.drop::before { background: var(--drop); }
        .table-card:is(.add, .drop) :is(.table-card-head, .row) { padding-left: 16px; }
        .table-card.add .table-card-head { background: var(--ok-soft); }
        .table-card.drop .table-card-head { background: var(--bad-soft); }
        .table-card.drop :is(.table-card-head > :first-child, .table-card-name) { text-decoration: line-through; text-decoration-thickness: 1.5px; }
        .table-card.drop .row { opacity: 0.55; }
        .table-card:is(.add, .drop, .change) .tag { align-self: center; padding: 4px 8px; border-radius: 999px; font: 700 var(--fs-tag)/1 var(--sans); text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
        .table-card.add .tag { color: var(--bg); background: var(--add); }
        .table-card.drop .tag { color: var(--bg); background: var(--drop); }
        .table-card.change .tag { padding: 3px 7px; border: 1px solid var(--change); color: var(--change); }
        .table-card.add .tag::before { content: "+ "; }
        .table-card.drop .tag::before { content: "− "; }
        .table-card.change .tag::before { content: "~ "; }
        /* Changed rows: tinted, name and key in the mark's color; a dropped row is struck through */
        .table-card .row.add { background: var(--ok-soft); }
        .table-card .row.change { background: var(--warn-soft); }
        .table-card .row.drop { background: var(--bad-soft); }
        .table-card .row.add :is(.column, .key) { color: var(--add); }
        .table-card .row.change :is(.column, .key) { color: var(--change); }
        .table-card .row.drop :is(.column, .type, .key) { color: var(--drop); }
        .table-card .row.drop :is(.column, .type) { text-decoration: line-through; text-decoration-thickness: 1px; }
        /* Legend swatches */
        .legend i { display: inline-block; width: 22px; height: 12px; margin-right: 6px; vertical-align: middle; border: 1.5px solid var(--line-3); border-radius: 3px; }
        .legend i.add { border-color: var(--add); background: var(--ok-soft); box-shadow: inset 3px 0 var(--add); }
        .legend i.drop { border-color: var(--drop); background: var(--bad-soft); box-shadow: inset 3px 0 var(--drop); }
        .legend i.external { border-style: dashed; }
        /* SVG (ER diagram): the same classes. Text fills with currentColor, so the color rules above apply */
        svg .table-card text { fill: currentColor; }
        svg .table-card-box { fill: var(--surface-2); stroke: var(--line-3); stroke-width: 1.2; }
        svg .table-card:is(.add, .drop) > .table-card-box { stroke: var(--add); stroke-width: 1.6; }
        svg .table-card.drop > .table-card-box { stroke: var(--drop); }
        svg .table-card.external > .table-card-box { stroke-dasharray: 5 4; }
        svg .table-card-head { fill: var(--surface-3); }
        svg .table-card.add > .table-card-head { fill: var(--ok-soft); }
        svg .table-card.drop > .table-card-head { fill: var(--bad-soft); }
        svg .table-card-bar { fill: var(--add); }
        svg .table-card.drop .table-card-bar { fill: var(--drop); }
        svg .tag > rect { fill: none; stroke: var(--change); }
        svg .table-card.add .tag > rect { fill: var(--add); stroke: none; }
        svg .table-card.drop .tag > rect { fill: var(--drop); stroke: none; }
        svg .table-card .row > .row-background { fill: transparent; }
        svg .table-card .row.add > .row-background { fill: var(--ok-soft); }
        svg .table-card .row.change > .row-background { fill: var(--warn-soft); }
        svg .table-card .row.drop > .row-background { fill: var(--bad-soft); }
        /* theme:diff:end */
    </style>
</head>

<body>
    <div class="page">
    <header>
        <div>
            <h1>API contracts · Feature Name</h1>
        </div>
        <div class="actions">
            <a class="button" href="../overview.html#api">← Overview</a>
        </div>
    </header>

    <div class="legend">
        <span><i class="add"></i>new message or type</span>
        <span><i class="drop"></i>removed message</span>
        <span><i></i>existing message (amber pill when altered)</span>
        <span><i class="external"></i>external (another service owns it)</span>
        <span><b class="add">+ add</b> · <b class="change">~ change</b> · <b class="drop">− drop</b></span>
    </div>

    <main id="board"></main>
    </div>

    <script>
        /* theme:pdf-js:start */
        /* Synced from theme/pdf.js by theme/sync.mjs. Do not edit here. */
        function addExportPdf(target, prepare) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'export-pdf no-print';
            if (!target) {
                target = document.querySelector('.float-bar');
                if (!target) { target = document.createElement('div'); target.className = 'float-bar no-print'; document.body.append(target); }
            }
            button.title = 'Export PDF (pick "Save as PDF" in the print dialog)';
            button.textContent = 'Export PDF';
            button.addEventListener('click', async () => {
                if (prepare) await prepare();
                window.print();
            });
            target.append(button);
            return button;
        }
        /* theme:pdf-js:end */
        addExportPdf();

        // Renders one numbered block per method: its title, route and permission, then a board with its request and response cards.
        // fields: [name, type, number, mark?] · mark: add | change | drop. Shared types get one last block.
        // type: the type only ("int32", "repeated ThingResponse"); no notes or proto comments, rules go in the overview's Behaviour bullets.
        // tag: "new" / "changed" / "behaviour" / "called, unchanged" on an API; "new message" / "altered" / "removed message" / "unchanged" on a message.
        const API = {
            apis: [
                { id: "create-thing", name: "CreateThing", tag: "new", route: "POST /api/v1/things", perm: "things.create",
                    req: { name: "CreateThingRequest", tag: "new message", fields: [
                        ["name", "string", "1"], ["ownerId", "int32", "2"], ["note", "optional string", "3"],
                    ] },
                    res: { name: "ThingResponse", tag: "altered", fields: [
                        ["id", "int64", "1"], ["name", "string", "2"], ["legacyFlag", "bool", "− 4", "drop"],
                        ["count", "int32 → int64", "~ 9", "change"], ["source", "RepositorySource", "+ 17", "add"],
                    ] } },
                { id: "get-things", name: "GetThings", tag: "behaviour", route: "GET /api/v1/things", perm: "things.read",
                    req: { name: "GetThingsRequest", tag: "unchanged", fields: [
                        ["source", "optional RepositorySource", "1"], ["page", "int32", "2"],
                    ] },
                    res: { name: "GetThingsResponse", tag: "unchanged", fields: [
                        ["items", "repeated ThingResponse", "1"], ["total", "int64", "2"],
                    ] } },
                { id: "get-owner", name: "GetOwner", tag: "called, unchanged", ext: true, route: "GET /api/v1/owners/{id}", perm: "none · system caller",
                    req: { name: "GetOwnerRequest", tag: "unchanged", fields: [["id", "int32", "1"]] },
                    res: { name: "Owner", tag: "unchanged", fields: [["id", "int32", "1"], ["displayName", "string", "2"]] } },
            ],
            types: [
                { name: "RepositorySource", tag: "new enum", fields: [
                    ["REPOSITORY_SOURCE_UNSPECIFIED", "", "0"], ["GITLAB", "", "1"],
                ] },
            ],
        };


        (function render({ apis, types }) {
            const escapeHtml = value => String(value).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
            const changeMark = message => /^new/.test(message.tag) ? "add" : /removed/.test(message.tag) ? "drop" : /altered/.test(message.tag) ? "change" : "";

            // A card: label above, head with name and tag, then one row per field. No message → one muted line.
            const card = (message, label, external) => {
                if (!message) return `<div><div class="card-label">${escapeHtml(label)}</div><div class="table-card"><div class="none">no message</div></div></div>`;
                const className = ["table-card", changeMark(message), external ? "external" : ""].filter(Boolean).join(" ");
                const rows = message.fields.map(([name, type, number, mark]) => `<div class="row${mark ? " " + mark : ""}">`
                    + `<span class="column">${escapeHtml(name)}</span><span class="key">${escapeHtml(number)}</span><span class="type">${escapeHtml(type)}</span></div>`).join("");
                return `<div><div class="card-label">${escapeHtml(label)}</div><div class="${className}" role="group" aria-label="${escapeHtml(label)} ${escapeHtml(message.name)}${message.tag ? ", " + escapeHtml(message.tag) : ""}">`
                    + `<div class="table-card-head"><span class="table-card-name">${escapeHtml(message.name)}</span><span class="tag">${escapeHtml(message.tag || "")}</span></div><div class="rows">${rows}</div></div></div>`;
            };
            const board = cards => `<div class="board">${cards.map(c => card(c.message, c.label, c.external)).join("")}</div>`;

            const blocks = apis.map((api, i) => `<section class="method" id="api-${escapeHtml(api.id)}">`
                + `<h2><span class="number">${i + 1}.</span><code>${escapeHtml(api.name)}</code><span class="tag${api.tag === "new" ? " write" : ""}">${escapeHtml(api.tag)}</span></h2>`
                + `<p class="subtitle">${escapeHtml(api.route)} · permission ${escapeHtml(api.perm)}</p>`
                + board([{ message: api.req, label: "request", external: api.ext }, { message: api.res, label: "response", external: api.ext }])
                + `</section>`);
            // Shared types: one last block, two cards per line.
            if (types.length) blocks.push(`<section class="method" id="api-shared-types">`
                + `<h2><span class="number">${apis.length + 1}.</span>Shared types</h2>`
                + board(types.map(t => ({ message: t, label: /enum/.test(t.tag) ? "enum" : "message" }))) + `</section>`);
            document.getElementById("board").innerHTML = blocks.join("");
        })(API);

    </script>
</body>

</html>
