<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock · MCP console</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @custom-variant dark (&:where(.dark, .dark *));
    </style>
    <script src="../contract/rules.js"></script>
    <script src="../contract/data.js"></script>
    <script src="../shared/scenarios.js"></script>
    <script src="../shared/components.js"></script>
    <script src="../shared/fake-api.js"></script>
    <script src="../shared/use-cases.js"></script>
</head>

<!-- An MCP (or API) client calling the feature's operations. ?scenario= sets the caller and faults; ?uc= presets op + request. -->
<body class="antialiased bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-white">
    <div class="p-8 space-y-6">
        <div class="flex items-center justify-between gap-4">
            <div>
                <div class="font-semibold">MCP client</div>
                <div class="text-xs text-gray-500 font-mono">tool &lt;ServiceName&gt; · {operation, params}</div>
            </div>
            <div id="who" class="text-xs text-gray-500 text-right"></div>
        </div>
        <div class="grid grid-cols-2 gap-6">
            <div class="rounded-lg bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 p-5 space-y-3">
                <label class="block text-sm font-medium">operation<select id="op" class="mt-1 w-full rounded-lg border border-gray-400 bg-white dark:bg-gray-800 px-3 py-2 text-sm font-mono"></select></label>
                <label class="block text-sm font-medium">params<textarea id="reqBody" spellcheck="false" class="mt-1 w-full h-72 font-mono text-xs bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded-lg p-3"></textarea></label>
                <button id="runBtn" class="px-4 py-2 text-sm rounded-lg bg-purple-600 hover:bg-purple-700 text-white">Run</button>
            </div>
            <div class="rounded-lg bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 p-5 flex flex-col">
                <div class="text-sm font-medium mb-1">result</div>
                <pre id="resBody" class="flex-1 rounded-lg bg-gray-50 dark:bg-gray-950 border border-gray-200 dark:border-gray-700 p-3 text-xs font-mono overflow-auto h-80 whitespace-pre-wrap">Press Run.</pre>
            </div>
        </div>
        <div>
            <div class="text-sm font-medium mb-2">Audit log <span class="text-xs text-gray-500 font-normal">— what the real service writes (this browser session)</span></div>
            <div id="log"></div>
        </div>
    </div>
    <script>
        const uc = USE_CASES.find(u => u.id === Scenarios.params.get('uc'));
        const op = document.getElementById('op'), reqBody = document.getElementById('reqBody'), resBody = document.getElementById('resBody');
        document.getElementById('who').innerHTML = `scenario ${UI.esc(Scenarios.current.label)}<br>${Scenarios.current.perms.map(p => `<code>${p}</code>`).join(' ')}`;
        const wantOp = uc?.op || Scenarios.params.get('op');
        op.innerHTML = Object.keys(FakeApi.SAMPLES).map(k => `<option ${wantOp === k ? 'selected' : ''}>${k}</option>`).join('');
        const fill = () => { reqBody.value = JSON.stringify(uc && op.value === uc.op ? uc.req : FakeApi.SAMPLES[op.value], null, 2); };
        op.onchange = fill; fill();
        document.getElementById('runBtn').onclick = async () => {
            resBody.textContent = '…';
            try { resBody.textContent = '// OK\n' + JSON.stringify(await FakeApi[op.value](JSON.parse(reqBody.value)), null, 2); }
            catch (e) { resBody.textContent = '// ERROR\n' + JSON.stringify(e instanceof Error ? { code: 'InvalidArgument', message: e.message } : e, null, 2); }
            renderLog();
        };
        function renderLog() {
            const rows = FakeApi.log();
            document.getElementById('log').innerHTML = !rows.length
                ? '<div class="text-xs text-gray-500 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg p-4 text-center">Nothing yet.</div>'
                : `<div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg divide-y divide-gray-200 dark:divide-gray-700">${rows.map(r => `<div class="px-4 py-2 text-xs flex gap-4"><span class="text-gray-500 whitespace-nowrap">${UI.date(r.at)}</span><span>${UI.esc(r.message)}</span></div>`).join('')}</div>`;
        }
        renderLog();
    </script>
</body>

</html>
