<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example flow</title>
  <style>
    /* theme:tokens:start */
    /* Synced from theme/tokens.css by theme/sync.mjs. Do not edit here. */
    :root {
        color-scheme: dark;

        /* Surfaces, darkest first */
        --bg: #121316;
        --surface: #18191d;
        --surface-2: #1f2025;
        --surface-3: #24262c;
        --line: #26282e;
        --line-strong: #363940;
        --line-3: #4a4d55;

        /* Ink. Running text is --text; text-2 / text-3 are for chrome and meta labels only */
        --text: #e2e3e7;
        --text-2: #c6c8cf;
        --text-3: #a3a6b0;

        /* One accent */
        --accent: #8ab0ff;
        --accent-fill: #1b2232;
        --accent-soft: rgba(138, 176, 255, 0.12);

        /* Status: one hue set, two meanings. ok = add / pass, warn = change / flaky, bad = drop / fail */
        --ok: #8fd694;
        --warn: #f0c26b;
        --bad: #f28b8d;
        --neutral: #a3a6b0;
        --ok-soft: rgba(143, 214, 148, 0.12);
        --warn-soft: rgba(240, 194, 107, 0.12);
        --bad-soft: rgba(242, 139, 141, 0.12);
        --neutral-soft: rgba(163, 166, 176, 0.12);
        --add: var(--ok);
        --change: var(--warn);
        --drop: var(--bad);

        /* Diagrams: connectors and their labels */
        --connector: #6b6e78;

        /* Type. ui-monospace first, or macOS Chromium falls back to Courier */
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Cascadia Code", monospace;

        /* Type scale. Body text is --fs-md on every page; code and pills --fs-sm. Reports use only
           --fs-lg (title), --fs-md and --fs-sm. Nothing renders below --fs-xs. */
        --fs-xs: 0.75rem;
        --fs-sm: 0.875rem;
        --fs-md: 1rem;
        --fs-lg: 1.25rem;
        --fs-xl: 1.75rem;
        --fs-2xl: 2.75rem;
        /* Headings and lead line: the same steps on every page */
        --fs-lead: var(--fs-lg);
        --fs-h3: var(--fs-lg);
        --fs-h2: var(--fs-xl);
        --fs-h1: var(--fs-2xl);

        /* Page frame: every page centers its content at the same width */
        --page-w: 1200px;
        --gutter: clamp(16px, 3vw, 24px);

        --radius: 6px;
        --radius-lg: 10px;
        --ease: cubic-bezier(0.2, 0, 0, 1);
    }
    /* theme:tokens:end */
    /* theme:base:start */
    /* Synced from theme/base.css by theme/sync.mjs. Do not edit here. */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
    }
    ::selection { background: rgba(138, 176, 255, 0.35); color: #fff; }
    * { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
    a { color: var(--accent); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    code, kbd, pre, samp { font-family: var(--mono); }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
    }
    /* theme:base:end */

    * { margin: 0; padding: 0; }
    body { background: var(--surface); padding: 3rem 2rem; }
    .page { max-width: 1200px; width: 100%; margin: 0 auto; }
    .eyebrow { font-size: 0.8125rem; color: var(--text-3); margin-bottom: 0.5rem; }
    h1 { font-size: var(--fs-h1); font-weight: 600; letter-spacing: -0.015em; line-height: 1.15; margin-bottom: 1.5rem; }
    /* Drawn at 1:1 (every label 14px), never scaled; a narrow window scrolls the diagram, not the page. */
    .diagram { overflow-x: auto; }
    .diagram svg { display: block; width: 901px; max-width: none; height: auto; margin: 0 auto; font-family: var(--sans); }
    @media (max-width: 640px) { body { padding: 1.5rem 1rem; } }
    .legend { display: flex; flex-wrap: wrap; gap: 18px; font-size: 0.875rem; color: var(--text-3); margin-bottom: 12px; }
    .legend span::before { content: ""; display: inline-block; width: 26px; vertical-align: middle; margin-right: 6px; border-top: 2px solid var(--text-2); }
    .legend .ret::before { border-top-style: dashed; border-color: var(--text-3); }
    .legend .hot::before { border-color: var(--accent); }
    .actor rect { fill: var(--surface-2); stroke: var(--line-strong); }
    .actor text { fill: var(--text); font-size: var(--fs-sm); font-weight: 600; }
    .actor .sub { fill: var(--text-3); font-size: var(--fs-sm); font-weight: 400; }
    .life { stroke: var(--line-strong); stroke-dasharray: 3 4; }
    .msg { stroke: var(--text-2); stroke-width: 1.4; fill: none; }
    .msg.ret { stroke-dasharray: 5 4; stroke: var(--text-3); }
    .msg.hot { stroke: var(--accent); stroke-width: 1.8; }
    .lbl { fill: var(--text-2); font-size: var(--fs-sm); font-family: var(--mono); }
    .lbl.hot { fill: var(--accent); }
    .num { fill: var(--text-3); font-size: var(--fs-sm); font-weight: 600; }
    .phase line { stroke: var(--line); }
    .phase rect { fill: var(--surface-2); }
    .phase text { fill: var(--text-2); font-size: var(--fs-sm); font-weight: 600; }
    .note rect { fill: var(--bg); stroke: var(--line-strong); }
    .note text { fill: var(--text-2); font-size: var(--fs-sm); font-family: var(--mono); }
    .frame rect.box { fill: none; stroke: var(--line-strong); stroke-width: 1.2; }
    .frame rect.tab { fill: var(--surface-2); stroke: var(--line-strong); }
    .frame text { fill: var(--text); font-size: var(--fs-sm); font-weight: 700; }
    .frame .cond { fill: var(--text-3); font-weight: 500; font-style: italic; }
    .frame line { stroke: var(--line-strong); stroke-dasharray: 6 4; }
    .ah { fill: var(--text-2); }
    .ah.ret { fill: var(--text-3); }
    .ah.hot { fill: var(--accent); }
  </style>
</head>
<body>
  <div class="page">
    <p class="eyebrow">Flow 02 · Sequence</p>
    <h1>Example flow</h1>
    <p class="legend"><span>Call</span><span class="ret">Response</span><span class="hot">Side effect (external write or audit)</span></p>

    <div class="diagram">
      <svg viewBox="0 0 901 784" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="example-flow-seq-title example-flow-seq-desc">
        <title id="example-flow-seq-title">Example flow: sequence diagram, 5 participants, 12 steps</title>
        <desc id="example-flow-seq-desc">web-app loads a thing through api-service and Postgres, then CreateThing calls the external system and writes an audit log on 200, or returns FAILED_PRECONDITION on 400.</desc>
        <line class="life" x1="80" x2="80" y1="68" y2="780"/>
        <line class="life" x1="240" x2="240" y1="68" y2="780"/>
        <line class="life" x1="431" x2="431" y1="68" y2="780"/>
        <line class="life" x1="657" x2="657" y1="68" y2="780"/>
        <line class="life" x1="817" x2="817" y1="68" y2="780"/>
        <g class="frame"><rect class="box" x="14" y="446" width="873" height="308" rx="6"/><rect class="tab" x="14" y="446" width="46" height="22" rx="4"/><text x="24" y="462">alt</text><text class="cond" x="68" y="462">[upstream 200]</text><line x1="14" x2="887" y1="642" y2="642"/><text class="cond" x="22" y="659">[upstream 400]</text></g>
        <g class="actor"><rect x="21" y="16" width="118" height="52" rx="8"/><text x="80" y="38" text-anchor="middle">User</text><text class="sub" x="80" y="57" text-anchor="middle">browser</text></g>
        <g class="actor"><rect x="181" y="16" width="118" height="52" rx="8"/><text x="240" y="38" text-anchor="middle">web-app</text><text class="sub" x="240" y="57" text-anchor="middle">screen name</text></g>
        <g class="actor"><rect x="370.5" y="16" width="121" height="52" rx="8"/><text x="431" y="38" text-anchor="middle">api-service</text><text class="sub" x="431" y="57" text-anchor="middle">ServiceName</text></g>
        <g class="actor"><rect x="598" y="16" width="118" height="52" rx="8"/><text x="657" y="38" text-anchor="middle">Postgres</text><text class="sub" x="657" y="57" text-anchor="middle">schema.*</text></g>
        <g class="actor"><rect x="745.5" y="16" width="143" height="52" rx="8"/><text x="817" y="38" text-anchor="middle">External</text><text class="sub" x="817" y="57" text-anchor="middle">upstream system</text></g>
        <g class="phase"><line x1="8" x2="893" y1="102" y2="102"/><rect x="8" y="90" width="90" height="24" rx="4"/><text x="18" y="107">1 · Load</text></g>
        <g class="step"><line class="msg" x1="80" y1="136" x2="232" y2="136"/><path class="ah" d="M239,136 l-9,-4.5 v9 z"/><text class="lbl" x="160" y="129" text-anchor="middle">/things/:id</text><text class="num" x="86" y="153">1</text></g>
        <g class="step"><title>id from the route</title><line class="msg" x1="240" y1="176" x2="423" y2="176"/><path class="ah" d="M430,176 l-9,-4.5 v9 z"/><text class="lbl" x="335.5" y="169" text-anchor="middle">GetThing</text><text class="num" x="246" y="193">2</text></g>
        <g class="step"><line class="msg" x1="431" y1="216" x2="649" y2="216"/><path class="ah" d="M656,216 l-9,-4.5 v9 z"/><text class="lbl" x="544" y="209" text-anchor="middle">SELECT schema.thing</text><text class="num" x="437" y="233">3</text></g>
        <g class="note"><title>needs permission thing.view; the id must exist, or NOT_FOUND</title><rect x="328.5" y="244" width="205" height="24" rx="4"/><text x="431" y="261" text-anchor="middle">permission thing.view</text></g>
        <g class="step"><line class="msg ret" x1="431" y1="290" x2="248" y2="290"/><path class="ah ret" d="M241,290 l9,-4.5 v9 z"/><text class="lbl" x="335.5" y="283" text-anchor="middle">ThingResponse</text><text class="num" x="246" y="307">4</text></g>
        <g class="phase"><line x1="8" x2="893" y1="336" y2="336"/><rect x="8" y="324" width="82" height="24" rx="4"/><text x="18" y="341">2 · Act</text></g>
        <g class="step"><line class="msg" x1="80" y1="370" x2="232" y2="370"/><path class="ah" d="M239,370 l-9,-4.5 v9 z"/><text class="lbl" x="160" y="363" text-anchor="middle">Confirm</text><text class="num" x="86" y="387">5</text></g>
        <g class="step"><title>name, ownerId</title><line class="msg" x1="240" y1="410" x2="423" y2="410"/><path class="ah" d="M430,410 l-9,-4.5 v9 z"/><text class="lbl" x="335.5" y="403" text-anchor="middle">CreateThing</text><text class="num" x="246" y="427">6</text></g>
        <g class="step"><title>timeout 10 s</title><line class="msg hot" x1="431" y1="486" x2="809" y2="486"/><path class="ah hot" d="M816,486 l-9,-4.5 v9 z"/><text class="lbl hot" x="624" y="479" text-anchor="middle">POST /things</text><text class="num" x="437" y="503">7</text></g>
        <g class="step"><line class="msg ret" x1="817" y1="526" x2="439" y2="526"/><path class="ah ret" d="M432,526 l9,-4.5 v9 z"/><text class="lbl" x="624" y="519" text-anchor="middle">200</text><text class="num" x="437" y="543">8</text></g>
        <g class="step"><line class="msg hot" x1="431" y1="566" x2="649" y2="566"/><path class="ah hot" d="M656,566 l-9,-4.5 v9 z"/><text class="lbl hot" x="544" y="559" text-anchor="middle">INSERT schema.audit_log</text><text class="num" x="437" y="583">9</text></g>
        <g class="step"><line class="msg ret" x1="431" y1="606" x2="248" y2="606"/><path class="ah ret" d="M241,606 l9,-4.5 v9 z"/><text class="lbl" x="335.5" y="599" text-anchor="middle">ThingResponse</text><text class="num" x="246" y="623">10</text></g>
        <g class="step"><line class="msg ret" x1="817" y1="682" x2="439" y2="682"/><path class="ah ret" d="M432,682 l9,-4.5 v9 z"/><text class="lbl" x="624" y="675" text-anchor="middle">400</text><text class="num" x="437" y="699">11</text></g>
        <g class="step"><title>upstream reason passed through</title><line class="msg ret" x1="431" y1="722" x2="248" y2="722"/><path class="ah ret" d="M241,722 l9,-4.5 v9 z"/><text class="lbl" x="335.5" y="715" text-anchor="middle">FAILED_PRECONDITION</text><text class="num" x="246" y="739">12</text></g>
      </svg>
    </div>
  </div>
  <script>
    // Embed contract with a host page such as design-feature's overview.html (postMessage works on file://).
    // Out: {type: "diagram-height", height} on every resize, so the host sizes the iframe.
    const embedded = parent !== window;
    const style = document.createElement("style");
    style.textContent = `* { scrollbar-width: thin; scrollbar-color: #363940 transparent; }
      .embedded body { padding: 1rem; }
      .embedded .eyebrow, .embedded h1 { display: none; }`;
    document.head.append(style);
    // Embedded: the host shows the title and sizes the height, so the file drops its own heading.
    if (embedded) { document.documentElement.classList.add("embedded"); document.documentElement.style.overflowY = "hidden"; }
    // Draw each diagram at its viewBox width, never scaled, so 14px labels render at 14px; a narrow frame scrolls it sideways.
    const svgs = [...document.querySelectorAll("svg[viewBox]:not(svg svg)")];
    svgs.forEach(svg => {
      Object.assign(svg.style, { width: svg.viewBox.baseVal.width + "px", maxWidth: "none", height: "auto" });
      if (getComputedStyle(svg.parentElement).overflowX === "auto") return;
      const box = document.createElement("div");
      box.style.overflowX = "auto";
      svg.before(box);
      box.append(svg);
    });
    // body, not documentElement: its scrollHeight never drops below the iframe's height
    const postHeight = () => parent.postMessage({ type: "diagram-height", height: document.body.getBoundingClientRect().height }, "*");
    addEventListener("load", postHeight);
    new ResizeObserver(postHeight).observe(document.body);
  </script>
</body>
</html>
