<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" width="760" height="490" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="14">
    <title id="t">Example flowchart</title>
    <desc id="d">Open the form, check the thing.edit permission, validate the name, save it with CreateThing or show INVALID_ARGUMENT and retry.</desc>
    <!-- Shapes: terminal = outlined pill · process = filled box · decision = accent diamond. Grey connectors, sentence-case Yes/No labels; a loop back enters its target at its own point.
         Each node: a plain-words line, then a mono line with the real value from the source (permission, RPC, field rule, code, status).
         All text is 14px and hosts draw the file at 1:1, so size each shape to about 8.5px per mono character. -->
    <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#6b6e78" />
        </marker>
    </defs>
    <g fill="none" stroke="#6b6e78" stroke-width="1.6" marker-end="url(#ah)">
        <path d="M380,70 V103" />
        <path d="M500,165 H578" />
        <path d="M380,225 V263" />
        <path d="M500,325 H578" />
        <path d="M260,325 H202" />
        <path d="M660,355 V418" />
        <path d="M120,293 V258 H325 V293" />
    </g>
    <g fill="#a3a6b0" text-anchor="middle">
        <text x="539" y="157">No</text>
        <text x="398" y="250">Yes</text>
        <text x="539" y="317">Yes</text>
        <text x="231" y="317">No</text>
        <text x="222" y="250">Retry</text>
    </g>
    <g fill="#e2e3e7" text-anchor="middle" font-weight="600">
        <rect x="300" y="20" width="160" height="50" rx="25" fill="#121316" stroke="#4a4d55" stroke-width="1.4" />
        <text x="380" y="41">Open the form</text>
        <polygon points="380,105 500,165 380,225 260,165" fill="#1b2232" stroke="#8ab0ff" stroke-width="1.4" />
        <text x="380" y="160">Can edit?</text>
        <rect x="580" y="140" width="160" height="50" rx="25" fill="#121316" stroke="#4a4d55" stroke-width="1.4" />
        <text x="660" y="161">No Edit button</text>
        <polygon points="380,265 500,325 380,385 260,325" fill="#1b2232" stroke="#8ab0ff" stroke-width="1.4" />
        <text x="380" y="320">Name valid?</text>
        <rect x="40" y="295" width="160" height="60" fill="#24262c" stroke="#363940" stroke-width="1.2" rx="8" />
        <text x="120" y="320">Show error</text>
        <rect x="580" y="295" width="160" height="60" fill="#24262c" stroke="#363940" stroke-width="1.2" rx="8" />
        <text x="660" y="320">Save record</text>
        <rect x="580" y="420" width="160" height="50" rx="25" fill="#121316" stroke="#4a4d55" stroke-width="1.4" />
        <text x="660" y="441">Saved</text>
    </g>
    <g fill="#c6c8cf" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">
        <text x="380" y="59">/things/:id</text>
        <text x="380" y="180">thing.edit</text>
        <text x="660" y="179">read-only view</text>
        <text x="380" y="340">name max 64 chars</text>
        <text x="120" y="340">INVALID_ARGUMENT</text>
        <text x="660" y="340">CreateThing</text>
        <text x="660" y="459">status = ACTIVE</text>
    </g>
</svg>
