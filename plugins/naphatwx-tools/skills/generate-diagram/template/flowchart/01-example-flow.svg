<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="14">
    <title id="t">Example flowchart</title>
    <desc id="d">Start, check the input, save it or show an error and retry.</desc>
    <!-- Shapes: terminal = gold pill · process = navy box · decision = red diamond. Connectors: grey, Yes/No labels on each branch. -->
    <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#7a7a84" />
        </marker>
    </defs>
    <g fill="none" stroke="#7a7a84" stroke-width="2" marker-end="url(#ah)">
        <path d="M360,60 V98" />
        <path d="M450,150 H518" />
        <path d="M270,150 H202" />
        <path d="M600,175 V258" />
        <path d="M120,125 V80 H358" />
    </g>
    <g fill="#9a9aa4" font-size="13" text-anchor="middle">
        <text x="485" y="142">Yes</text>
        <text x="236" y="142">No</text>
        <text x="200" y="72">retry</text>
    </g>
    <g fill="#fff" text-anchor="middle">
        <rect x="300" y="20" width="120" height="40" rx="20" fill="#e0bb6a" />
        <text x="360" y="45">Start</text>
        <polygon points="360,100 450,150 360,200 270,150" fill="#ab5258" />
        <text x="360" y="146">Valid</text>
        <text x="360" y="164">input?</text>
        <rect x="520" y="125" width="160" height="50" fill="#274a73" />
        <text x="600" y="155">Save record</text>
        <rect x="40" y="125" width="160" height="50" fill="#274a73" />
        <text x="120" y="155">Show error</text>
        <rect x="540" y="260" width="120" height="40" rx="20" fill="#e0bb6a" />
        <text x="600" y="285">Done</text>
    </g>
</svg>
