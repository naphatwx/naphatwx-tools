<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example flow</title>
  <style>
    /* theme:tokens:start */
    /* Synced from theme/tokens.css by theme/sync.mjs. Do not edit here. */
    :root {
        color-scheme: dark;

        /* Surfaces, darkest first */
        --bg: #121316;
        --surface: #18191d;
        --surface-2: #1f2025;
        --surface-3: #24262c;
        --line: #4a4d55;
        --line-strong: #5c6069;
        --line-3: #70737d;
        /* Hover fill for every control: a clear step up from any surface. Hover never changes the border */
        --hover: #33353b;

        /* Ink. Running text is --text; text-2 / text-3 are for chrome and meta labels only */
        --text: #e2e3e7;
        --text-2: #c6c8cf;
        --text-3: #a3a6b0;

        /* One accent */
        --accent: #8ab0ff;
        --accent-fill: #1b2232;
        --accent-soft: rgba(138, 176, 255, 0.12);

        /* Status: one hue set, two meanings. ok = add / pass, warn = change / flaky, bad = drop / fail */
        --ok: #8fd694;
        --warn: #f0c26b;
        --bad: #f28b8d;
        --neutral: #a3a6b0;
        --ok-soft: rgba(143, 214, 148, 0.12);
        --warn-soft: rgba(240, 194, 107, 0.12);
        --bad-soft: rgba(242, 139, 141, 0.12);
        --neutral-soft: rgba(163, 166, 176, 0.12);
        --add: var(--ok);
        --change: var(--warn);
        --drop: var(--bad);

        /* Diagrams: connectors and their labels */
        --connector: #6b6e78;

        /* Type. ui-monospace first, or macOS Chromium falls back to Courier */
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Cascadia Code", monospace;

        /* Type scale. Nothing renders below --fs-xs. Pages set font sizes by role (below), not by step. */
        --fs-xs: 0.75rem;
        --fs-sm: 0.875rem;
        --fs-md: 1rem;
        --fs-lg: 1.25rem;
        --fs-xl: 1.5rem;
        --fs-2xl: 2rem;
        /* Headings and lead line: the same steps on every page */
        --fs-lead: var(--fs-lg);
        --fs-h3: var(--fs-lg);
        --fs-h2: var(--fs-xl);
        --fs-h1: var(--fs-2xl);
        /* Roles: one step down per role, so the eye lands on body text first.
           body = running text, tables, buttons, action bars · meta = hints, asides, legends, captions, code · tag = pills, kbd, counts */
        --fs-body: var(--fs-md);
        --fs-meta: var(--fs-sm);
        --fs-code: var(--fs-sm);
        --fs-tag: var(--fs-xs);
        /* Diagrams draw at 1:1 with shapes sized for 14px: main labels 14, secondary lines (detail, sub, note, type) 12 */
        --fs-dia: var(--fs-sm);
        --fs-dia-sub: var(--fs-xs);

        /* Max widths: Tailwind max-w steps (md 448px, 3xl 768px, 4xl 896px, 5xl 1024px, 6xl 1152px, 7xl 1280px). Use these, not raw px */
        --max-w-md: 28rem;
        --max-w-3xl: 48rem;
        --max-w-4xl: 56rem;
        --max-w-5xl: 64rem;
        --max-w-6xl: 72rem;
        --max-w-7xl: 80rem;

        /* Page frame: every page centers its content at the same width, 80% of the window up to --max-w-5xl */
        --page-w: min(80%, var(--max-w-5xl));
        --gutter: clamp(16px, 3vw, 24px);

        --radius: 6px;
        --radius-md: 8px;
        --radius-lg: 10px;
        --radius-xl: 12px;
        --ease: cubic-bezier(0.2, 0, 0, 1);
    }

    /* Text size picker (theme/font-size.js) sets html[data-fs]. Medium is the default above.
       Only body, meta and code change; Large also grows tags and diagram labels. */
    :root[data-fs="small"] {
        --fs-body: 0.875rem;
        --fs-meta: 0.75rem;
        --fs-code: 0.75rem;
    }
    :root[data-fs="large"] {
        --fs-body: 1.125rem;
        --fs-meta: 1rem;
        --fs-code: 1rem;
        --fs-tag: 0.875rem;
        --fs-dia: 1rem;
        --fs-dia-sub: 0.875rem;
    }
    /* theme:tokens:end */
    /* theme:base:start */
    /* Synced from theme/base.css by theme/sync.mjs. Do not edit here. */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
    }
    ::selection { background: rgba(138, 176, 255, 0.35); color: #fff; }
    /* Chrome ignores ::-webkit-scrollbar once scrollbar-color is set, so the standard rule is for Firefox only */
    @supports not selector(::-webkit-scrollbar) { * { scrollbar-width: auto; scrollbar-color: var(--line-3) transparent; } }
    ::-webkit-scrollbar { width: 12px; height: 12px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--line-3); border-radius: var(--radius-md); }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-3); }
    a { color: var(--accent); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    code, kbd, pre, samp { font-family: var(--mono); }
    /* Label over a group (section, field, table column, step list): uppercase at meta size, tracked so caps stay readable */
    .label, th, dt { color: var(--text-2); font-size: var(--fs-meta); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    /* Data inside a label (counts, names, notes, controls) keeps its own case */
    :is(.label, th, dt) :is(.label-note, button, input, kbd, code) { text-transform: none; letter-spacing: normal; }
    .label-note { font-weight: 400; }
    /* Scenario kind pill: basic (the main path), alternate (another path to the goal), exception (goal not reached).
       Outlined and tinted, so it never reads like the solid Core pill */
    .scenario-kind { display: inline-flex; align-items: center; flex: none; padding: 1px 8px; font: 600 var(--fs-tag)/1.5 var(--mono); text-transform: uppercase; white-space: nowrap; color: var(--neutral); background: var(--neutral-soft); border: 1px solid currentColor; border-radius: 999px; }
    .scenario-kind.basic { color: var(--ok); background: var(--ok-soft); }
    .scenario-kind.exception { color: var(--bad); background: var(--bad-soft); }
    /* Core scenario ("core": true in use-cases.js): play it first. Solid accent so it reads in a long list */
    .core-pill { display: inline-flex; align-items: center; flex: none; padding: 1px 8px; font: 600 var(--fs-tag)/1.5 var(--mono); color: var(--bg); text-transform: uppercase; background: var(--accent); border: 1px solid var(--accent); border-radius: 999px; white-space: nowrap; }
    /* trace IDs hide behind a "N refs" chip; a click shows them on the same line */
    .references-chip { flex: none; padding: 1px 8px; font: var(--fs-tag)/1.5 var(--mono); color: var(--text-2); text-transform: uppercase; background: none; border: 1px solid var(--line-strong); border-radius: 999px; cursor: pointer; }
    .references-chip:hover { background: var(--hover); }
    .references-chip[aria-expanded="true"] { color: var(--accent); border-color: var(--accent); }
    .references-chip[aria-expanded="false"] + .references-ids { display: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
    }
    /* theme:base:end */
    /* theme:pdf:start */
    /* Synced from theme/pdf.css by theme/sync.mjs. Do not edit here. */
    /* .float-bar: one long box at the bottom right; Export PDF goes last, page tools can sit before it */
    .float-bar { position: fixed; right: 20px; bottom: 20px; z-index: 50; display: flex; gap: 2px; padding: 4px; background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: var(--radius-xl); }
    .float-bar button { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border: 0; border-radius: var(--radius-md); background: none; color: var(--text-2); font: 500 var(--fs-body) var(--sans); white-space: nowrap; cursor: pointer; }
    .float-bar button:hover { background: var(--hover); color: var(--text); }
    /* Room under the last line so the bar never hides it: bar 42px + its 20px offset + a 14px gap.
       An embedded diagram posts its body height with this padding, so the host frame keeps the room too. */
    body:has(.float-bar) { --float-space: 76px; padding-bottom: var(--float-space); }
    @page { margin: 0; }
    @media print {
        html, body { background: var(--bg); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .no-print { display: none !important; }
        body:has(.float-bar) { --float-space: 0px; padding-bottom: 0; }
        pre, figure, img, svg, tr { break-inside: avoid; }
        h1, h2, h3 { break-after: avoid; }
        .references-chip { display: none !important; }
        .references-ids { display: inline !important; }
    }
    /* theme:pdf:end */
    /* theme:font-size:start */
    /* Synced from theme/font-size.css by theme/sync.mjs. Do not edit here. */
    .fs-picker {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 2px;
        border-radius: var(--radius-lg);
        background: var(--surface-2);
    }
    /* Inside a tool bar: no box of its own, a line before Export PDF */
    :is(.float-bar, .tools) .fs-picker {
        padding: 0 4px 0 0;
        margin-right: 2px;
        border: 0;
        border-right: 1px solid var(--line-strong);
        border-radius: 0;
        background: none;
    }
    /* .fs-picker prefix: beats toolbar rules like `.tools button` and `.float-bar button` */
    .fs-picker .fs-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 30px;
        height: 30px;
        padding: 0;
        border: none;
        border-radius: var(--radius);
        background: none;
        color: var(--text-3);
        cursor: pointer;
        font-family: var(--sans);
        font-weight: 600;
        line-height: 1;
        /* Trim the line box to the cap height, so the "A" centers by its visible shape, not its font box */
        text-box: trim-both cap alphabetic;
        transition: background 0.12s, color 0.12s;
    }
    :is(.float-bar, .tools) .fs-picker .fs-btn { height: 32px; border-radius: var(--radius-md); }
    /* px, not rem: the picker must not resize itself when the text size changes */
    .fs-picker .fs-btn[data-size="small"] { font-size: 12px; }
    .fs-picker .fs-btn[data-size="medium"] { font-size: 15px; }
    .fs-picker .fs-btn[data-size="large"] { font-size: 18px; }
    .fs-picker .fs-btn:hover { background: var(--hover); color: var(--text); }
    .fs-picker .fs-btn.active { background: var(--accent-soft); color: var(--accent); }
    /* theme:font-size:end */

    * { margin: 0; padding: 0; }
    body { background: var(--surface); padding: 1.5rem var(--gutter); }
    .frame { width: 100%; margin: 0 auto; }
    /* text stays at the reading width; only the diagram is full width */
    div.frame > :not(.diagram) { max-width: var(--page-w); margin-inline: auto; }
    .eyebrow { font-size: var(--fs-body); color: var(--text-3); margin-bottom: 0.25rem; }
    h1 { font-size: var(--fs-h1); font-weight: 600; letter-spacing: -0.015em; line-height: 1.15; margin-bottom: 1rem; }
    /* Drawn at 1:1 (every label 14px), never scaled; a narrow window scrolls the diagram, not the page. */
    .diagram { overflow-x: auto; }
    .diagram svg { display: block; max-width: none; height: auto; margin: 0 auto; font-family: var(--sans); }
    @media (max-width: 640px) { body { padding: 1.5rem 1rem; } }
    .connector { fill: none; stroke: var(--connector); stroke-width: 1.6; }
    .arrowhead { fill: var(--connector); }
    .exit { fill: var(--text-3); font-size: var(--fs-dia-sub); }
    .edge-label-background { fill: var(--surface); }
    .node text { fill: var(--text); font-size: var(--fs-dia); font-weight: 600; text-anchor: middle; }
    .node .detail { fill: var(--text-2); font-family: var(--mono); font-size: var(--fs-dia-sub); font-weight: 400; }
    .pill { fill: var(--bg); stroke: var(--line-3); stroke-width: 1.4; }
    .box { fill: var(--surface-3); stroke: var(--line-strong); stroke-width: 1.2; }
    .decision { fill: var(--accent-fill); stroke: var(--accent); stroke-width: 1.4; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flow 01 · Flowchart</p>
    <h1>Example flow</h1>
    <div class="diagram">
      <svg viewBox="0 0 760 376" width="760" height="376" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="example-flow-chart-title example-flow-chart-desc">
        <title id="example-flow-chart-title">Example flow: flowchart, 7 nodes</title>
        <desc id="example-flow-chart-desc">Open the form, check the thing.edit permission, validate the name, save it with CreateThing as ACTIVE, or show INVALID_ARGUMENT and retry.</desc>
        <defs>
          <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker>
        </defs>
        <!-- Connectors first, behind nodes. The retry loop enters "Name valid?" on its own edge, not on the Yes connector. -->
        <g class="connector" marker-end="url(#ah)">
          <path d="M380,56 V84"/>
          <path d="M500,134 H578"/>
          <path d="M380,182 V214"/>
          <path d="M500,264 H578"/>
          <path d="M260,264 H202"/>
          <path d="M660,290 V316"/>
          <path d="M120,236 V200 H325 V234"/>
        </g>
        <!-- Exit labels center on their segment's midpoint (data-cx): above a level segment, on a vertical one.
             The page script sizes each box to its text. -->
        <g class="edge-label" data-cx="539"><rect class="edge-label-background" x="525" y="114" width="28" height="16" rx="3"/><text class="exit" x="539" y="126" text-anchor="middle">No</text></g>
        <g class="edge-label" data-cx="380"><rect class="edge-label-background" x="364" y="190" width="32" height="16" rx="3"/><text class="exit" x="380" y="202" text-anchor="middle">Yes</text></g>
        <g class="edge-label" data-cx="539"><rect class="edge-label-background" x="523" y="244" width="32" height="16" rx="3"/><text class="exit" x="539" y="256" text-anchor="middle">Yes</text></g>
        <g class="edge-label" data-cx="231"><rect class="edge-label-background" x="217" y="244" width="28" height="16" rx="3"/><text class="exit" x="231" y="256" text-anchor="middle">No</text></g>
        <g class="edge-label" data-cx="222.5"><rect class="edge-label-background" x="202" y="180" width="41" height="16" rx="3"/><text class="exit" x="222.5" y="192" text-anchor="middle">Retry</text></g>
        <g class="node"><rect class="pill" x="300" y="12" width="160" height="44" rx="22"/><text x="380" y="30">Open the form</text><text class="detail" x="380" y="48">/things/:id</text></g>
        <g class="node"><polygon class="decision" points="380,86 500,134 380,182 260,134"/><text x="380" y="129">Can edit?</text><text class="detail" x="380" y="149">thing.edit</text></g>
        <g class="node"><rect class="pill" x="580" y="112" width="160" height="44" rx="22"/><text x="660" y="130">No Edit button</text><text class="detail" x="660" y="148">read-only view</text></g>
        <g class="node"><polygon class="decision" points="380,216 500,264 380,312 260,264"/><text x="380" y="259">Name valid?</text><text class="detail" x="380" y="279">name max 64 chars</text></g>
        <g class="node"><rect class="box" x="40" y="238" width="160" height="52" rx="8"/><text x="120" y="259">Show error</text><text class="detail" x="120" y="279">INVALID_ARGUMENT</text></g>
        <g class="node"><rect class="box" x="580" y="238" width="160" height="52" rx="8"/><text x="660" y="259">Save record</text><text class="detail" x="660" y="279">CreateThing</text></g>
        <g class="node"><rect class="pill" x="580" y="318" width="160" height="44" rx="22"/><text x="660" y="336">Saved</text><text class="detail" x="660" y="354">status = ACTIVE</text></g>
      </svg>
    </div>
  </div>
  <script>
    /* theme:pdf-js:start */
    /* Synced from theme/pdf.js by theme/sync.mjs. Do not edit here. */
    function addExportPdf(target, prepare) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'export-pdf no-print';
        if (!target) {
            target = document.querySelector('.float-bar');
            if (!target) { target = document.createElement('div'); target.className = 'float-bar no-print'; document.body.append(target); }
        }
        button.title = 'Export PDF (pick "Save as PDF" in the print dialog)';
        button.textContent = 'Export PDF';
        button.addEventListener('click', async () => {
            if (prepare) await prepare();
            window.print();
        });
        target.append(button);
        return button;
    }
    /* theme:pdf-js:end */
    /* theme:font-size-js:start */
    /* Synced from theme/font-size.js by theme/sync.mjs. Do not edit here. */
    const FONT_SIZE_KEY = 'naphatwx-font-size';
    function applyFontSize(size) {
        if (size === 'small' || size === 'large') document.documentElement.dataset.fs = size;
        else delete document.documentElement.dataset.fs;
        document.querySelectorAll('.fs-btn').forEach((button) => {
            const on = button.dataset.size === (size === 'small' || size === 'large' ? size : 'medium');
            button.classList.toggle('active', on);
            button.setAttribute('aria-pressed', String(on));
        });
    }
    try { applyFontSize(localStorage.getItem(FONT_SIZE_KEY)); } catch {}
    addEventListener('storage', (event) => { if (event.key === FONT_SIZE_KEY) applyFontSize(event.newValue); });
    function addFontSize(target) {
        if (!target) {
            target = document.querySelector('.float-bar');
            if (!target) { target = document.createElement('div'); target.className = 'float-bar no-print'; document.body.append(target); }
        }
        const picker = document.createElement('div');
        picker.className = 'fs-picker no-print';
        picker.setAttribute('role', 'group');
        picker.setAttribute('aria-label', 'Text size');
        for (const [size, label] of [['small', 'Small'], ['medium', 'Medium'], ['large', 'Large']]) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'fs-btn';
            button.dataset.size = size;
            button.title = label + ' text';
            button.setAttribute('aria-label', label + ' text');
            button.textContent = 'A';
            button.addEventListener('click', () => {
                applyFontSize(size);
                try { localStorage.setItem(FONT_SIZE_KEY, size); } catch {}
            });
            picker.append(button);
        }
        target.append(picker);
        applyFontSize(document.documentElement.dataset.fs);
        return picker;
    }
    /* theme:font-size-js:end */
    /* theme:diagram-labels-js:start */
    /* Synced from theme/diagram-labels.js by theme/sync.mjs. Do not edit here. */
    function fitDiagramLabels(root = document) {
        const PAD = 6, GAP = 4, roundTo1 = value => Math.round(value * 10) / 10;
        let done = true;
        root.querySelectorAll('g.edge-label').forEach(group => {
            const text = group.querySelector(':scope > text');
            if (!text) return;
            const width = text.getComputedTextLength();
            // 0: not laid out yet (a hidden panel or frame), so the next call fits it
            if (!width) { done = false; return; }
            let centerX = parseFloat(group.dataset.cx);
            if (Number.isNaN(centerX)) {
                const x = text.x.baseVal[0]?.value || 0, anchor = getComputedStyle(text).textAnchor;
                centerX = anchor === 'start' ? x + width / 2 : anchor === 'end' ? x - width / 2 : x;
            }
            text.setAttribute('x', roundTo1(centerX));
            text.setAttribute('text-anchor', 'middle');
            const left = centerX - width / 2 - PAD;
            const background = group.querySelector(':scope > .edge-label-background');
            if (background) { background.setAttribute('x', roundTo1(left)); background.setAttribute('width', roundTo1(width + 2 * PAD)); }
            const badge = group.querySelector(':scope > .edge-label-number');
            if (badge) {
                badge.removeAttribute('transform');
                try {
                    const box = badge.getBBox();
                    badge.setAttribute('transform', `translate(${roundTo1(left - GAP - (box.x + box.width))} 0)`);
                } catch { done = false; }
            }
        });
        return done;
    }
    /* theme:diagram-labels-js:end */
    /* theme:diagram-embed-js:start */
    /* Synced from theme/diagram-embed.js by theme/sync.mjs. Do not edit here. */
    (function () {
        const embedded = parent !== window;
        const style = document.createElement('style');
        // Embedded, the bottom padding stays: the fixed Export PDF bar sits in it, under the drawing.
        // Print: each drawing shrinks to the page width instead of being cut off.
        style.textContent = `* { scrollbar-width: thin; scrollbar-color: #5c6069 transparent; }
            .embedded body { padding: 1rem 1rem var(--float-space, 1rem); }
            .embedded .eyebrow, .embedded h1 { display: none; }
            @media print { svg[viewBox]:not(svg svg) { max-width: 100% !important; height: auto !important; } }`;
        document.head.append(style);
        if (embedded) { document.documentElement.classList.add('embedded'); document.documentElement.style.overflowY = 'hidden'; }
        // Each diagram draws at its viewBox width, never scaled, so labels render at their own size; a narrow frame scrolls it sideways.
        const svgs = [...document.querySelectorAll('svg[viewBox]:not(svg svg)')];
        svgs.forEach(svg => {
            Object.assign(svg.style, { width: svg.viewBox.baseVal.width + 'px', maxWidth: 'none', height: 'auto' });
            if (getComputedStyle(svg.parentElement).overflowX === 'auto') return;
            const box = document.createElement('div');
            box.style.overflowX = 'auto';
            svg.before(box);
            box.append(svg);
        });
        if (!embedded) addFontSize();
        addExportPdf();
        // height: the body's box, padding included, not documentElement, whose scrollHeight never drops below the frame's height;
        // width: the widest drawing at 1:1 plus padding, so a lightbox can show it whole, scaled
        const postSize = () => {
            if (!embedded) return;
            const bodyStyle = getComputedStyle(document.body);
            const width = Math.max(0, ...svgs.map(s => s.viewBox.baseVal.width)) + parseFloat(bodyStyle.paddingLeft) + parseFloat(bodyStyle.paddingRight);
            parent.postMessage({ type: 'diagram-height', height: document.body.getBoundingClientRect().height, width }, '*');
        };
        const refresh = () => { fitDiagramLabels(); postSize(); };
        addEventListener('load', refresh);
        document.fonts?.ready.then(refresh);
        new ResizeObserver(refresh).observe(document.body);
    })();
    /* theme:diagram-embed-js:end */
  </script>
</body>
</html>
