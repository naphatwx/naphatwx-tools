<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sequence diagrams · Feature Name</title>
    <style>
        /* Standalone viewer for manual-mode sequence files; same .seq styles as design-feature's overview. */
        /* theme:tokens:start */
        /* Synced from theme/tokens.css by theme/sync.mjs. Do not edit here. */
        :root {
            color-scheme: dark;

            /* Surfaces, darkest first */
            --bg: #121316;
            --surface: #18191d;
            --surface-2: #1f2025;
            --surface-3: #24262c;
            --line: #26282e;
            --line-strong: #363940;
            --line-3: #4a4d55;

            /* Ink. Running text is --text; text-2 / text-3 are for chrome and meta labels only */
            --text: #e2e3e7;
            --text-2: #c6c8cf;
            --text-3: #a3a6b0;

            /* One accent */
            --accent: #8ab0ff;
            --accent-fill: #1b2232;
            --accent-soft: rgba(138, 176, 255, 0.12);

            /* Status: one hue set, two meanings. ok = add / pass, warn = change / flaky, bad = drop / fail */
            --ok: #8fd694;
            --warn: #f0c26b;
            --bad: #f28b8d;
            --neutral: #a3a6b0;
            --ok-soft: rgba(143, 214, 148, 0.12);
            --warn-soft: rgba(240, 194, 107, 0.12);
            --bad-soft: rgba(242, 139, 141, 0.12);
            --neutral-soft: rgba(163, 166, 176, 0.12);
            --add: var(--ok);
            --change: var(--warn);
            --drop: var(--bad);

            /* Diagrams: connectors and their labels */
            --connector: #6b6e78;

            /* Type. ui-monospace first, or macOS Chromium falls back to Courier */
            --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Cascadia Code", monospace;

            /* Type scale. Body text is --fs-md on every page; code and pills --fs-sm. Reports use only
               --fs-lg (title), --fs-md and --fs-sm. Nothing renders below --fs-xs. */
            --fs-xs: 0.75rem;
            --fs-sm: 0.875rem;
            --fs-md: 1rem;
            --fs-lg: 1.25rem;
            --fs-xl: 1.5rem;
            --fs-2xl: 2rem;
            /* Headings and lead line: the same steps on every page */
            --fs-lead: var(--fs-lg);
            --fs-h3: var(--fs-lg);
            --fs-h2: var(--fs-xl);
            --fs-h1: var(--fs-2xl);

            /* Page frame: every page centers its content at the same width, 80% of the window up to 900px */
            --page-w: min(80%, 900px);
            --gutter: clamp(16px, 3vw, 24px);

            --radius: 6px;
            --radius-lg: 10px;
            --ease: cubic-bezier(0.2, 0, 0, 1);
        }
        /* theme:tokens:end */
        /* theme:base:start */
        /* Synced from theme/base.css by theme/sync.mjs. Do not edit here. */
        *, *::before, *::after { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            -webkit-font-smoothing: antialiased;
        }
        ::selection { background: rgba(138, 176, 255, 0.35); color: #fff; }
        * { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
        a { color: var(--accent); }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        code, kbd, pre, samp { font-family: var(--mono); }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
        }
        /* theme:base:end */
        /* theme:pdf:start */
        /* Synced from theme/pdf.css by theme/sync.mjs. Do not edit here. */
        .export-pdf-float {
            position: fixed;
            right: 16px;
            bottom: 16px;
            z-index: 50;
            padding: 6px 12px;
            font: inherit;
            font-size: var(--fs-sm);
            color: var(--text);
            background: var(--surface-2);
            border: 1px solid var(--line-strong);
            border-radius: var(--radius);
            cursor: pointer;
        }
        .export-pdf-float:hover { background: var(--surface-3); }
        @page { margin: 0; }
        @media print {
            html, body { background: var(--bg); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .no-print { display: none !important; }
            pre, figure, img, svg, tr { break-inside: avoid; }
            h1, h2, h3 { break-after: avoid; }
        }
        /* theme:pdf:end */

        * { margin: 0; padding: 0; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 8px; }

        body { padding: 20px var(--gutter) 32px; }
        main { margin: 0 auto; }
        /* text stays at the reading width; only the diagram is full width */
        main > :not(.seq) { max-width: var(--page-w); margin-inline: auto; }
        header { margin-bottom: 8px; }
        h1 { font-size: var(--fs-h1); }
        h2 { font-size: var(--fs-h2); margin-top: 20px; }
        code { font-size: var(--fs-sm); }

        /* ============ SEQUENCE DIAGRAM (.seq) ============ */
        .seq {
            border: 1px solid var(--line);
            background: var(--surface);
            border-radius: 12px;
            padding: 8px;
            margin: 12px 0;
            overflow-x: auto;
        }

        /* render.js sets the SVG's width and height: it draws at 1:1, so every label renders at 14px; a wider one scrolls. */
        .seq svg { display: block; max-width: none; margin: 0 auto; font-family: var(--sans); }
        .seq .actor rect { fill: var(--surface-2); stroke: var(--line-strong); }
        .seq .actor text { fill: var(--text); font-size: var(--fs-sm); font-weight: 600; }
        .seq .actor .sub { fill: var(--text-3); font-size: var(--fs-sm); font-weight: 400; }
        .seq .life { stroke: var(--line-strong); stroke-dasharray: 3 4; }
        .seq .msg { stroke: var(--text-2); stroke-width: 1.4; fill: none; }
        .seq .msg.ret { stroke-dasharray: 5 4; stroke: var(--text-3); }
        .seq .msg.hot { stroke: var(--accent); stroke-width: 1.8; }
        .seq .lbl { fill: var(--text-2); font-size: var(--fs-sm); font-family: var(--mono); }
        .seq .lbl.hot { fill: var(--accent); }
        .seq .num { fill: var(--text-3); font-size: var(--fs-sm); font-weight: 600; }
        .seq .phase line { stroke: var(--line); }
        .seq .phase rect { fill: var(--surface-2); }
        .seq .phase text { fill: var(--text-2); font-size: var(--fs-sm); font-weight: 600; }
        .seq .note rect { fill: var(--bg); stroke: var(--line-strong); }
        .seq .note text { fill: var(--text-2); font-size: var(--fs-sm); font-family: var(--mono); }
        .seq .frame rect.box { fill: none; stroke: var(--line-strong); stroke-width: 1.2; }
        .seq .frame rect.tab { fill: var(--surface-2); stroke: var(--line-strong); }
        .seq .frame text { fill: var(--text); font-size: var(--fs-sm); font-weight: 700; }
        .seq .frame .cond { fill: var(--text-3); font-weight: 500; font-style: italic; }
        .seq .frame line { stroke: var(--line-strong); stroke-dasharray: 6 4; }
        .seq .ah { fill: var(--text-2); }
        .seq .ah.ret { fill: var(--text-3); }
        .seq .ah.hot { fill: var(--accent); }
        .seq .step { cursor: default; }
        .seq-steps { margin-top: 8px; font-size: var(--fs-md); color: var(--text-2); }
        .seq-steps-title { margin: 0; color: var(--text-3); font-weight: 600; }
        .seq-steps ol { list-style: none; padding: 0 !important; margin: 8px 0 0; }
        .seq-steps li { padding: 2px 0 2px 30px; text-indent: -30px; }
        .seq-steps .n { display: inline-block; width: 22px; margin-right: 8px; text-indent: 0; color: var(--text-3); font-weight: 600; text-align: right; }

        .seq-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            font-size: var(--fs-sm);
            color: var(--text-3);
            /* inside the diagram box, at the text width */
            max-width: var(--page-w);
            margin: 12px auto 4px;
        }

        .seq-legend span::before {
            content: "";
            display: inline-block;
            width: 26px;
            vertical-align: middle;
            margin-right: 6px;
            border-top: 2px solid var(--text-2);
        }

        .seq-legend .ret::before { border-top-style: dashed; border-color: var(--text-3); }
        .seq-legend .hot::before { border-color: var(--accent); }

        /* PDF: shrink each diagram to the page width instead of cutting it off. */
        @media print {
            .seq { overflow: visible; break-inside: avoid; }
            .seq svg { max-width: 100%; height: auto; }
        }
    </style>
</head>

<body>
    <main>
        <header>
            <h1>Sequence diagrams · Feature Name</h1>
        </header>

        <!-- one h2 + .seq per flow file; the .seq-legend inside stays under the drawing -->
        <h2>1. Example flow</h2>
        <div class="seq" data-flow="01-example-flow">
            <div class="seq-legend">
                <span>call</span>
                <span class="ret">response</span>
                <span class="hot">side effect (external write / audit)</span>
            </div>
        </div>
    </main>

    <script src="render.js"></script>
    <script src="01-example-flow.js"></script>
    <script>
        /* theme:pdf-js:start */
        /* Synced from theme/pdf.js by theme/sync.mjs. Do not edit here. */
        function addExportPdf(target, prepare) {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'export-pdf no-print' + (target ? '' : ' export-pdf-float');
            b.title = 'Export PDF (pick "Save as PDF" in the print dialog)';
            b.textContent = 'Export PDF';
            b.addEventListener('click', async () => {
                if (prepare) await prepare();
                window.print();
            });
            (target || document.body).append(b);
            return b;
        }
        /* theme:pdf-js:end */
        SeqDiagrams.renderAll();
        addExportPdf();
    </script>
</body>

</html>
