<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sequence diagrams · Feature Name</title>
    <style>
        /* Standalone viewer for manual-mode sequence files; same .sequence styles as design-feature's overview. */
        /* theme:tokens:start */
        /* Synced from theme/tokens.css by theme/sync.mjs. Do not edit here. */
        :root {
            color-scheme: dark;

            /* Surfaces, darkest first */
            --bg: #121316;
            --surface: #18191d;
            --surface-2: #1f2025;
            --surface-3: #24262c;
            --line: #4a4d55;
            --line-strong: #5c6069;
            --line-3: #70737d;
            /* Hover fill for every control: a clear step up from any surface. Hover never changes the border */
            --hover: #33353b;

            /* Ink. Running text is --text; text-2 / text-3 are for chrome and meta labels only */
            --text: #e2e3e7;
            --text-2: #c6c8cf;
            --text-3: #a3a6b0;

            /* One accent */
            --accent: #8ab0ff;
            --accent-fill: #1b2232;
            --accent-soft: rgba(138, 176, 255, 0.12);

            /* Status: one hue set, two meanings. ok = add / pass, warn = change / flaky, bad = drop / fail */
            --ok: #8fd694;
            --warn: #f0c26b;
            --bad: #f28b8d;
            --neutral: #a3a6b0;
            --ok-soft: rgba(143, 214, 148, 0.12);
            --warn-soft: rgba(240, 194, 107, 0.12);
            --bad-soft: rgba(242, 139, 141, 0.12);
            --neutral-soft: rgba(163, 166, 176, 0.12);
            --add: var(--ok);
            --change: var(--warn);
            --drop: var(--bad);

            /* Diagrams: connectors and their labels */
            --connector: #6b6e78;

            /* Type. ui-monospace first, or macOS Chromium falls back to Courier */
            --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Cascadia Code", monospace;

            /* Type scale. Nothing renders below --fs-xs. Pages set font sizes by role (below), not by step. */
            --fs-xs: 0.75rem;
            --fs-sm: 0.875rem;
            --fs-md: 1rem;
            --fs-lg: 1.25rem;
            --fs-xl: 1.5rem;
            --fs-2xl: 2rem;
            /* Headings and lead line: the same steps on every page */
            --fs-lead: var(--fs-lg);
            --fs-h3: var(--fs-lg);
            --fs-h2: var(--fs-xl);
            --fs-h1: var(--fs-2xl);
            /* Roles: one step down per role, so the eye lands on body text first.
               body = running text, tables, buttons, action bars · meta = hints, asides, legends, captions, code · tag = pills, kbd, counts */
            --fs-body: var(--fs-md);
            --fs-meta: var(--fs-sm);
            --fs-code: var(--fs-sm);
            --fs-tag: var(--fs-xs);
            /* Diagrams draw at 1:1 with shapes sized for 14px: main labels 14, secondary lines (detail, sub, note, type) 12 */
            --fs-dia: var(--fs-sm);
            --fs-dia-sub: var(--fs-xs);

            /* Max widths: Tailwind max-w steps (md 448px, 3xl 768px, 4xl 896px, 5xl 1024px, 6xl 1152px, 7xl 1280px). Use these, not raw px */
            --max-w-md: 28rem;
            --max-w-3xl: 48rem;
            --max-w-4xl: 56rem;
            --max-w-5xl: 64rem;
            --max-w-6xl: 72rem;
            --max-w-7xl: 80rem;

            /* Page frame: every page centers its content at the same width, 80% of the window up to --max-w-3xl */
            --page-w: min(80%, var(--max-w-3xl));
            --gutter: clamp(16px, 3vw, 24px);

            --radius: 6px;
            --radius-md: 8px;
            --radius-lg: 10px;
            --radius-xl: 12px;
            --ease: cubic-bezier(0.2, 0, 0, 1);
        }
        /* theme:tokens:end */
        /* theme:base:start */
        /* Synced from theme/base.css by theme/sync.mjs. Do not edit here. */
        *, *::before, *::after { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            -webkit-font-smoothing: antialiased;
        }
        ::selection { background: rgba(138, 176, 255, 0.35); color: #fff; }
        * { scrollbar-width: auto; scrollbar-color: var(--line-3) transparent; }
        a { color: var(--accent); }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        code, kbd, pre, samp { font-family: var(--mono); }
        /* Label over a group (section, field, table column, step list): uppercase at meta size, tracked so caps stay readable */
        .label, th, dt { color: var(--text-2); font-size: var(--fs-meta); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
        /* Data inside a label (counts, names, notes, controls) keeps its own case */
        :is(.label, th, dt) :is(.label-note, button, input, kbd, code) { text-transform: none; letter-spacing: normal; }
        .label-note { font-weight: 400; }
        /* Scenario kind: basic (the main path), alternate (another path to the goal), exception (goal not reached) */
        .scenario-kind { font: 500 var(--fs-tag)/1.5 var(--mono); text-transform: uppercase; color: var(--text-2); }
        .scenario-kind.basic { color: var(--accent); }
        .scenario-kind.exception { color: var(--warn); }
        /* trace IDs hide behind a "N refs" chip; a click shows them on the same line */
        .references-chip { flex: none; padding: 1px 8px; font: var(--fs-tag)/1.5 var(--mono); color: var(--text-2); background: none; border: 1px solid var(--line-strong); border-radius: 999px; cursor: pointer; }
        .references-chip:hover { background: var(--hover); }
        .references-chip[aria-expanded="true"] { color: var(--accent); border-color: var(--accent); }
        .references-chip[aria-expanded="false"] + .references-ids { display: none; }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
        }
        /* theme:base:end */
        /* theme:pdf:start */
        /* Synced from theme/pdf.css by theme/sync.mjs. Do not edit here. */
        /* .float-bar: one long box at the bottom right; Export PDF goes last, page tools can sit before it */
        .float-bar { position: fixed; right: 20px; bottom: 20px; z-index: 50; display: flex; gap: 2px; padding: 4px; background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: var(--radius-xl); }
        .float-bar button { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border: 0; border-radius: var(--radius-md); background: none; color: var(--text-2); font: 500 var(--fs-body) var(--sans); white-space: nowrap; cursor: pointer; }
        .float-bar button:hover { background: var(--hover); color: var(--text); }
        /* Room under the last line so the bar never hides it: bar 42px + its 20px offset + a 14px gap.
           An embedded diagram posts its body height with this padding, so the host frame keeps the room too. */
        body:has(.float-bar) { --float-space: 76px; padding-bottom: var(--float-space); }
        @page { margin: 0; }
        @media print {
            html, body { background: var(--bg); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .no-print { display: none !important; }
            body:has(.float-bar) { --float-space: 0px; padding-bottom: 0; }
            pre, figure, img, svg, tr { break-inside: avoid; }
            h1, h2, h3 { break-after: avoid; }
            .references-chip { display: none !important; }
            .references-ids { display: inline !important; }
        }
        /* theme:pdf:end */

        * { margin: 0; padding: 0; }
        /* theme:scrollbar:start */
        /* Synced from theme/scrollbar.css by theme/sync.mjs. Do not edit here. */
        ::-webkit-scrollbar { width: 12px; height: 12px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--line-3); border-radius: var(--radius-md); }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-3); }
        /* theme:scrollbar:end */

        body { padding: 20px var(--gutter) 32px; }
        main { margin: 0 auto; }
        /* text stays at the reading width; only the diagram is full width */
        main > :not(.sequence) { max-width: var(--page-w); margin-inline: auto; }
        header { margin-bottom: 8px; }
        h1 { font-size: var(--fs-h1); }
        h2 { font-size: var(--fs-h2); margin-top: 20px; }
        code { font-size: var(--fs-sm); }

        /* ============ SEQUENCE DIAGRAM (.sequence) ============ */
        .sequence {
            border: 1px solid var(--line);
            background: var(--surface);
            border-radius: var(--radius-xl);
            padding: 8px;
            margin: 12px 0;
            overflow-x: auto;
        }

        /* render.js sets the SVG's width and height: it draws at 1:1, so every label renders at 14px; a wider one scrolls. */
        .sequence svg { display: block; max-width: none; margin: 0 auto; font-family: var(--sans); }
        /* theme:seq:start */
        /* Synced from theme/seq.css by theme/sync.mjs. Do not edit here. */
        .sequence .actor rect { fill: var(--surface-2); stroke: var(--line-strong); }
        .sequence .actor text { fill: var(--text); font-size: var(--fs-dia); font-weight: 600; }
        .sequence .actor .subtitle { fill: var(--text-3); font-size: var(--fs-dia-sub); font-weight: 400; }
        .sequence .lifeline { stroke: var(--line-strong); stroke-dasharray: 3 4; }
        .sequence .message { stroke: var(--text-2); stroke-width: 1.4; fill: none; }
        .sequence .message.return { stroke-dasharray: 5 4; stroke: var(--text-3); }
        .sequence .message.hot { stroke: var(--accent); stroke-width: 1.8; }
        .sequence .label-text { fill: var(--text-2); font-size: var(--fs-dia); font-family: var(--mono); }
        .sequence .label-text.hot { fill: var(--accent); }
        .sequence .edge-label-background { fill: var(--surface); }
        .sequence .number { fill: var(--text-3); font-size: var(--fs-dia-sub); font-weight: 600; }
        .sequence .phase line { stroke: var(--line); }
        .sequence .phase rect { fill: var(--surface-2); }
        .sequence .phase text { fill: var(--text-2); font-size: var(--fs-dia-sub); font-weight: 600; }
        .sequence .note rect { fill: var(--bg); stroke: var(--line-strong); }
        .sequence .note text { fill: var(--text-2); font-size: var(--fs-dia-sub); font-family: var(--mono); }
        .sequence .frame rect.box { fill: none; stroke: var(--line-strong); stroke-width: 1.2; }
        .sequence .frame rect.tab { fill: var(--surface-2); stroke: var(--line-strong); }
        .sequence .frame text { fill: var(--text); font-size: var(--fs-dia-sub); font-weight: 700; }
        .sequence .frame .condition { fill: var(--text-3); font-weight: 500; font-style: italic; }
        .sequence .frame line { stroke: var(--line-strong); stroke-dasharray: 6 4; }
        .sequence .arrowhead { fill: var(--text-2); }
        .sequence .arrowhead.return { fill: var(--text-3); }
        .sequence .arrowhead.hot { fill: var(--accent); }
        /* theme:seq:end */
        .sequence .step { cursor: default; }
        .sequence-steps { margin-top: 8px; font-size: var(--fs-meta); color: var(--text-2); }
        .sequence-steps-title { margin: 0; }
        .sequence-steps ol { list-style: none; padding: 0 !important; margin: 8px 0 0; }
        .sequence-steps li { padding: 2px 0 2px 30px; text-indent: -30px; }
        .sequence-steps .number { display: inline-block; width: 22px; margin-right: 8px; text-indent: 0; color: var(--text-3); font-weight: 600; text-align: right; }

        .sequence-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            font-size: var(--fs-meta);
            color: var(--text-3);
            justify-content: center;
            margin: 12px 0 4px;
        }

        .sequence-legend span::before {
            content: "";
            display: inline-block;
            width: 26px;
            vertical-align: middle;
            margin-right: 6px;
            border-top: 2px solid var(--text-2);
        }

        .sequence-legend .return::before { border-top-style: dashed; border-color: var(--text-3); }
        .sequence-legend .hot::before { border-color: var(--accent); }

        /* PDF: shrink each diagram to the page width instead of cutting it off. */
        @media print {
            .sequence { overflow: visible; break-inside: avoid; }
            .sequence svg { max-width: 100%; height: auto; }
        }
    </style>
</head>

<body>
    <main>
        <header>
            <h1>Sequence diagrams · Feature Name</h1>
        </header>

        <!-- one h2 + .sequence per flow file; the .sequence-legend inside stays under the drawing -->
        <h2>1. Example flow</h2>
        <div class="sequence" data-flow="01-example-flow">
            <div class="sequence-legend">
                <span>call</span>
                <span class="return">response</span>
                <span class="hot">side effect (external write / audit)</span>
            </div>
        </div>
    </main>

    <script src="render.js"></script>
    <script src="01-example-flow.js"></script>
    <script>
        /* theme:pdf-js:start */
        /* Synced from theme/pdf.js by theme/sync.mjs. Do not edit here. */
        function addExportPdf(target, prepare) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'export-pdf no-print';
            if (!target) {
                target = document.querySelector('.float-bar');
                if (!target) { target = document.createElement('div'); target.className = 'float-bar no-print'; document.body.append(target); }
            }
            button.title = 'Export PDF (pick "Save as PDF" in the print dialog)';
            button.textContent = 'Export PDF';
            button.addEventListener('click', async () => {
                if (prepare) await prepare();
                window.print();
            });
            target.append(button);
            return button;
        }
        /* theme:pdf-js:end */
        SeqDiagrams.renderAll();
        addExportPdf();
    </script>
</body>

</html>
