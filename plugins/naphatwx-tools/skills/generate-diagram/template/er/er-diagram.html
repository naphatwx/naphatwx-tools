<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ER diagram · Feature Name</title>
    <style>
        /* theme:tokens:start */
        /* Synced from theme/tokens.css by theme/sync.mjs. Do not edit here. */
        :root {
            color-scheme: dark;

            /* Surfaces, darkest first */
            --bg: #121316;
            --surface: #18191d;
            --surface-2: #1f2025;
            --surface-3: #24262c;
            --line: #26282e;
            --line-strong: #363940;
            --line-3: #4a4d55;
            /* Hover fill for every control: a clear step up from any surface. Hover never changes the border */
            --hover: #33353b;

            /* Ink. Running text is --text; text-2 / text-3 are for chrome and meta labels only */
            --text: #e2e3e7;
            --text-2: #c6c8cf;
            --text-3: #a3a6b0;

            /* One accent */
            --accent: #8ab0ff;
            --accent-fill: #1b2232;
            --accent-soft: rgba(138, 176, 255, 0.12);

            /* Status: one hue set, two meanings. ok = add / pass, warn = change / flaky, bad = drop / fail */
            --ok: #8fd694;
            --warn: #f0c26b;
            --bad: #f28b8d;
            --neutral: #a3a6b0;
            --ok-soft: rgba(143, 214, 148, 0.12);
            --warn-soft: rgba(240, 194, 107, 0.12);
            --bad-soft: rgba(242, 139, 141, 0.12);
            --neutral-soft: rgba(163, 166, 176, 0.12);
            --add: var(--ok);
            --change: var(--warn);
            --drop: var(--bad);

            /* Diagrams: connectors and their labels */
            --connector: #6b6e78;

            /* Type. ui-monospace first, or macOS Chromium falls back to Courier */
            --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Cascadia Code", monospace;

            /* Type scale. Nothing renders below --fs-xs. Pages set font sizes by role (below), not by step. */
            --fs-xs: 0.75rem;
            --fs-sm: 0.875rem;
            --fs-md: 1rem;
            --fs-lg: 1.25rem;
            --fs-xl: 1.5rem;
            --fs-2xl: 2rem;
            /* Headings and lead line: the same steps on every page */
            --fs-lead: var(--fs-lg);
            --fs-h3: var(--fs-lg);
            --fs-h2: var(--fs-xl);
            --fs-h1: var(--fs-2xl);
            /* Roles: one step down per role, so the eye lands on body text first.
               body = running text, tables, buttons, action bars · meta = hints, asides, legends, captions, code · tag = pills, kbd, counts */
            --fs-body: var(--fs-md);
            --fs-meta: var(--fs-sm);
            --fs-code: var(--fs-sm);
            --fs-tag: var(--fs-xs);
            /* Diagrams draw at 1:1 with shapes sized for 14px: main labels 14, secondary lines (detail, sub, note, type) 12 */
            --fs-dia: var(--fs-sm);
            --fs-dia-sub: var(--fs-xs);

            /* Max widths: Tailwind max-w steps (md 448px, 3xl 768px, 4xl 896px, 5xl 1024px, 6xl 1152px, 7xl 1280px). Use these, not raw px */
            --max-w-md: 28rem;
            --max-w-3xl: 48rem;
            --max-w-4xl: 56rem;
            --max-w-5xl: 64rem;
            --max-w-6xl: 72rem;
            --max-w-7xl: 80rem;

            /* Page frame: every page centers its content at the same width, 80% of the window up to --max-w-3xl */
            --page-w: min(80%, var(--max-w-3xl));
            --gutter: clamp(16px, 3vw, 24px);

            --radius: 6px;
            --radius-md: 8px;
            --radius-lg: 10px;
            --radius-xl: 12px;
            --ease: cubic-bezier(0.2, 0, 0, 1);
        }
        /* theme:tokens:end */
        /* theme:base:start */
        /* Synced from theme/base.css by theme/sync.mjs. Do not edit here. */
        *, *::before, *::after { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            -webkit-font-smoothing: antialiased;
        }
        ::selection { background: rgba(138, 176, 255, 0.35); color: #fff; }
        * { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
        a { color: var(--accent); }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        code, kbd, pre, samp { font-family: var(--mono); }
        /* Label over a group (section, field, table column, step list): uppercase at meta size, tracked so caps stay readable */
        .label, th, dt { color: var(--text-2); font-size: var(--fs-meta); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
        /* Data inside a label (counts, names, notes, controls) keeps its own case */
        :is(.label, th, dt) :is(.label-note, button, input, kbd, code) { text-transform: none; letter-spacing: normal; }
        .label-note { font-weight: 400; }
        /* Scenario kind: basic (the main path), alternate (another path to the goal), exception (goal not reached) */
        .scenario-kind { font: 500 var(--fs-tag)/1.5 var(--mono); text-transform: uppercase; color: var(--text-2); }
        .scenario-kind.basic { color: var(--accent); }
        .scenario-kind.exception { color: var(--warn); }
        /* trace IDs hide behind a "N refs" chip; a click shows them on the same line */
        .references-chip { flex: none; padding: 1px 8px; font: var(--fs-tag)/1.5 var(--mono); color: var(--text-2); background: none; border: 1px solid var(--line-strong); border-radius: 999px; cursor: pointer; }
        .references-chip:hover { background: var(--hover); }
        .references-chip[aria-expanded="true"] { color: var(--accent); border-color: var(--accent); }
        .references-chip[aria-expanded="false"] + .references-ids { display: none; }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
        }
        /* theme:base:end */
        /* theme:pdf:start */
        /* Synced from theme/pdf.css by theme/sync.mjs. Do not edit here. */
        /* .float-bar: one long box at the bottom right; Export PDF goes last, page tools can sit before it */
        .float-bar { position: fixed; right: 20px; bottom: 20px; z-index: 50; display: flex; gap: 2px; padding: 4px; background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: var(--radius-xl); }
        .float-bar button { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border: 0; border-radius: var(--radius-md); background: none; color: var(--text-2); font: 500 var(--fs-body) var(--sans); white-space: nowrap; cursor: pointer; }
        .float-bar button:hover { background: var(--hover); color: var(--text); }
        /* Room under the last line so the bar never hides it: bar 42px + its 20px offset + a 14px gap.
           An embedded diagram posts its body height with this padding, so the host frame keeps the room too. */
        body:has(.float-bar) { --float-space: 76px; padding-bottom: var(--float-space); }
        @page { margin: 0; }
        @media print {
            html, body { background: var(--bg); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .no-print { display: none !important; }
            body:has(.float-bar) { --float-space: 0px; padding-bottom: 0; }
            pre, figure, img, svg, tr { break-inside: avoid; }
            h1, h2, h3 { break-after: avoid; }
            .references-chip { display: none !important; }
            .references-ids { display: inline !important; }
        }
        /* theme:pdf:end */

        * { margin: 0; padding: 0; }
        /* theme:scrollbar:start */
        /* Synced from theme/scrollbar.css by theme/sync.mjs. Do not edit here. */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: var(--radius-md); }
        /* theme:scrollbar:end */

        body { padding: 20px var(--gutter) 32px; }
        /* text stays at the reading width; only the diagram is full width */
        body > :not(.canvas) { max-width: var(--page-w); margin-inline: auto; }

        /* theme:page-head:start */
        /* Synced from theme/page-head.css by theme/sync.mjs. Do not edit here. */
        header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
        h1 { font-size: var(--fs-h1); font-weight: 600; letter-spacing: -0.015em; }
        .subtitle { color: var(--text-3); font-size: var(--fs-meta); margin-top: 2px; }
        .actions { display: flex; gap: 8px; }

        .button {
            font: inherit;
            font-size: var(--fs-body);
            color: var(--text-2);
            background: var(--surface-2);
            border: 1px solid var(--line-strong);
            border-radius: var(--radius-md);
            padding: 6px 12px;
            cursor: pointer;
            text-decoration: none;
        }

        .button:hover { color: var(--text); background: var(--hover); }
        /* theme:page-head:end */
        header { margin: 0 auto 12px; }

        .canvas {
            margin: 0 auto;
            border: 1px solid var(--line);
            border-radius: var(--radius-xl);
            background: var(--surface);
            overflow-x: auto;
            padding: 12px;
        }

        /* render() sets the SVG's width and height: it draws at 1:1, so every label renders at 14px; a wider one scrolls. */
        .canvas svg { display: block; max-width: none; margin: 0 auto; font-family: var(--sans); }

        /* inside the canvas, under the svg */
        .legend {
            justify-content: center;
            margin: 10px 0 0;
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            font-size: var(--fs-sm);
            color: var(--text-3);
        }

        .legend .foreign-key { height: 0; border-width: 1.5px 0 0; border-radius: 0; }
        .legend .foreign-key.add { box-shadow: none; background: none; }

        /* theme:diff:start */
        /* Synced from theme/diff.css by theme/sync.mjs. Do not edit here. */
        /* Card state shows three ways, not by color alone: a gutter bar, a tinted head and a signed pill */
        .table-card:is(.add, .drop) { position: relative; }
        .table-card.add { border-color: var(--add); }
        .table-card.drop { border-color: var(--drop); }
        .table-card.external { border-style: dashed; }
        .table-card:is(.add, .drop)::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--add); }
        .table-card.drop::before { background: var(--drop); }
        .table-card:is(.add, .drop) :is(.table-card-head, .row) { padding-left: 16px; }
        .table-card.add .table-card-head { background: var(--ok-soft); }
        .table-card.drop .table-card-head { background: var(--bad-soft); }
        .table-card.drop :is(.table-card-head > :first-child, .table-card-name) { text-decoration: line-through; text-decoration-thickness: 1.5px; }
        .table-card.drop .row { opacity: 0.55; }
        .table-card:is(.add, .drop, .change) .tag { align-self: center; padding: 4px 8px; border-radius: 999px; font: 700 var(--fs-tag)/1 var(--sans); text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
        .table-card.add .tag { color: var(--bg); background: var(--add); }
        .table-card.drop .tag { color: var(--bg); background: var(--drop); }
        .table-card.change .tag { padding: 3px 7px; border: 1px solid var(--change); color: var(--change); }
        .table-card.add .tag::before { content: "+ "; }
        .table-card.drop .tag::before { content: "− "; }
        .table-card.change .tag::before { content: "~ "; }
        /* Changed rows: tinted, name and key in the mark's color; a dropped row is struck through */
        .table-card .row.add { background: var(--ok-soft); }
        .table-card .row.change { background: var(--warn-soft); }
        .table-card .row.drop { background: var(--bad-soft); }
        .table-card .row.add :is(.column, .key) { color: var(--add); }
        .table-card .row.change :is(.column, .key) { color: var(--change); }
        .table-card .row.drop :is(.column, .type, .key) { color: var(--drop); }
        .table-card .row.drop :is(.column, .type) { text-decoration: line-through; text-decoration-thickness: 1px; }
        /* Legend swatches */
        .legend i { display: inline-block; width: 22px; height: 12px; margin-right: 6px; vertical-align: middle; border: 1.5px solid var(--line-3); border-radius: 3px; }
        .legend i.add { border-color: var(--add); background: var(--ok-soft); box-shadow: inset 3px 0 var(--add); }
        .legend i.drop { border-color: var(--drop); background: var(--bad-soft); box-shadow: inset 3px 0 var(--drop); }
        .legend i.external { border-style: dashed; }
        /* SVG (ER diagram): the same classes. Text fills with currentColor, so the color rules above apply */
        svg .table-card text { fill: currentColor; }
        svg .table-card-box { fill: var(--surface-2); stroke: var(--line-3); stroke-width: 1.2; }
        svg .table-card:is(.add, .drop) > .table-card-box { stroke: var(--add); stroke-width: 1.6; }
        svg .table-card.drop > .table-card-box { stroke: var(--drop); }
        svg .table-card.external > .table-card-box { stroke-dasharray: 5 4; }
        svg .table-card-head { fill: var(--surface-3); }
        svg .table-card.add > .table-card-head { fill: var(--ok-soft); }
        svg .table-card.drop > .table-card-head { fill: var(--bad-soft); }
        svg .table-card-bar { fill: var(--add); }
        svg .table-card.drop .table-card-bar { fill: var(--drop); }
        svg .tag > rect { fill: none; stroke: var(--change); }
        svg .table-card.add .tag > rect { fill: var(--add); stroke: none; }
        svg .table-card.drop .tag > rect { fill: var(--drop); stroke: none; }
        svg .table-card .row > .row-background { fill: transparent; }
        svg .table-card .row.add > .row-background { fill: var(--ok-soft); }
        svg .table-card .row.change > .row-background { fill: var(--warn-soft); }
        svg .table-card .row.drop > .row-background { fill: var(--bad-soft); }
        /* theme:diff:end */

        /* svg parts. Card state marks come from the theme:diff block above */
        .table-card-name { color: var(--text); font-size: var(--fs-dia); font-weight: 600; font-family: var(--mono); }
        svg .tag { color: var(--text-3); font-size: var(--fs-dia-sub); font-weight: 600; }
        .row-zebra { fill: var(--text); opacity: 0.025; }
        .row-line { stroke: var(--line); }
        .row .column { color: var(--text); font-size: var(--fs-dia); font-family: var(--mono); }
        .row .type { color: var(--text-3); font-size: var(--fs-dia-sub); }
        .row .key { color: var(--text-3); font-size: var(--fs-dia-sub); font-weight: 700; }
        .foreign-key { fill: none; stroke: var(--connector); stroke-width: 1.4; }
        .foreign-key.new { stroke: var(--add); stroke-width: 1.8; }
        .foreign-key-cardinality { fill: var(--text-2); font-size: var(--fs-dia-sub); font-weight: 700; }
        .foreign-key-dot { fill: var(--connector); }
        .foreign-key-dot.new { fill: var(--add); }
        .table-card { outline: none; cursor: default; }
        svg .table-card:focus-visible > .table-card-box { stroke: var(--accent); stroke-width: 2.4; }
        .dimmed { opacity: 0.25; }

        /* PDF: shrink the diagram to the page width instead of cutting it off. */
        @media print {
            .actions { display: none; }
            .canvas { overflow: visible; }
            .canvas svg { max-width: 100%; height: auto; }
        }
    </style>
</head>

<body>
    <header>
        <div>
            <h1>ER diagram · Feature Name</h1>
            <p class="subtitle">Hover or tab to a table to trace its relations.</p>
        </div>
        <div class="actions">
            <a class="button" href="../overview.html#database">← Overview</a>
        </div>
    </header>

    <div class="canvas" id="er">
        <div class="legend">
            <span><i class="add"></i>new table</span>
            <span><i class="drop"></i>dropped table</span>
            <span><i></i>existing table (amber pill when altered)</span>
            <span><i class="external"></i>external (another service owns it)</span>
            <span><i class="foreign-key"></i>foreign key, column to column</span>
            <span><i class="foreign-key add"></i>new or changed foreign key</span>
        </div>
    </div>

    <script>
        /* theme:pdf-js:start */
        /* Synced from theme/pdf.js by theme/sync.mjs. Do not edit here. */
        function addExportPdf(target, prepare) {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'export-pdf no-print';
            if (!target) {
                target = document.querySelector('.float-bar');
                if (!target) { target = document.createElement('div'); target.className = 'float-bar no-print'; document.body.append(target); }
            }
            b.title = 'Export PDF (pick "Save as PDF" in the print dialog)';
            b.textContent = 'Export PDF';
            b.addEventListener('click', async () => {
                if (prepare) await prepare();
                window.print();
            });
            target.append(b);
            return b;
        }
        /* theme:pdf-js:end */
        addExportPdf();

        // Renders the schema below as SVG. Tables sit on a grid (`at: [col, row]`); FK lines join column rows.
        // cols: [name, type, key, mark?] · mark: add | change | drop · rels: [from "t.col", to "t.col", fromCard, toCard, new?]
        const ER = {
            tables: [
                { id: "table_a", name: "schema.table_a", tag: "altered", at: [0, 0], cols: [
                    ["id", "bigint", "PK"], ["name", "text", "NN"], ["new_column", "text null", "+ add", "add"],
                    ["changed_column", "int → bigint", "~ type", "change"], ["old_column", "text", "− drop", "drop"], ["created_at", "timestamptz", ""],
                ] },
                { id: "table_b", name: "schema.table_b", tag: "new table", at: [1, 0], cols: [
                    ["id", "bigint", "PK"], ["table_a_id", "bigint", "FK"], ["status", "text", "NN"],
                ] },
                { id: "table_c", name: "schema.table_c", tag: "read", at: [1, 1], cols: [
                    ["id", "bigint", "PK"], ["table_a_id", "bigint", "FK"], ["enabled", "boolean", ""],
                ] },
                { id: "table_x", name: "other.table_x", tag: "external", at: [0, 1], cols: [
                    ["id", "bigint", "PK"], ["code", "text", ""],
                ] },
            ],
            rels: [
                ["table_b.table_a_id", "table_a.id", "N", "1", true],
                ["table_c.table_a_id", "table_a.id", "N", "1"],
            ],
        };

        (function render({ tables, rels }) {
            const HEAD = 34, ROW = 26, GX = 110, GY = 44, PAD = 16;
            const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
            // Text is 14px; one width fits every table's longest name, key and type (estimated per character, on the wide side).
            const MONO = 8.6, SANS = 7.9, BOLD = 8.8, PILL = 8.2;
            // new / removed / altered tables get a signed pill; read and external keep a plain tag
            const state = t => /^new/.test(t.tag) ? "add" : /^(removed|dropped)/.test(t.tag) ? "drop" : /altered/.test(t.tag) ? "change" : "";
            const SIGN = { add: "+ ", drop: "− ", change: "~ " };
            const tagText = t => (SIGN[state(t)] || "") + String(t.tag || "");
            const tagW = t => state(t) ? tagText(t).length * PILL + 16 : String(t.tag || "").length * BOLD;
            const widest = (list, per) => Math.max(0, ...list.map(v => String(v || "").length * per));
            const cols = tables.flatMap(t => t.cols);
            const KEY_X = Math.round(12 + widest(cols.map(c => c[0]), MONO) + 20);
            const W = Math.round(Math.max(300, KEY_X + widest(cols.map(c => c[2]), BOLD) + 20 + widest(cols.map(c => c[1]), SANS) + 12,
                ...tables.map(t => 16 + t.name.length * MONO + 20 + tagW(t) + 10)));
            const byId = Object.fromEntries(tables.map(t => [t.id, t]));
            const height = t => HEAD + t.cols.length * ROW;

            // Row tops: each grid row starts below the tallest table of the row above.
            const rowCount = Math.max(...tables.map(t => t.at[1])) + 1;
            const rowTop = [PAD];
            for (let r = 1; r < rowCount; r++) {
                const tallest = Math.max(0, ...tables.filter(t => t.at[1] === r - 1).map(height));
                rowTop[r] = rowTop[r - 1] + tallest + GY;
            }
            tables.forEach(t => { t.x = PAD + t.at[0] * (W + GX); t.y = rowTop[t.at[1]]; });
            const svgW = Math.max(...tables.map(t => t.x + W)) + PAD;
            const svgH = Math.max(...tables.map(t => t.y + height(t))) + PAD;

            const anchor = ref => {
                const [id, col] = ref.split(".");
                const t = byId[id];
                const i = t.cols.findIndex(c => c[0] === col);
                if (i < 0) console.warn(`[er] unknown column ${ref}`);
                return { t, y: t.y + HEAD + Math.max(i, 0) * ROW + ROW / 2 };
            };

            // Lines first so tables paint over them. Each line gets its own lane so parallel elbows don't overlap.
            // Several FKs into one column fan out ±8px around the row centre instead of meeting at one point.
            const into = {}, seen = {};
            rels.forEach(r => { into[r[1]] = (into[r[1]] || 0) + 1; });
            const lines = rels.map(([from, to, fc, tc, isNew], k) => {
                const a = anchor(from), b = anchor(to);
                const n = into[to], i = seen[to] = (seen[to] ?? -1) + 1;
                b.y += n > 1 ? (i - (n - 1) / 2) * Math.min(8, 16 / (n - 1)) : 0;
                const lane = 18 + (k % 6) * 12;
                let ax, bx, x;
                if (a.t.x === b.t.x) {
                    ax = bx = a.t.x + W;
                    x = ax + lane;
                } else {
                    const right = a.t.x < b.t.x;
                    ax = right ? a.t.x + W : a.t.x; bx = right ? b.t.x : b.t.x + W;
                    x = right ? ax + lane : ax - lane;
                }
                const d = `M${ax},${a.y} H${x} V${b.y} H${bx}`;
                const cls = isNew ? "foreign-key new" : "foreign-key";
                return `<g class="relation" data-a="${a.t.id}" data-b="${b.t.id}">`
                    + `<path class="${cls}" d="${d}"/>`
                    + `<circle class="foreign-key-dot${isNew ? " new" : ""}" cx="${bx}" cy="${b.y}" r="3"/>`
                    // each cardinality centers on the level stub it labels: table edge to the lane
                    + `<text class="foreign-key-cardinality" x="${(ax + x) / 2}" y="${a.y - 5}" text-anchor="middle">${esc(fc)}</text>`
                    + (i ? "" : `<text class="foreign-key-cardinality" x="${(x + bx) / 2}" y="${b.y - 9}" text-anchor="middle">${esc(tc)}</text>`)
                    + `<title>${esc(from)} → ${esc(to)}</title></g>`;
            });

            const boxes = tables.map(t => {
                const st = state(t);
                const kind = ["table-card", st, t.tag === "external" ? "external" : ""].filter(Boolean).join(" ");
                const h = height(t), pad = st === "add" || st === "drop" ? 16 : 12;
                const rows = t.cols.map(([col, type, key, mark], i) => {
                    const y = t.y + HEAD + i * ROW;
                    return `<g class="row${mark ? " " + mark : ""}">`
                        + (mark ? `<rect class="row-background" x="${t.x}" y="${y}" width="${W}" height="${ROW}"/>`
                            : i % 2 ? `<rect class="row-zebra" x="${t.x}" y="${y}" width="${W}" height="${ROW}"/>` : "")
                        + (i ? `<line class="row-line" x1="${t.x}" x2="${t.x + W}" y1="${y}" y2="${y}"/>` : "")
                        + `<text class="column" x="${t.x + pad}" y="${y + 18}">${esc(col)}</text>`
                        + `<text class="key" x="${t.x + KEY_X}" y="${y + 18}">${esc(key)}</text>`
                        + `<text class="type" x="${t.x + W - 12}" y="${y + 18}" text-anchor="end">${esc(type)}</text></g>`;
                }).join("");
                // row tints and the gutter bar are clipped to the box's rounded corners
                const clip = `er-clip-${t.id}`;
                const bar = pad === 16 ? `<rect class="table-card-bar" x="${t.x}" y="${t.y}" width="4" height="${h}" clip-path="url(#${clip})"/>` : "";
                const pw = tagW(t), right = t.x + W - 10;
                const tag = !t.tag ? "" : st
                    ? `<g class="tag"><rect x="${right - pw + 0.5}" y="${t.y + 7.5}" width="${pw - 1}" height="19" rx="9.5"/>`
                        + `<text x="${right - pw / 2}" y="${t.y + 21}" text-anchor="middle">${esc(tagText(t))}</text></g>`
                    : `<text class="tag" x="${t.x + W - 12}" y="${t.y + 22}" text-anchor="end">${esc(t.tag)}</text>`;
                return `<g class="${kind}" data-id="${t.id}" tabindex="0" role="group" aria-label="${esc(t.name)}${t.tag ? ", " + esc(t.tag) : ""}">`
                    + `<rect class="table-card-box" x="${t.x}" y="${t.y}" width="${W}" height="${h}" rx="8"/>`
                    + `<path class="table-card-head" d="M${t.x + 1},${t.y + HEAD} V${t.y + 8} a7,7 0 0 1 7,-7 H${t.x + W - 8} a7,7 0 0 1 7,7 V${t.y + HEAD} Z"/>`
                    + `<text class="table-card-name" x="${t.x + pad}" y="${t.y + 22}">${esc(t.name)}</text>`
                    + tag + `<clipPath id="${clip}"><rect x="${t.x}" y="${t.y}" width="${W}" height="${h}" rx="8"/></clipPath>`
                    + `<g clip-path="url(#${clip})">${rows}</g>` + bar + `</g>`;
            });

            const el = document.getElementById("er");
            // the legend inside the canvas stays, under the svg
            el.querySelector(":scope > svg")?.remove();
            el.insertAdjacentHTML("afterbegin", `<svg viewBox="0 0 ${svgW} ${svgH}" width="${svgW}" height="${svgH}" role="img" aria-label="ER diagram, ${tables.length} tables, ${rels.length} foreign keys">${lines.join("")}${boxes.join("")}</svg>`);

            // Hover or focus a table: dim everything not related to it.
            const clear = () => el.querySelectorAll(".dimmed").forEach(n => n.classList.remove("dimmed"));
            el.querySelectorAll(".table-card").forEach(g => {
                const id = g.dataset.id;
                const trace = () => {
                    const near = new Set([id]);
                    el.querySelectorAll(".relation").forEach(r => {
                        const hit = r.dataset.a === id || r.dataset.b === id;
                        r.classList.toggle("dimmed", !hit);
                        if (hit) { near.add(r.dataset.a); near.add(r.dataset.b); }
                    });
                    el.querySelectorAll(".table-card").forEach(t => t.classList.toggle("dimmed", !near.has(t.dataset.id)));
                };
                g.addEventListener("mouseenter", trace);
                g.addEventListener("focus", trace);
                g.addEventListener("mouseleave", () => { if (!g.contains(document.activeElement)) clear(); });
                g.addEventListener("blur", clear);
            });
        })(ER);

    </script>
</body>

</html>
