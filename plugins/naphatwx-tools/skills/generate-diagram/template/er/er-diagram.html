<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ER diagram · Feature Name</title>
    <style>
        /* theme:tokens:start */
        /* Synced from theme/tokens.css by theme/sync.mjs. Do not edit here. */
        :root {
            color-scheme: dark;

            /* Surfaces, darkest first */
            --bg: #121316;
            --surface: #18191d;
            --surface-2: #1f2025;
            --surface-3: #24262c;
            --line: #26282e;
            --line-strong: #363940;
            --line-3: #4a4d55;

            /* Ink. Running text is --text; text-2 / text-3 are for chrome and meta labels only */
            --text: #e2e3e7;
            --text-2: #c6c8cf;
            --text-3: #a3a6b0;

            /* One accent */
            --accent: #8ab0ff;
            --accent-fill: #1b2232;
            --accent-soft: rgba(138, 176, 255, 0.12);

            /* Status: one hue set, two meanings. ok = add / pass, warn = change / flaky, bad = drop / fail */
            --ok: #8fd694;
            --warn: #f0c26b;
            --bad: #f28b8d;
            --neutral: #a3a6b0;
            --ok-soft: rgba(143, 214, 148, 0.12);
            --warn-soft: rgba(240, 194, 107, 0.12);
            --bad-soft: rgba(242, 139, 141, 0.12);
            --neutral-soft: rgba(163, 166, 176, 0.12);
            --add: var(--ok);
            --change: var(--warn);
            --drop: var(--bad);

            /* Diagrams: connectors and their labels */
            --connector: #6b6e78;

            /* Type. ui-monospace first, or macOS Chromium falls back to Courier */
            --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Cascadia Code", monospace;

            /* Type scale. Body text is --fs-md on every page; code and pills --fs-sm. Reports use only
               --fs-lg (title), --fs-md and --fs-sm. Nothing renders below --fs-xs. */
            --fs-xs: 0.75rem;
            --fs-sm: 0.875rem;
            --fs-md: 1rem;
            --fs-lg: 1.25rem;
            --fs-xl: 1.75rem;
            --fs-2xl: 2.75rem;

            /* Page frame: every page centers its content at the same width */
            --page-w: 1200px;
            --gutter: clamp(16px, 3vw, 24px);

            --radius: 6px;
            --radius-lg: 10px;
            --ease: cubic-bezier(0.2, 0, 0, 1);
        }
        /* theme:tokens:end */
        /* theme:base:start */
        /* Synced from theme/base.css by theme/sync.mjs. Do not edit here. */
        *, *::before, *::after { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            -webkit-font-smoothing: antialiased;
        }
        ::selection { background: rgba(138, 176, 255, 0.35); color: #fff; }
        * { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
        a { color: var(--accent); }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        code, kbd, pre, samp { font-family: var(--mono); }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
        }
        /* theme:base:end */

        * { margin: 0; padding: 0; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 8px; }

        body { padding: 40px 24px 48px; }

        header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            max-width: 1400px;
            margin: 0 auto 16px;
        }

        h1 { font-size: 1.75rem; font-weight: 600; letter-spacing: -0.015em; }
        .sub { color: var(--text-3); font-size: 0.875rem; margin-top: 4px; }
        .actions { display: flex; gap: 8px; }

        .btn {
            font: inherit;
            font-size: 0.875rem;
            color: var(--text-2);
            background: var(--surface-2);
            border: 1px solid var(--line-strong);
            border-radius: 8px;
            padding: 6px 12px;
            cursor: pointer;
            text-decoration: none;
        }

        .btn:hover { color: var(--text); }

        .canvas {
            max-width: 1400px;
            margin: 0 auto;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--surface);
            overflow-x: auto;
            padding: 12px;
        }

        /* Scales up to fill the canvas; render() also sets min-width and a max-height floor at 1:1 so text never shrinks below 12px. */
        .canvas svg { display: block; width: 100%; height: auto; max-height: 80vh; margin: 0 auto; font-family: var(--sans); }

        .legend {
            max-width: 1400px;
            margin: 14px auto 0;
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            font-size: 0.8rem;
            color: var(--text-3);
        }

        .legend i { display: inline-block; width: 22px; height: 12px; margin-right: 6px; vertical-align: middle; border: 1.5px solid var(--line-3); border-radius: 3px; }
        .legend .write { border-color: var(--accent); }
        .legend .external { border-style: dashed; }
        .legend .fk { height: 0; border-width: 1.5px 0 0; border-radius: 0; }

        /* svg parts */
        .t-box { fill: var(--surface-2); stroke: var(--line-3); stroke-width: 1.2; }
        .t-box.write { stroke: var(--accent); stroke-width: 1.6; }
        .t-box.external { stroke-dasharray: 5 4; }
        .t-head { fill: var(--surface-3); }
        .t-name { fill: var(--text); font-size: 14px; font-weight: 600; font-family: var(--mono); }
        .t-tag { fill: var(--text-3); font-size: 12px; font-weight: 600; }
        .write .t-tag, .t-tag.write { fill: var(--accent); }
        .r-zebra { fill: var(--text); opacity: 0.025; }
        .r-line { stroke: var(--line); }
        .r-col { fill: var(--text); font-size: 12px; font-family: var(--mono); }
        .r-type { fill: var(--text-3); font-size: 12px; }
        .r-key { fill: var(--text-3); font-size: 12px; font-weight: 700; }
        .r-drop .r-col, .r-drop .r-type { fill: var(--drop); text-decoration: line-through; }
        .r-drop .r-key { fill: var(--drop); }
        .r-add .r-col, .r-add .r-key { fill: var(--add); }
        .r-change .r-col, .r-change .r-key { fill: var(--change); }
        .fk { fill: none; stroke: var(--connector); stroke-width: 1.4; }
        .fk.new { stroke: var(--accent); stroke-width: 1.8; }
        .fk-card { fill: var(--text-2); font-size: 12px; font-weight: 700; }
        .fk-dot { fill: var(--connector); }
        .fk-dot.new { fill: var(--accent); }
        .table { outline: none; cursor: default; }
        .table:focus-visible .t-box { stroke: var(--accent); stroke-width: 2.4; }
        .dim { opacity: 0.25; }
    </style>
</head>

<body>
    <header>
        <div>
            <h1>ER diagram · Feature Name</h1>
            <p class="sub">Hover or tab to a table to trace its relations.</p>
        </div>
        <div class="actions">
            <a class="btn" href="../overview.html#database">← Overview</a>
        </div>
    </header>

    <div class="canvas" id="er"></div>

    <div class="legend">
        <span><i class="write"></i>new table</span>
        <span><i></i>existing table (altered or read)</span>
        <span><i class="external"></i>external (another service owns it)</span>
        <span><i class="fk"></i>foreign key, column to column</span>
        <span><i class="fk write"></i>new or changed foreign key</span>
    </div>

    <script>
        // Renders the schema below as SVG. Tables sit on a grid (`at: [col, row]`); FK lines join column rows.
        // cols: [name, type, key, mark?] · mark: add | change | drop · rels: [from "t.col", to "t.col", fromCard, toCard, new?]
        const ER = {
            tables: [
                { id: "table_a", name: "schema.table_a", tag: "altered", at: [0, 0], cols: [
                    ["id", "bigint", "PK"], ["name", "text", "NN"], ["new_column", "text null", "+ add", "add"],
                    ["changed_column", "int → bigint", "~ type", "change"], ["old_column", "text", "− drop", "drop"], ["created_at", "timestamptz", ""],
                ] },
                { id: "table_b", name: "schema.table_b", tag: "new table", at: [1, 0], cols: [
                    ["id", "bigint", "PK"], ["table_a_id", "bigint", "FK"], ["status", "text", "NN"],
                ] },
                { id: "table_c", name: "schema.table_c", tag: "read", at: [1, 1], cols: [
                    ["id", "bigint", "PK"], ["table_a_id", "bigint", "FK"], ["enabled", "boolean", ""],
                ] },
                { id: "table_x", name: "other.table_x", tag: "external", at: [0, 1], cols: [
                    ["id", "bigint", "PK"], ["code", "text", ""],
                ] },
            ],
            rels: [
                ["table_b.table_a_id", "table_a.id", "N", "1", true],
                ["table_c.table_a_id", "table_a.id", "N", "1"],
            ],
        };

        (function render({ tables, rels }) {
            const W = 310, HEAD = 36, ROW = 26, GX = 150, GY = 70, PAD = 30;
            const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
            const byId = Object.fromEntries(tables.map(t => [t.id, t]));
            const height = t => HEAD + t.cols.length * ROW;

            // Row tops: each grid row starts below the tallest table of the row above.
            const rowCount = Math.max(...tables.map(t => t.at[1])) + 1;
            const rowTop = [PAD];
            for (let r = 1; r < rowCount; r++) {
                const tallest = Math.max(0, ...tables.filter(t => t.at[1] === r - 1).map(height));
                rowTop[r] = rowTop[r - 1] + tallest + GY;
            }
            tables.forEach(t => { t.x = PAD + t.at[0] * (W + GX); t.y = rowTop[t.at[1]]; });
            const svgW = Math.max(...tables.map(t => t.x + W)) + PAD;
            const svgH = Math.max(...tables.map(t => t.y + height(t))) + PAD;

            const anchor = ref => {
                const [id, col] = ref.split(".");
                const t = byId[id];
                const i = t.cols.findIndex(c => c[0] === col);
                if (i < 0) console.warn(`[er] unknown column ${ref}`);
                return { t, y: t.y + HEAD + Math.max(i, 0) * ROW + ROW / 2 };
            };

            // Lines first so tables paint over them. Each line gets its own lane so parallel elbows don't overlap.
            // Several FKs into one column fan out ±8px around the row centre instead of meeting at one point.
            const into = {}, seen = {};
            rels.forEach(r => { into[r[1]] = (into[r[1]] || 0) + 1; });
            const lines = rels.map(([from, to, fc, tc, isNew], k) => {
                const a = anchor(from), b = anchor(to);
                const n = into[to], i = seen[to] = (seen[to] ?? -1) + 1;
                b.y += n > 1 ? (i - (n - 1) / 2) * Math.min(8, 16 / (n - 1)) : 0;
                const lane = 18 + (k % 6) * 12;
                let d, ax, bx, ad, bd;
                if (a.t.x === b.t.x) {
                    ax = bx = a.t.x + W; ad = bd = 1;
                    const x = ax + lane;
                    d = `M${ax},${a.y} H${x} V${b.y} H${bx}`;
                } else {
                    const right = a.t.x < b.t.x;
                    ax = right ? a.t.x + W : a.t.x; bx = right ? b.t.x : b.t.x + W;
                    ad = right ? 1 : -1; bd = -ad;
                    const x = right ? ax + lane : ax - lane;
                    d = `M${ax},${a.y} H${x} V${b.y} H${bx}`;
                }
                const cls = isNew ? "fk new" : "fk";
                return `<g class="rel" data-a="${a.t.id}" data-b="${b.t.id}">`
                    + `<path class="${cls}" d="${d}"/>`
                    + `<circle class="fk-dot${isNew ? " new" : ""}" cx="${bx}" cy="${b.y}" r="3"/>`
                    + `<text class="fk-card" x="${ax + ad * 6}" y="${a.y - 5}" text-anchor="${ad > 0 ? "start" : "end"}">${esc(fc)}</text>`
                    + (i ? "" : `<text class="fk-card" x="${bx + bd * 6}" y="${b.y - 9}" text-anchor="${bd > 0 ? "start" : "end"}">${esc(tc)}</text>`)
                    + `<title>${esc(from)} → ${esc(to)}</title></g>`;
            });

            const boxes = tables.map(t => {
                const kind = t.tag === "new table" ? "write" : t.tag === "external" ? "external" : "";
                const h = height(t);
                const rows = t.cols.map(([col, type, key, mark], i) => {
                    const y = t.y + HEAD + i * ROW;
                    return `<g class="${mark ? "r-" + mark : ""}">`
                        + (i % 2 ? `<rect class="r-zebra" x="${t.x}" y="${y}" width="${W}" height="${ROW}"/>` : "")
                        + (i ? `<line class="r-line" x1="${t.x}" x2="${t.x + W}" y1="${y}" y2="${y}"/>` : "")
                        + `<text class="r-col" x="${t.x + 12}" y="${y + 17}">${esc(col)}</text>`
                        + `<text class="r-key" x="${t.x + 170}" y="${y + 17}">${esc(key)}</text>`
                        + `<text class="r-type" x="${t.x + W - 12}" y="${y + 17}" text-anchor="end">${esc(type)}</text></g>`;
                }).join("");
                return `<g class="table ${kind}" data-id="${t.id}" tabindex="0" role="group" aria-label="${esc(t.name)}${t.tag ? ", " + esc(t.tag) : ""}">`
                    + `<rect class="t-box ${kind}" x="${t.x}" y="${t.y}" width="${W}" height="${h}" rx="8"/>`
                    + `<path class="t-head" d="M${t.x + 1},${t.y + HEAD} V${t.y + 8} a7,7 0 0 1 7,-7 H${t.x + W - 8} a7,7 0 0 1 7,7 V${t.y + HEAD} Z"/>`
                    + `<text class="t-name" x="${t.x + 12}" y="${t.y + 23}">${esc(t.name)}</text>`
                    + `<text class="t-tag${kind === "write" ? " write" : ""}" x="${t.x + W - 12}" y="${t.y + 23}" text-anchor="end">${esc(t.tag || "")}</text>`
                    + rows + `</g>`;
            });

            const el = document.getElementById("er");
            el.innerHTML = `<svg viewBox="0 0 ${svgW} ${svgH}" style="min-width:${svgW}px;max-height:max(80vh, ${svgH}px)" role="img" aria-label="ER diagram, ${tables.length} tables, ${rels.length} foreign keys">${lines.join("")}${boxes.join("")}</svg>`;

            // Hover or focus a table: dim everything not related to it.
            const clear = () => el.querySelectorAll(".dim").forEach(n => n.classList.remove("dim"));
            el.querySelectorAll(".table").forEach(g => {
                const id = g.dataset.id;
                const trace = () => {
                    const near = new Set([id]);
                    el.querySelectorAll(".rel").forEach(r => {
                        const hit = r.dataset.a === id || r.dataset.b === id;
                        r.classList.toggle("dim", !hit);
                        if (hit) { near.add(r.dataset.a); near.add(r.dataset.b); }
                    });
                    el.querySelectorAll(".table").forEach(t => t.classList.toggle("dim", !near.has(t.dataset.id)));
                };
                g.addEventListener("mouseenter", trace);
                g.addEventListener("focus", trace);
                g.addEventListener("mouseleave", () => { if (!g.contains(document.activeElement)) clear(); });
                g.addEventListener("blur", clear);
            });
        })(ER);

    </script>
</body>

</html>
